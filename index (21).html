<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#FFFFFF">
<title>RUSCHA — Ruscha tilini o'rganish</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
/* Runs before any CSS is applied: restores the saved theme so the page paints
   correctly on the very first frame instead of flashing light then dark. */
(function(){
  try{
    var raw = localStorage.getItem("ruscha_progress_v1");
    var t = raw ? (JSON.parse(raw).theme || "light") : "light";
    document.documentElement.setAttribute("data-theme", t);
    if(t === "dark"){
      var m = document.querySelector('meta[name="color-scheme"]');
      if(m) m.setAttribute("content", "dark");
    }
  }catch(e){}
})();
</script>
<style>
  :root{
    /* White + blue. Blue carries every active, selected and primary state;
       text stays near-black (navy-tinted) so long reading passages remain easy. */
    --bg: #FFFFFF;
    --surface: #FFFFFF;
    --surface-soft: #F5F8FD;
    --ink: #0F1B2E;        /* 17.3:1 on white */
    --ink-soft: #5A6B80;   /* 5.5:1  */
    --ink-faint: #68778C;  /* 4.6:1  */
    --line: #DFE6F0;

    --accent: #2563EB;       /* white text on this = 5.2:1 */
    --accent-deep: #1D4ED8;  /* hover / pressed */
    --accent-soft: #EAF1FE;  /* tinted fills */

    /* Feedback only — colour here carries meaning, not style. */
    --good: #1B7F4B;
    --good-bg: #EDF6F0;
    --bad: #C0332E;
    --bad-bg: #FBEEED;

    --radius-lg: 6px;
    --radius-md: 5px;
    --radius-sm: 4px;

    --font-display: 'PT Serif', Georgia, serif;
    --font-body: 'Inter', -apple-system, sans-serif;
    --font-read: 'Inter', -apple-system, 'Segoe UI', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;

    color-scheme: only light;
  }

  /* Dark theme. Same structure, inverted surfaces; the blue is lifted so it stays
     readable on dark backgrounds (the light-theme blue is too heavy here). */
  [data-theme="dark"]{
    --bg: #1E252E;
    --surface: #242C36;
    --surface-soft: #2C3541;
    --ink: #E8EDF3;
    --ink-soft: #A3AFBE;
    --ink-faint: #8593A3;
    --line: #384352;

    --accent: #6BA5FF;
    --accent-deep: #8CBBFF;
    --accent-soft: #2C3B52;

    --good: #5FD39A;
    --good-bg: #1E3A2C;
    --bad: #FF9189;
    --bad-bg: #3A2624;

    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:var(--font-display); margin:0; color:var(--ink); font-weight:700;}
  p{margin:0;}
  button{font-family:var(--font-body);}
  ::selection{background:var(--accent); color:#fff;}

  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px;}

  a{color:inherit;}

  /* ===== Layout shell ===== */
  .app-shell{
    display:grid;
    grid-template-columns: 252px 1fr;
    min-height:100vh;
  }

  /* ===== Sidebar ===== */
  .sidebar{
    background: var(--bg);
    color:var(--ink);
    padding:30px 20px;
    display:flex;
    flex-direction:column;
    position:sticky;
    top:0;
    height:100vh;
    border-right:1px solid var(--line);
  }
  .brand{
    display:block;
    padding:0 6px 28px;
    font-family:var(--font-display);
    font-weight:700;
    font-size:23px;
    letter-spacing:-.01em;
    color:var(--accent);
  }
  .brand small{
    display:block; font-family:var(--font-mono); font-weight:500;
    font-size:9.5px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--ink-faint); margin-top:7px;
  }

  .nav-list{display:flex; flex-direction:column; gap:1px; margin-top:4px;}
  .nav-item{
    display:flex; align-items:center; gap:12px;
    padding:11px 12px; border-radius:var(--radius-sm);
    color:var(--ink-soft);
    font-weight:500; font-size:14.5px;
    cursor:pointer; border:none; background:transparent;
    text-align:left; width:100%;
    transition: background .12s ease, color .12s ease;
  }
  .nav-item svg{flex-shrink:0; opacity:.75;}
  .nav-item:hover{background:var(--surface-soft); color:var(--ink);}
  .nav-item.active{background:var(--accent); color:#fff; font-weight:600;}
  .nav-item.active svg{opacity:1;}

  .sidebar-foot{margin-top:auto; padding-top:18px; border-top:1px solid var(--line);}
  .reset-link{
    background:none; border:none; color:var(--ink-faint);
    font-size:12px; cursor:pointer; padding:6px; text-decoration:underline;
    text-underline-offset:3px;
  }
  .reset-link:hover{color:var(--ink);}

  /* ===== Mobile bottom nav ===== */
  .bottom-nav{display:none;}

  /* ===== Main ===== */
  .main{
    padding:30px 40px 90px;
    max-width:1120px;
    width:100%;
    margin:0 auto;
  }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    gap:16px; flex-wrap:wrap; margin-bottom:26px;
  }
  .topbar-title{font-family:var(--font-display); font-size:24px; font-weight:700; letter-spacing:-.01em;}
  .topbar-right{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}

  .level-switch{
    display:flex; border:1px solid var(--line);
    border-radius:var(--radius-sm); padding:0; gap:0; overflow:hidden;
  }
  .level-switch button{
    border:none; border-right:1px solid var(--line); background:var(--bg);
    padding:9px 15px;
    font-weight:500; font-size:12.5px; color:var(--ink-soft); cursor:pointer;
    transition: background .12s, color .12s;
  }
  .level-switch button:last-child{border-right:none;}
  .level-switch button:hover{background:var(--surface-soft); color:var(--ink);}
  .level-switch button.active{background:var(--accent); color:#fff;}

  .stat-pill{
    display:flex; gap:6px; align-items:center; background:var(--bg);
    border:1px solid var(--line); padding:8px 13px; border-radius:var(--radius-sm);
    font-family:var(--font-mono); font-size:12px; font-weight:500; color:var(--ink-soft);
  }
  .stat-pill b{font-family:var(--font-mono); font-weight:700; color:var(--ink);}

  /* ===== Views ===== */
  .view{display:none;}
  .view.active{display:block; animation: fadein .35s ease;}
  @keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){
    .view.active{animation:none;}
    *{transition:none !important; animation:none !important;}
  }

  /* ===== Hero ===== */
  .hero{
    position:relative; overflow:hidden;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-deep) 100%);
    border-radius: var(--radius-lg);
    padding:46px 42px;
    color:#fff;
    margin-bottom:34px;
  }
  /* a faint rule pattern, so the block has some texture without any imagery */
  .hero::after{
    content:""; position:absolute; right:-60px; top:-60px;
    width:280px; height:280px; border-radius:50%;
    border:1px solid rgba(255,255,255,.16);
    box-shadow:0 0 0 34px rgba(255,255,255,.05);
    pointer-events:none;
  }
  .hero-inner{position:relative; z-index:1;}
  .hero h1{font-family:var(--font-display); font-size:clamp(24px,3.3vw,35px); color:#fff; letter-spacing:-.015em; line-height:1.25; margin:0;}
  .hero p{font-size:14.5px; color:rgba(255,255,255,.88); max-width:460px; line-height:1.6;}
  .hero-ring{flex-shrink:0;}
  .hero-stat{text-align:right;}
  .hero-stat .num{font-family:var(--font-display); font-size:44px; font-weight:700; line-height:1; color:#fff;}
  .hero-stat .lbl{font-family:var(--font-mono); font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:rgba(255,255,255,.5); margin-top:7px;}

  /* ===== Cards / grids ===== */
  .section-title{
    display:flex; align-items:baseline; justify-content:space-between;
    margin:4px 0 20px; gap:14px; padding-bottom:12px;
    border-bottom:1px solid var(--line);
  }
  .section-title h2{font-family:var(--font-display); font-size:21px; font-weight:700; letter-spacing:-.015em;}
  .section-title span{font-size:11px; color:var(--ink-faint); font-family:var(--font-mono); letter-spacing:.06em; text-transform:uppercase;}

  .module-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; margin-bottom:34px;}
  /* Cards lift on a left accent rule rather than a heavy border, so a grid of
     them reads as a calm list instead of a wall of boxes. */
  .module-card{
    position:relative; overflow:hidden;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md);
    padding:22px 22px 20px; cursor:pointer;
    transition: border-color .14s ease, transform .14s ease, box-shadow .14s ease;
    display:flex; flex-direction:column; gap:9px;
  }
  .module-card::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
    background:var(--accent); transform:scaleY(0); transform-origin:top;
    transition:transform .18s ease;
  }
  .module-card:hover{
    border-color:var(--accent);
    transform:translateY(-2px);
    box-shadow:0 6px 20px rgba(37,99,235,.10);
  }
  .module-card:hover::before{transform:scaleY(1);}
  [data-theme="dark"] .module-card:hover{box-shadow:0 6px 22px rgba(0,0,0,.35);}
  .module-card .icon-badge{
    width:34px; height:34px; border-radius:var(--radius-sm); display:flex; align-items:center; justify-content:center;
    background:var(--accent-soft); color:var(--accent); border:1px solid transparent;
  }
  .module-card h3{font-family:var(--font-display); font-size:17.5px; font-weight:700; line-height:1.28; letter-spacing:-.01em;}
  .module-card p{font-size:13px; color:var(--ink-soft); line-height:1.55;}
  .module-card .prog{
    margin-top:auto; padding-top:6px;
    font-size:10.5px; font-family:var(--font-mono); color:var(--ink-faint);
    font-weight:500; letter-spacing:.05em; text-transform:uppercase;
  }

  .panel{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md);
    padding:30px 32px; margin-bottom:20px;
  }

  /* generic small buttons */
  .btn{
    border:1px solid transparent; border-radius:var(--radius-sm); padding:10px 20px;
    font-weight:500; font-size:13.5px; font-family:var(--font-body);
    cursor:pointer; transition: background .12s ease, color .12s ease, border-color .12s ease;
    display:inline-flex; align-items:center; gap:8px;
  }
  .btn-primary{background:var(--accent); color:#fff; border-color:var(--accent);}
  .btn-primary:hover{background:var(--accent-deep); border-color:var(--accent-deep);}
  .btn-ghost{background:var(--bg); color:var(--ink); border-color:var(--line);}
  .btn-ghost:hover{border-color:var(--accent); color:var(--accent); background:var(--surface-soft);}
  .btn-warm{background:var(--bg); color:var(--accent); border-color:var(--accent);}
  .btn-warm:hover{background:var(--accent); color:#fff;}
  .btn:disabled{opacity:.35; cursor:not-allowed;}
  .btn:disabled:hover{background:var(--bg); color:var(--ink); border-color:var(--line);}
  .btn-sm{padding:7px 14px; font-size:12.5px;}

  .divider-star{display:flex; align-items:center; margin:26px 0;}
  .divider-star::before{content:""; height:1px; background:var(--line); flex:1;}

  /* Flashcards */
  .flashcard-wrap{perspective:1400px; width:100%; max-width:430px;}
  .flashcard{position:relative; width:100%; min-height:340px; transform-style:preserve-3d; transition:transform .5s ease; cursor:pointer;}
  .flashcard.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute; inset:0; backface-visibility:hidden; border-radius:var(--radius-md);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px 22px; text-align:center; overflow-y:auto;
  }
  .face.front{background:var(--surface); border:1px solid var(--accent);}
  .face.back{background:var(--accent); color:#fff; transform:rotateY(180deg);}

  .card-ex{
    border-top:1px solid rgba(255,255,255,.28); padding-top:13px; margin-top:4px;
    width:100%; max-width:330px;
  }
  .card-ex-ru{
    font-family:var(--font-read); font-size:14.5px; line-height:1.5;
    color:#fff; margin-bottom:7px;
  }
  .card-ex-uz{
    font-size:12.5px; line-height:1.45; color:rgba(255,255,255,.72); font-style:italic;
  }
  .card-ex-play{
    margin-top:12px; background:transparent; border:1px solid rgba(255,255,255,.4);
    color:#fff; font-family:var(--font-body); font-size:11.5px; padding:6px 12px;
    border-radius:var(--radius-sm); cursor:pointer; transition:background .12s;
  }
  .card-ex-play:hover{background:rgba(255,255,255,.16);}

  /* Dictation / Speaking exercise blocks */
  .ex-block{border:1px solid var(--line); border-radius:var(--radius-md); padding:22px; margin-bottom:14px; background:var(--surface);}
  .ex-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:10px; flex-wrap:wrap;}
  .ex-num{font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint); letter-spacing:.05em; text-transform:uppercase;}
  textarea, input[type=text]{
    width:100%; border:1px solid var(--line); border-radius:var(--radius-sm); padding:12px 14px;
    font-family:var(--font-body); font-size:14.5px; background:var(--bg); color:var(--ink);
    resize:vertical;
  }
  textarea:focus, input[type=text]:focus{outline:none; border-color:var(--accent);}
  .feedback{margin-top:12px; padding:13px 15px; border-radius:var(--radius-sm); font-size:13.5px; line-height:1.55; border:1px solid var(--line);}
  .feedback.good{background:var(--good-bg); color:var(--good); border-color:var(--good);}
  .feedback.bad{background:var(--bad-bg); color:var(--bad); border-color:var(--bad);}
  .word-chip{display:inline-block; padding:2px 7px; border-radius:var(--radius-sm); margin:2px 3px 2px 0; font-size:13.5px; font-family:var(--font-mono);}
  .word-chip.ok{background:var(--good-bg); color:var(--good);}
  .word-chip.no{background:var(--bad-bg); color:var(--bad); text-decoration:line-through;}
  .mic-btn{
    width:60px; height:60px; border-radius:50%; border:1px solid var(--accent); background:var(--bg); color:var(--accent);
    font-size:22px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition: background .15s, color .15s;
  }
  .mic-btn:hover{background:var(--surface-soft);}
  .mic-btn.listening{background:var(--accent); color:#fff; animation: pulse 1.2s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(37,99,235,.35);}70%{box-shadow:0 0 0 15px rgba(37,99,235,0);}100%{box-shadow:0 0 0 0 rgba(37,99,235,0);}}
  .score-badge{font-family:var(--font-mono); font-weight:700; font-size:14px; padding:5px 12px; border-radius:var(--radius-sm); border:1px solid currentColor;}
  .hint-chip{display:inline-block; background:var(--surface-soft); color:var(--ink-soft); border:1px solid var(--line); font-family:var(--font-mono); font-size:11.5px; padding:4px 9px; border-radius:var(--radius-sm); margin:3px 4px 3px 0;}
  .word-count{font-family:var(--font-mono); font-size:12.5px; color:var(--ink-soft); margin-top:6px;}
  .glossary-item{display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px dashed var(--line); font-size:13.5px;}
  .glossary-item:last-child{border-bottom:none;}
  .article-text{
    font-family:var(--font-read);
    font-size:var(--article-fs, 17px); line-height:1.72; margin-bottom:6px; color:var(--ink);
  }
  .article-quote{
    border-left:3px solid var(--accent); padding:4px 0 4px 20px; margin:24px 0;
    font-family:var(--font-read); font-style:normal; font-weight:600;
    font-size:calc(var(--article-fs, 17px) * 1.04);
    color:var(--ink); line-height:1.6;
  }
  .article-byline{margin-bottom:20px; padding-bottom:16px; border-bottom:1px solid var(--line);}
  .article-byline b{font-size:13.5px; font-family:var(--font-body); font-weight:600;}
  .article-byline span{display:block; font-size:12px; color:var(--ink-soft); margin-top:2px;}
  details.qa{border:1px solid var(--line); border-radius:var(--radius-sm); padding:10px 14px; margin-top:10px; background:var(--surface-soft);}
  details.qa summary{cursor:pointer; font-weight:600; font-size:13.5px;}

  /* Article list badges */
  .badge-row{display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-bottom:10px;}
  .badge{
    font-family:var(--font-mono); font-size:9.5px; font-weight:600; padding:3px 8px;
    border-radius:var(--radius-sm); letter-spacing:.07em; text-transform:uppercase;
    border:1px solid var(--line); color:var(--ink-soft); background:var(--bg);
  }
  .badge-level{border-color:var(--accent); color:var(--accent);}
  .badge-new{background:var(--accent); color:#fff; border-color:var(--accent);}
  .badge-time{color:var(--ink-faint);}
  .badge-done{border-color:var(--good); color:var(--good);}

  .badge-kind{border-color:var(--accent); color:var(--accent); background:var(--accent-soft);}

  /* CEFR filter pills with counts */
  .cefr-pill-count{opacity:.5; font-size:10.5px; margin-left:4px; font-family:var(--font-mono);}

  /* Font size control */
  .font-ctrl{display:flex; align-items:center; border:1px solid var(--line); border-radius:var(--radius-sm); overflow:hidden;}
  .font-ctrl button{
    border:none; border-right:1px solid var(--line); background:var(--bg); width:32px; height:30px; cursor:pointer;
    font-family:var(--font-body); font-weight:600; color:var(--ink-soft); font-size:12.5px;
  }
  .font-ctrl button:last-child{border-right:none;}
  .font-ctrl button:hover{background:var(--accent); color:#fff;}

  /* Reading nav (prev/next between articles) */
  .read-nav{display:flex; justify-content:space-between; margin-top:26px; padding-top:20px; border-top:1px solid var(--line); gap:10px;}
  .read-nav button:disabled{opacity:.3; cursor:not-allowed;}

  /* TRKI reading comprehension.
     Signature element: the lettered options are drawn as answer-sheet bubbles —
     the same artifact a student fills in on the real ТРКИ paper. The bubble fills
     solid on selection, so the answered state reads at a glance like a marked sheet. */
  .trki-item{border-top:1px solid var(--line); padding:22px 0 24px; margin:0; background:transparent;}
  .trki-item:first-child{border-top:none; padding-top:6px;}
  .trki-stem{
    font-family:var(--font-read); font-size:16px; font-weight:700;
    margin-bottom:16px; line-height:1.5; color:var(--ink);
  }
  .trki-options{display:flex; flex-direction:column; gap:2px;}
  .trki-opt{
    display:flex; gap:13px; align-items:flex-start; text-align:left; width:100%;
    border:1px solid transparent; background:transparent; color:var(--ink);
    font-family:var(--font-read); font-size:15px; line-height:1.5; padding:9px 12px;
    border-radius:var(--radius-sm); cursor:pointer;
    transition: background .12s ease, border-color .12s ease;
  }
  .trki-opt:hover{background:var(--surface-soft);}
  .trki-opt .letter{
    flex-shrink:0; width:25px; height:25px; border-radius:50%;
    border:1.5px solid #C3CFDF; color:var(--ink-soft);
    font-family:var(--font-mono); font-weight:600; font-size:11.5px;
    display:flex; align-items:center; justify-content:center; margin-top:1px;
    transition: background .12s ease, border-color .12s ease, color .12s ease;
  }
  .trki-opt:hover .letter{border-color:var(--accent); color:var(--accent);}

  .trki-opt.picked-correct{background:var(--good-bg); border-color:var(--good);}
  .trki-opt.picked-correct .letter{background:var(--good); border-color:var(--good); color:#fff;}
  .trki-opt.picked-wrong{background:var(--bad-bg); border-color:var(--bad);}
  .trki-opt.picked-wrong .letter{background:var(--bad); border-color:var(--bad); color:#fff;}
  .trki-opt.reveal-correct{border-color:var(--good);}
  .trki-opt.reveal-correct .letter{border-color:var(--good); color:var(--good);}
  .trki-opt[disabled]{cursor:default;}
  .trki-opt[disabled]:hover{background:transparent;}
  .trki-opt.picked-correct[disabled]:hover{background:var(--good-bg);}
  .trki-opt.picked-wrong[disabled]:hover{background:var(--bad-bg);}

  .trki-score{
    display:flex; align-items:center; justify-content:space-between; padding:16px 20px;
    background:var(--accent); color:#fff; border-radius:var(--radius-sm); margin-top:18px;
    font-weight:500; font-size:14px;
  }
  .trki-score b, .trki-score span:last-child{font-family:var(--font-mono); font-weight:600;}


  /* On dark, the accent is light — flip hero/card-back text to dark for contrast */
  [data-theme="dark"] .hero h1,
  [data-theme="dark"] .face.back,
  [data-theme="dark"] .trki-score,
  [data-theme="dark"] .nav-item.active,
  [data-theme="dark"] .level-switch button.active,
  [data-theme="dark"] .act-switch button.active,
  [data-theme="dark"] .btn-primary,
  [data-theme="dark"] .badge-new,
  [data-theme="dark"] .match-item.picked,
  [data-theme="dark"] .cyr-pad button:hover,
  [data-theme="dark"] .font-ctrl button:hover,
  [data-theme="dark"] .mic-btn.listening{ color:#0E141B; }
  [data-theme="dark"] .card-ex-ru{ color:#0E141B; }
  [data-theme="dark"] .card-ex-uz{ color:rgba(14,20,27,.7); }
  [data-theme="dark"] .card-ex-play{ color:#0E141B; border-color:rgba(14,20,27,.35); }
  [data-theme="dark"] .card-ex{ border-top-color:rgba(14,20,27,.25); }
  [data-theme="dark"] ::selection{ background:var(--accent); color:#0E141B; }

  /* theme toggle */
  .theme-btn{
    display:flex; align-items:center; justify-content:center;
    width:38px; height:38px; border:1px solid var(--line); background:var(--bg);
    border-radius:var(--radius-sm); cursor:pointer; color:var(--ink-soft);
    transition:border-color .12s, color .12s;
  }
  .theme-btn:hover{border-color:var(--accent); color:var(--accent);}

  /* Reading focus mode. The chrome steps aside and the article loses its panel
     box entirely, so the text sits directly on the page like a printed column
     rather than inside a card. Width is capped for legibility, not by the layout. */
  body.reading .sidebar,
  body.reading .topbar,
  body.reading .bottom-nav{ display:none !important; }
  body.reading .app-shell{ grid-template-columns:1fr; }
  body.reading .main{ max-width:100%; padding:30px 26px 100px; }
  body.reading .view{ max-width:830px; margin:0 auto; }
  body.reading .panel{
    border:none; background:transparent; padding:0; margin:0;
  }
  body.reading .article-text,
  body.reading .article-quote{ max-width:none; }
  body.reading .ex-head{ align-items:flex-start; }
  @media (max-width:880px){
    body.reading .main{ padding:20px 18px 60px; }
  }
  .read-exit{
    display:flex; align-items:center; gap:8px; margin-bottom:20px;
    background:none; border:none; cursor:pointer; padding:6px 0;
    font-family:var(--font-body); font-size:14px; color:var(--ink-soft);
  }
  .read-exit:hover{ color:var(--accent); }

  /* Completed state: a card recedes instead of shouting, so unfinished work
     stays visually dominant in a long list. */
  .module-card.is-done{background:var(--surface-soft); border-color:var(--line);}
  .module-card.is-done h3{color:var(--ink-soft);}
  .module-card.is-done:hover{border-color:var(--accent);}
  .done-tick{
    position:absolute; top:14px; right:16px;
    width:22px; height:22px; border-radius:50%;
    background:var(--good); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:12px; line-height:1;
  }
  .ep-row.is-done .ep-title{color:var(--ink-soft);}
  .ep-row.is-done .ep-num{background:var(--good); border-color:var(--good); color:#fff;}
  .ep-bar{
    display:block; height:3px; background:var(--line);
    border-radius:2px; overflow:hidden; margin-top:7px; max-width:220px;
  }
  .ep-bar span{display:block; height:100%; background:var(--accent);}

  /* Progress panel: three bars answering "where am I", plus a seven-day strip.
     Only shown once there is real activity, so a blank profile is never framed
     as failure. */
  .stats{
    display:grid; grid-template-columns:1fr auto; gap:26px;
    align-items:center; padding:20px 24px; margin-bottom:30px;
    border:1px solid var(--line); border-radius:var(--radius-md);
  }
  .stats-bars{display:flex; flex-direction:column; gap:11px; min-width:0;}
  .stat-row{
    display:grid; grid-template-columns:74px 1fr auto; gap:14px;
    align-items:center; width:100%; background:none; border:none;
    padding:2px 0; cursor:pointer; text-align:left;
  }
  .stat-row:hover .stat-name{color:var(--accent);}
  .stat-name{font-family:var(--font-body); font-size:13.5px; font-weight:500; color:var(--ink);}
  .stat-bar{height:6px; background:var(--surface-soft); border-radius:3px; overflow:hidden;}
  .stat-bar span{display:block; height:100%; background:var(--accent); border-radius:3px; transition:width .4s ease;}
  .stat-num{font-family:var(--font-mono); font-size:13px; color:var(--ink); white-space:nowrap;}
  .stat-num span{color:var(--ink-faint); font-size:11.5px;}

  .stats-week{display:flex; flex-direction:column; gap:8px; align-items:flex-start;}
  .stats-week-label{
    font-family:var(--font-mono); font-size:10px; letter-spacing:.06em;
    text-transform:uppercase; color:var(--ink-faint);
  }
  .week-dots{display:flex; gap:5px;}
  .wd{
    width:26px; height:26px; border-radius:50%; border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-size:9.5px; color:var(--ink-faint);
  }
  .wd.on{background:var(--accent); border-color:var(--accent); color:#fff;}
  [data-theme="dark"] .wd.on{color:#0E141B;}
  .wd.today{box-shadow:0 0 0 2px var(--accent-soft);}
  .wd i{font-style:normal;}

  @media (max-width:640px){
    .stats{grid-template-columns:1fr; gap:18px;}
    .stat-row{grid-template-columns:66px 1fr auto;}
  }

  /* Resume card: the first thing a returning learner sees, so it reads as a
     single tappable row rather than another box in the grid. */
  .resume-card{
    display:grid; width:100%; text-align:left; cursor:pointer;
    grid-template-columns:1fr auto; grid-template-rows:auto auto auto;
    gap:2px 16px; align-items:center;
    background:var(--surface); border:1px solid var(--accent);
    border-radius:var(--radius-md); padding:18px 22px; margin-bottom:30px;
    transition:background .12s ease, box-shadow .12s ease;
  }
  .resume-card:hover{background:var(--accent-soft); box-shadow:0 4px 16px rgba(37,99,235,.10);}
  [data-theme="dark"] .resume-card:hover{box-shadow:0 4px 18px rgba(0,0,0,.35);}
  .resume-label{
    grid-column:1; font-family:var(--font-mono); font-size:10px;
    letter-spacing:.09em; text-transform:uppercase; color:var(--accent);
  }
  .resume-title{
    grid-column:1; font-family:var(--font-display); font-size:19px;
    font-weight:700; color:var(--ink); line-height:1.3;
  }
  .resume-meta{grid-column:1; font-size:12.5px; color:var(--ink-soft);}
  .resume-go{
    grid-column:2; grid-row:1 / span 3; font-size:22px; color:var(--accent);
    padding-left:6px;
  }
  .resume-bar{
    grid-column:1; height:3px; background:var(--line);
    border-radius:2px; overflow:hidden; margin-top:8px;
  }
  .resume-bar span{display:block; height:100%; background:var(--accent);}

  /* On-screen Cyrillic keyboard for dictation. Sized for thumbs on a phone and
     for a glance on desktop; hidden by choice for anyone with a real layout. */
  .kb-wrap{margin-top:12px;}
  .kb-toggle{
    background:none; border:none; cursor:pointer; padding:4px 0;
    font-family:var(--font-body); font-size:12.5px; color:var(--accent);
  }
  .kb-toggle:hover{text-decoration:underline; text-underline-offset:3px;}
  .kb{
    margin-top:8px; padding:10px; border:1px solid var(--line);
    border-radius:var(--radius-md); background:var(--surface-soft);
    display:flex; flex-direction:column; gap:5px;
  }
  .kb-row{display:flex; gap:4px; justify-content:center;}
  .kb-key{
    flex:1 1 0; min-width:0; height:38px;
    border:1px solid var(--line); background:var(--bg); color:var(--ink);
    border-radius:6px; cursor:pointer;
    font-family:var(--font-read); font-size:15px; line-height:1;
    transition:background .1s ease, border-color .1s ease;
  }
  .kb-key:hover{border-color:var(--accent); color:var(--accent);}
  .kb-key:active{background:var(--accent); border-color:var(--accent); color:#fff;}
  [data-theme="dark"] .kb-key:active{color:#0E141B;}
  .kb-yo{background:var(--accent-soft); color:var(--accent);}
  .kb-wide{flex:1.6 1 0;}
  .kb-space{flex:5 1 0; font-family:var(--font-body); font-size:12px; color:var(--ink-soft);}
  .kb-punct{flex:.8 1 0; color:var(--ink-soft);}
  .kb-num{height:32px; font-family:var(--font-mono); font-size:13.5px; color:var(--ink-soft);}
  .kb-nums{margin-bottom:2px;}

  @media (max-width:640px){
    .kb{padding:7px;}
    .kb-row{gap:3px;}
    .kb-key{height:36px; font-size:14.5px;}
    .kb-space{font-size:11px;}
  }

  /* A thin coloured edge per CEFR level. With 36 articles a full thumbnail grid
     would bury the titles; this keeps the list scannable by level while leaving
     the card itself quiet. */
  .art-card{border-left-width:3px; border-left-style:solid;}
  .art-card.lvl-a1{border-left-color:#1E9E63;}
  .art-card.lvl-a2{border-left-color:#189C9C;}
  .art-card.lvl-b1{border-left-color:#2563EB;}
  .art-card.lvl-b2{border-left-color:#7A55C9;}
  .art-card.lvl-c1{border-left-color:#C97A16;}
  .art-card.is-done{border-left-color:var(--line);}

  [data-theme="dark"] .art-card.lvl-a1{border-left-color:#4FC48C;}
  [data-theme="dark"] .art-card.lvl-a2{border-left-color:#43BFBF;}
  [data-theme="dark"] .art-card.lvl-b1{border-left-color:#6BA5FF;}
  [data-theme="dark"] .art-card.lvl-b2{border-left-color:#A98BFF;}
  [data-theme="dark"] .art-card.lvl-c1{border-left-color:#E0A64A;}

  /* the accent rule that slides in on hover would fight the level edge */
  .art-card::before{display:none;}

  /* Dictation series grid: thumbnail, title, level, lesson count. Compact enough
     that a dozen collections stay scannable at a glance. */
  .ser-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:12px;}
  .ser-card{
    display:flex; gap:14px; align-items:flex-start; width:100%; text-align:left;
    cursor:pointer; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius-md); padding:14px;
    transition:border-color .14s ease, transform .14s ease, box-shadow .14s ease;
  }
  .ser-card:hover{border-color:var(--accent); transform:translateY(-2px); box-shadow:0 6px 18px rgba(0,0,0,.08);}
  [data-theme="dark"] .ser-card:hover{box-shadow:0 6px 20px rgba(0,0,0,.4);}
  .ser-card.is-done{background:var(--surface-soft);}
  .ser-card.is-done .ser-title{color:var(--ink-soft);}

  .ser-thumb{width:66px; height:66px; flex-shrink:0; border-radius:12px; display:block;}
  .ser-body{flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; padding-top:2px;}
  .ser-top{display:flex; align-items:center; gap:7px; flex-wrap:wrap;}
  .ser-title{
    font-family:var(--font-display); font-size:16px; font-weight:700;
    color:var(--ink); line-height:1.25; letter-spacing:-.01em;
  }
  .ser-tag{
    font-family:var(--font-mono); font-size:9px; letter-spacing:.06em; text-transform:uppercase;
    padding:2px 6px; border-radius:4px; background:var(--accent-soft); color:var(--accent);
  }
  .ser-tag.done{background:var(--good-bg); color:var(--good);}
  .ser-meta{font-size:12.5px; color:var(--ink-soft); line-height:1.45;}
  .ser-bar{display:block; height:3px; background:var(--line); border-radius:2px; overflow:hidden; margin-top:5px;}
  .ser-bar span{display:block; height:100%; background:var(--accent);}

  /* Activity chooser. Tints stay muted so the page reads as one family rather
     than four unrelated buttons; only the icon carries the colour. */
  .act-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px; margin-bottom:22px;}
  .act-card{
    display:flex; flex-direction:column; align-items:flex-start; gap:8px;
    text-align:left; width:100%; cursor:pointer; position:relative; overflow:hidden;
    background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius-md); padding:24px 22px 22px;
    transition:transform .14s ease, border-color .14s ease, box-shadow .14s ease;
  }
  .act-card:hover{transform:translateY(-2px); box-shadow:0 6px 20px rgba(0,0,0,.07);}
  [data-theme="dark"] .act-card:hover{box-shadow:0 6px 22px rgba(0,0,0,.4);}
  .act-ico{
    width:46px; height:46px; border-radius:13px; margin-bottom:4px;
    display:flex; align-items:center; justify-content:center;
  }
  .act-label{font-family:var(--font-display); font-size:17.5px; font-weight:700; color:var(--ink); letter-spacing:-.01em;}
  .act-desc{font-size:13px; color:var(--ink-soft); line-height:1.5;}

  .tint-blue   .act-ico{background:#E8F0FE; color:#2563EB;}
  .tint-violet .act-ico{background:#EFEAFD; color:#6D48D7;}
  .tint-green  .act-ico{background:#E4F5EC; color:#186E41;}
  .tint-amber  .act-ico{background:#FCF0DF; color:#965C08;}
  .tint-blue:hover  {border-color:#2563EB;}
  .tint-violet:hover{border-color:#6D48D7;}
  .tint-green:hover {border-color:#186E41;}
  .tint-amber:hover {border-color:#965C08;}

  [data-theme="dark"] .tint-blue   .act-ico{background:#1B2942; color:#7FB2FF;}
  [data-theme="dark"] .tint-violet .act-ico{background:#282142; color:#A98BFF;}
  [data-theme="dark"] .tint-green  .act-ico{background:#16301F; color:#5FD39A;}
  [data-theme="dark"] .tint-amber  .act-ico{background:#33280F; color:#E0A64A;}
  [data-theme="dark"] .tint-blue:hover  {border-color:#7FB2FF;}
  [data-theme="dark"] .tint-violet:hover{border-color:#A98BFF;}
  [data-theme="dark"] .tint-green:hover {border-color:#5FD39A;}
  [data-theme="dark"] .tint-amber:hover {border-color:#E0A64A;}

  /* ===== article vocabulary panel =====
     Cards hide their translation until tapped, so the strip works as recall
     practice. Revealing one card expands its definition and example inline. */
  .artvocab{
    margin:30px 0 6px; padding:22px 24px;
    background:var(--surface-soft); border-radius:var(--radius-md);
  }
  .artvocab-head{
    display:flex; align-items:center; justify-content:space-between;
    gap:14px; flex-wrap:wrap; margin-bottom:16px;
  }
  .artvocab-title{font-family:var(--font-display); font-size:17px; font-weight:700;}
  .artvocab-count{
    font-family:var(--font-mono); font-size:11px; color:var(--ink-faint);
    margin-left:10px; letter-spacing:.05em; text-transform:uppercase;
  }
  .artvocab-tools{display:flex; gap:8px; flex-wrap:wrap;}

  .artvocab-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:8px;}
  .av-card{
    display:flex; flex-direction:column; align-items:flex-start; gap:3px;
    text-align:left; width:100%; cursor:pointer;
    background:var(--bg); border:1px solid var(--line);
    border-radius:var(--radius-sm); padding:11px 13px;
    transition:border-color .12s ease, background .12s ease;
  }
  .av-card:hover{border-color:var(--accent);}
  .av-term{font-family:var(--font-read); font-size:15.5px; font-weight:600; color:var(--ink); line-height:1.3;}
  .av-uz{
    font-size:13px; color:var(--accent); font-weight:500;
    filter:blur(4px); opacity:.55; transition:filter .15s ease, opacity .15s ease;
    user-select:none;
  }
  .av-card.open .av-uz,
  .artvocab-grid.reveal-all .av-uz{filter:none; opacity:1; user-select:auto;}
  .av-more{display:none; margin-top:6px;}
  .av-card.open .av-more{display:block;}
  .av-def{display:block; font-size:12.5px; color:var(--ink-soft); line-height:1.5;}
  .av-ex{
    display:block; font-family:var(--font-read); font-size:13px; line-height:1.5;
    margin-top:6px; padding-left:10px; border-left:2px solid var(--accent); color:var(--ink);
  }

  .av-test{margin-top:18px; padding:20px; background:var(--bg); border:1px solid var(--line); border-radius:var(--radius-md);}
  .av-word{font-family:var(--font-read); font-size:26px; font-weight:700; margin:8px 0 16px;}
  .av-result{text-align:center; padding:8px 0;}
  .av-score{font-family:var(--font-display); font-size:40px; font-weight:700; line-height:1;}
  .av-result p{color:var(--ink-soft); margin:10px 0 18px; font-size:14px;}

  /* ===== article grammar exercises ===== */
  .ex-group{margin-bottom:26px;}
  .ex-group-title{font-family:var(--font-body); font-size:14.5px; font-weight:600; margin-bottom:12px;}

  .tf-row{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    padding:10px 12px; border:1px solid var(--line); border-radius:var(--radius-sm);
    margin-bottom:7px; flex-wrap:wrap;
  }
  .tf-text{font-family:var(--font-read); font-size:15px; flex:1; min-width:200px;}
  .tf-btns{display:flex; gap:6px; flex-shrink:0;}
  .tf-btn{
    border:1px solid var(--line); background:var(--bg); color:var(--ink-soft);
    font-family:var(--font-body); font-size:12px; padding:6px 12px;
    border-radius:var(--radius-sm); cursor:pointer;
  }
  .tf-btn:hover{border-color:var(--accent); color:var(--accent);}
  .tf-btn.picked{background:var(--accent); border-color:var(--accent); color:#fff;}
  [data-theme="dark"] .tf-btn.picked{color:#0E141B;}
  .tf-btn.correct{border-color:var(--good); color:var(--good);}
  .tf-row.ok{border-color:var(--good); background:var(--good-bg);}
  .tf-row.no{border-color:var(--bad); background:var(--bad-bg);}

  .gap-bank{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px;}
  .gap-bank span{
    font-family:var(--font-mono); font-size:12px; padding:4px 10px;
    background:var(--accent-soft); color:var(--accent); border-radius:var(--radius-sm);
  }
  .gap-row{
    font-family:var(--font-read); font-size:15.5px; line-height:2.1;
    padding:6px 0; border-bottom:1px dashed var(--line);
  }
  .gap-num{font-family:var(--font-mono); font-size:12px; color:var(--ink-faint); margin-right:4px;}
  .gap-in{
    border:none; border-bottom:1.5px solid var(--accent); background:transparent;
    font-family:var(--font-read); font-size:15.5px; color:var(--ink);
    padding:1px 4px; margin:0 2px; text-align:center; min-width:44px;
  }
  .gap-in:focus{outline:none; background:var(--accent-soft);}
  .gap-in.ok{border-bottom-color:var(--good); color:var(--good);}
  .gap-in.no{border-bottom-color:var(--bad); color:var(--bad);}
  .gap-in.shown{border-bottom-color:var(--ink-faint); color:var(--ink-soft); font-style:italic;}

  .ex-actions{display:flex; gap:10px; margin-top:6px;}
  .ex-score{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:14px; padding:13px 18px; border-radius:var(--radius-sm);
    background:var(--accent); color:#fff; font-weight:600; font-size:14px;
  }
  [data-theme="dark"] .ex-score{color:#0E141B;}

  .ch-set{display:inline-flex; gap:4px; margin:0 4px; vertical-align:middle;}
  .ch-opt{
    border:1px solid var(--line); background:var(--bg); color:var(--ink-soft);
    font-family:var(--font-read); font-size:14px; padding:3px 10px;
    border-radius:var(--radius-sm); cursor:pointer;
  }
  .ch-opt:hover{border-color:var(--accent); color:var(--accent);}
  .ch-opt.picked{background:var(--accent); border-color:var(--accent); color:#fff;}
  [data-theme="dark"] .ch-opt.picked{color:#0E141B;}
  .ch-opt.ok{background:var(--good-bg); border-color:var(--good); color:var(--good);}
  .ch-opt.no{background:var(--bad-bg); border-color:var(--bad); color:var(--bad);}

  .ex-note{font-size:12.5px; color:var(--ink-soft); margin-bottom:12px; line-height:1.5;}
  .open-row{padding:12px 0; border-bottom:1px dashed var(--line);}
  .open-q{font-family:var(--font-read); font-size:15.5px; line-height:1.5; margin-bottom:8px;}
  .open-in{
    width:100%; border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:9px 12px; font-family:var(--font-read); font-size:15px;
    background:var(--bg); color:var(--ink); resize:vertical; min-height:38px;
  }
  .open-in:focus{outline:none; border-color:var(--accent);}
  .open-toggle{
    margin-top:7px; background:none; border:none; cursor:pointer;
    font-family:var(--font-body); font-size:12px; color:var(--accent);
    text-decoration:underline; text-underline-offset:3px; padding:2px 0;
  }
  .open-a{
    margin-top:8px; padding:10px 13px; border-left:2px solid var(--accent);
    background:var(--surface-soft); font-family:var(--font-read);
    font-size:14.5px; line-height:1.6; color:var(--ink-soft);
  }

  /* ===== article vocabulary ===== */
  .vocab-hl{
    background:var(--accent-soft); border-bottom:1.5px solid var(--accent);
    border-radius:3px; padding:0 2px; cursor:pointer;
    transition:background .12s;
  }
  .vocab-hl:hover{background:var(--accent); color:#fff;}
  [data-theme="dark"] .vocab-hl:hover{color:#0E141B;}
  .vocab-hl.active{background:var(--accent); color:#fff;}
  [data-theme="dark"] .vocab-hl.active{color:#0E141B;}
  .vocab-hint{font-size:12px; color:var(--ink-faint); margin:14px 0 2px;}

  /* Word panel: a bottom sheet on phones, a floating card on wide screens.

  }

  .ws-uz{font-size:15px; font-weight:600; color:var(--accent); margin-top:4px;}
  .ws-def{font-size:14px; color:var(--ink-soft); line-height:1.6; margin-top:10px;}
  .ws-ex{
    font-family:var(--font-read); font-size:14.5px; line-height:1.6; color:var(--ink);

      left:auto; right:34px; bottom:34px; width:390px;

      transform:translateY(16px); opacity:0; pointer-events:none;
      transition:transform .18s ease, opacity .18s ease;
      box-shadow:0 12px 40px rgba(0,0,0,.14);
    }
    .word-sheet.open{transform:translateY(0); opacity:1; pointer-events:auto;}
  }
  @media (max-width: 880px){
    .word-sheet{padding-bottom:80px; border-radius:14px 14px 0 0;}
  }

  .ep-row:hover{background:var(--surface-soft);}
  .ep-num{

  .ep-main{flex:1; min-width:0;}
  .ep-title{display:block; font-family:var(--font-body); font-size:14.5px; font-weight:500; color:var(--ink);}
  .ep-meta{display:block; font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); margin-top:3px;}

  .cap-note{
    margin-top:8px; padding:9px 13px; border-radius:var(--radius-sm);

  }

  .feedback.neutral{
    background:var(--surface-soft); color:var(--ink-soft); border-color:var(--line);
  }

    position:relative; width:100%; aspect-ratio:16/9; margin-bottom:18px;
    background:#000; border-radius:var(--radius-md); overflow:hidden;
  }

  .audio-warn{
    background:var(--bad-bg); color:var(--bad); border:1px solid var(--bad);

  }
  .audio-warn code{font-family:var(--font-mono); font-size:12.5px;}

  /* ===== Диктант: listen & type ===== */
  .dd-title{
    font-family:var(--font-display); font-size:23px; font-weight:700;
    letter-spacing:-.01em; margin-bottom:16px; display:flex; align-items:baseline;
    gap:12px; flex-wrap:wrap;
  }
  .dd-level{font-family:var(--font-body); font-size:13px; font-weight:500; color:var(--ink-soft);}

  .dd-tabs{display:flex; gap:26px; border-bottom:1px solid var(--line); margin-bottom:26px;}

    background:none; border:none; padding:0 0 11px; cursor:pointer;

  .dd-tabs button:hover{color:var(--ink);}
  .dd-tabs button.active{color:var(--accent); border-bottom-color:var(--accent); font-weight:500;}

  .dd-area{max-width:640px;}

  .dd-nav{display:flex; align-items:center; gap:16px; margin-bottom:20px;}
  .dd-nav span{font-family:var(--font-mono); font-size:14px; color:var(--ink-soft);}
  .dd-nav button{
    background:none; border:none; cursor:pointer; font-size:19px; line-height:1;
    color:var(--ink-soft); padding:2px 6px; border-radius:var(--radius-sm);
  }
  .dd-nav button:hover:not(:disabled){color:var(--accent); background:var(--surface-soft);}
  .dd-nav button:disabled{opacity:.25; cursor:default;}

  .dd-player{
    display:flex; align-items:center; gap:13px; margin-bottom:16px;
    padding:9px 14px; border:1px solid var(--line); border-radius:999px;

    background:none; border:none; cursor:pointer; color:var(--ink);

  }

  .dd-time{font-family:var(--font-mono); font-size:12px; color:var(--ink-soft); white-space:nowrap;}

    border:none; background:none; font-family:var(--font-body); font-size:12.5px;
    color:var(--ink-soft); cursor:pointer; padding:2px;

  .dd-inputwrap{position:relative;}

  .dd-buttons{display:flex; gap:10px; margin-top:14px;}

  .ep-quiz-note{
    background:var(--accent-soft); border-left:3px solid var(--accent);
    padding:12px 16px; border-radius:var(--radius-sm); margin-bottom:18px;

  .ep-vocab{padding:14px 0; border-top:1px solid var(--line);}
  .ep-vocab:first-child{border-top:none; padding-top:2px;}
  .ep-vocab-term{font-family:var(--font-read); font-size:17px; font-weight:700;}
  .ep-vocab-def{font-size:13.5px; color:var(--ink-soft); line-height:1.55; margin-top:3px;}
  .ep-vocab-ex{
    font-family:var(--font-read); font-size:14px; margin-top:7px;
    padding-left:12px; border-left:2px solid var(--accent); color:var(--ink);

  .word-chip.miss{background:var(--surface-soft); color:var(--ink-faint); border:1px dashed var(--line);}

  .tr-n{
    display:inline-flex; align-items:center; justify-content:center; min-width:20px; height:20px;
    border-radius:4px; background:var(--surface-soft); color:var(--ink-faint);
    font-family:var(--font-mono); font-size:10.5px; margin-right:9px; vertical-align:1px;
  }

  /* ===== Audirovaniye ===== */
  .speed-row{display:flex; align-items:center; gap:8px; margin-top:14px; flex-wrap:wrap;}
  .shadow-row{display:flex; gap:14px; padding:16px 0; border-top:1px solid var(--line);}
  .shadow-row:first-child{border-top:none; padding-top:4px;}
  .shadow-num{
    flex-shrink:0; width:26px; height:26px; border-radius:50%; border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; margin-top:2px;
    font-family:var(--font-mono); font-size:11.5px; color:var(--ink-faint);
  }
  .shadow-body{flex:1; min-width:0;}
  .shadow-actions{display:flex; gap:8px; flex-wrap:wrap;}

  /* ===== Vocabulary section ===== */
  .vocab-bar{height:4px; background:var(--line); border-radius:2px; overflow:hidden; margin:2px 0 4px;}
  .vocab-bar span{display:block; height:100%; background:var(--accent); transition:width .3s ease;}

  .act-switch{display:flex; border:1px solid var(--line); border-radius:var(--radius-sm); overflow:hidden; margin-bottom:20px; flex-wrap:wrap;}
  .act-switch button{
    flex:1; min-width:96px; border:none; border-right:1px solid var(--line); background:var(--bg);
    padding:10px 12px; font-family:var(--font-body); font-weight:500; font-size:13px;
    color:var(--ink-soft); cursor:pointer; transition:background .12s, color .12s;
  }
  .act-switch button:last-child{border-right:none;}
  .act-switch button:hover{background:var(--surface-soft); color:var(--ink);}
  .act-switch button.active{background:var(--accent); color:#fff;}

  .act-meta{font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); letter-spacing:.04em; text-transform:uppercase;}

  /* matching game */
  .match-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .match-col{display:flex; flex-direction:column; gap:8px;}
  .match-item{
    border:1px solid var(--line); background:var(--bg); color:var(--ink);
    padding:12px 14px; border-radius:var(--radius-sm); cursor:pointer;
    font-family:var(--font-body); font-size:14px; text-align:left;
    transition:background .12s, border-color .12s, opacity .2s;
  }
  .match-item:hover{border-color:var(--accent); background:var(--surface-soft);}
  .match-item.picked{background:var(--accent); color:#fff; border-color:var(--accent);}
  .match-item.matched{opacity:.35; pointer-events:none; border-color:var(--good); color:var(--good); background:var(--good-bg);}
  .match-item.wrong{background:var(--bad-bg); border-color:var(--bad); color:var(--bad);}

  /* on-screen Cyrillic keypad — most users here have no Russian keyboard layout */
  .cyr-pad{display:flex; flex-wrap:wrap; gap:4px; margin-top:12px;}
  .cyr-pad button{
    min-width:32px; height:34px; border:1px solid var(--line); background:var(--bg);
    border-radius:var(--radius-sm); cursor:pointer; font-family:var(--font-display);
    font-size:15px; color:var(--ink); transition:background .1s, border-color .1s;
  }
  .cyr-pad button:hover{background:var(--accent); color:#fff; border-color:var(--accent);}
  .cyr-pad button.wide{min-width:48px;}

  @media (max-width: 880px){
    .app-shell{grid-template-columns:1fr;}
    .sidebar{display:none;}
    .main{padding:20px 16px 96px;}
    .bottom-nav{
      display:flex; position:fixed; bottom:0; left:0; right:0; z-index:50;
      background: var(--bg); justify-content:space-around; padding:7px 4px 9px;
      border-top:1px solid var(--line);
    }
    .bottom-nav button{
      background:none; border:none; color:var(--ink-faint); display:flex; flex-direction:column;
      align-items:center; gap:3px; font-size:9.5px; font-weight:500; cursor:pointer; padding:4px 6px;
    }
    .bottom-nav button.active{color:var(--accent);}
    .bottom-nav button svg{opacity:.75;}
    .bottom-nav button.active svg{opacity:1;}
  }
</style>
</head>

            {text:"Да, и это может происходить даже в простой ситуации — например, когда нужно спросить дорогу или заказать еду в кафе.", start:83.97, end:92.59},
            {text:"Причины этого — как лингвистические, так и психологические.", start:93.22, end:97.79},

            {text:"У этого есть объяснение: когда человек начинает учить язык, он много времени тратит на изучение грамматики и лексики.", start:146.81, end:154.99},

          {type:"p", text:"Мне нравится мой район, потому что он очень безопасный. Здесь нет преступности, и все мои соседи заботятся друг о друге. Полицейский участок находится рядом со школой, и это очень удобно. Однако больница находится довольно далеко. Она в городе, и нам нужно ехать туда 30 минут на машине."},
          {type:"p", text:"Мои друзья живут рядом со мной, и мы часто встречаемся, чтобы поиграть или просто поболтать. Мы любим играть в хоккей прямо на улице, потому что там нет движения машин. Я думаю, что мне повезло жить в своём районе."}
        ],

        blocks:[
          {type:"p", text:"Джанет — спортсменка, и каждый будний день она просыпается в 4:30 утра. Первые 30 минут она читает, а затем 15 минут медитирует. В 5:15 утра Джанет проверяет электронную почту всего 30 минут, а потом отправляется на свою первую пробежку дня. Она бегает полтора часа вдоль озера рядом со своим домом."},
          {type:"p", text:"После пробежки Джанет принимает душ, а затем готовит завтрак, который обычно состоит из хлопьев и фруктов. Однако иногда она завтракает менее полезной едой. Обычно она заканчивает завтрак примерно в 8 часов утра."},
          {type:"p", text:"По будням она всегда выходит из дома в 8:20 и едет на тренировку. Тренировка начинается в 9 утра, и ей нужно 30 минут, чтобы доехать до спортзала на машине. Она тренируется со своей командой 3 часа, а затем едет домой на обед. Она всегда плотно и полезно обедает. Как только она заканчивает обедать, она спит один час."},
          {type:"p", text:"После сна она любит гулять вокруг озера и любоваться природой. Иногда днём она читает или медитирует у озера. По вечерам в течение недели она встречается с друзьями. Большинство её друзей тоже спортсмены, поэтому им есть о чём поговорить."},
          {type:"p", text:"Обычно она ложится спать в 9 часов вечера, потому что предпочитает бодрствовать утром, а не ночью. Иногда она засыпает под музыку, но никогда не смотрит телевизор и не читает ничего на планшете. Она всегда проверяет, что будильник поставлен, и почти всегда засыпает к 9:45 вечера."}

        blocks:[
          {type:"p", text:"Не все знаменитости родились в знаменитых семьях. Многие из них вели обычную жизнь до того, как стали известными. У них тоже была работа, как и у всех нас. Вот лишь несколько примеров:"},
          {type:"p", text:"Бывший президент Обама работал в кафе-мороженом, продавая мороженое в вафельных стаканчиках. Он учился в старшей школе в Гонолулу, на Гавайях, и говорил, что это было довольно тяжело. Он также отмечал, что эта работа научила его ответственности, трудолюбию и умению распределять время между работой, друзьями и семьёй."},
          {type:"p", text:"У Брэда Питта в молодости была странная работа. Он работал курицей! Да, именно так. Он трудился в ресторане под названием «El Pollo Loco» в Голливуде, и его задачей было наряжаться в костюм курицы и махать машинам, проезжающим по дороге. Более того, если вы отправитесь на экскурсию по Голливуду, многие гиды провезут вас мимо того самого ресторана, где раньше работал Брэд."},
          {type:"p", text:"Пожалуй, самым необычным был путь Папы Франциска. В молодости, в Аргентине, он сменил несколько профессий, прежде чем вступить в орден иезуитов и посвятить свою жизнь религии. Он работал уборщиком, подметая полы, лаборантом, тестируя химические вещества, и даже вышибалой в баре! Да, именно Папа отвечал за безопасность в баре на случай, если что-то пойдёт не так. Можете себе представить?!"}

        title:"Советы для путешествий в одиночку",
        subtitle:"Три совета для тех, кто впервые собирается в поездку один.",
        blocks:[
          {type:"p", text:"Путешествовать в одиночку может показаться страшным, если вы впервые покидаете уют родного дома. Вы, вероятно, будете думать о возможных рисках или сложных ситуациях. Что, если я заболею или попаду в аварию? Разве не опасно выходить куда-то одному ночью? Что, если на меня нападут? Разве не странно всё время есть в ресторанах в одиночестве?"},
          {type:"p", text:"Большинство путешественников испытывают эти и другие переживания перед своей первой самостоятельной поездкой, но все эти страхи исчезают, как только они видят все преимущества этого замечательного опыта. Здесь я дам вам 3 совета о том, как путешествовать одному и хорошо провести время."},
          {type:"h", text:"Говорите на языке страны"},
          {type:"p", text:"Люди — существа общительные. Всем нам нужно общаться с другими людьми. Если вы путешествуете в одиночку, хорошей идеей будет отправиться туда, где вы знаете язык."},
          {type:"h", text:"Живите у местных жителей"},
          {type:"p", text:"Отели удобны, но очень одиноки, а хостелы отлично подходят для тех, кто путешествует один, но там вы будете общаться только с другими туристами. Постарайтесь снять комнату в квартире. Это даст вам возможность наладить связь с местными жителями, и они смогут дать вам много полезных советов о том, чем можно заняться."},
          {type:"h", text:"Не стесняйтесь"},
          {type:"p", text:"Не бойтесь спрашивать. Спрашивайте дорогу на улице или расспрашивайте о месте, культуре или обычаях у местных жителей, которых встретите в барах, парках и так далее. Вы удивитесь, насколько люди любят рассказывать о своём городе или своей культуре. Помните, вы одни. Вопросы могут стать эффективным способом начать разговор и познакомиться с новыми людьми."}
        ],

      {
        id:"menyatsya-nikogda-ne-pozdno-a2",
        isNew:true,
        title:"Меняться никогда не поздно",
        subtitle:"История о том, как виртуальный мир помог человеку измениться в реальной жизни.",
        blocks:[
          {type:"p", text:"Миша всегда мечтал о том, чтобы стать успешным бизнесменом и жить богато. Но его карьера развивалась крайне медленно, и ему часто было трудно найти работу. Три года назад Миша закончил экономический факультет по специальности банковское дело. А работал он консультантом в банке."},
          {type:"p", text:"И вот, наконец, пришёл тот день, когда Мише предложили должность менеджера. Миша подумал, что его мечты начинают сбываться и что, может быть, он уже через год станет руководителем филиала, где он работал. Однако прошло уже больше года, и он начал замечать, что его коллеги почему-то получают премии и повышения, а ему ещё ни разу не давали премию и не повышали зарплату. В семье его тоже не понимали, почему он ещё работает простым служащим банка. Его отец считал, что в 25 лет у Миши уже должна была быть своя фирма и водитель, который должен был возить его на работу."},
          {type:"h", text:"Новая реальность"},
          {type:"p", text:"И вот однажды, когда Миша ехал с работы домой, он увидел рекламу нового интернет-кафе с таким текстом: «Приходи к нам и открой для себя новую реальность. Меняй себя. Создавай свой мир и будь тем, кем ты хочешь быть!» Миша подумал: «А почему бы не попробовать?» И на следующий же день сразу после работы он пошёл в интернет-кафе открывать для себя новую реальность."},
          {type:"p", text:"Никому из родителей, коллег и друзей Миша не рассказывал о своём увлечении. Родители Миши были уверены, что у их сына появилась девушка, с которой он встречается после работы. Но Миша часами сидел в киберкафе. В виртуальном мире он стал тем, кем всегда хотел быть. Он был директором крупной компании с сотрудниками, которые ему подчинялись и его уважали, ездил на дорогой машине. Он выбрал себе не только должность, но и внешность и характер."},
          {type:"p", text:"В виртуальной жизни Миша уже не был скромным, неуверенным в себе, грустным худым молодым человеком. Он был открытым, оптимистичным, уверенным в себе бизнесменом. Когда же Миша приходил на работу, то коллеги и директор тоже начали замечать изменения в его характере. Он стал больше общаться с коллегами, больше улыбаться и даже шутить."},
          {type:"h", text:"Милана"},
          {type:"p", text:"Однажды, играя в свою любимую игру в интернет-кафе, Миша познакомился с девушкой, которая ему очень понравилась. Она сказала, что её зовут Милана и что она работает моделью. На её странице он увидел фотографии молодой девушки с милой улыбкой и голубыми глазами. На одной фотографии Милана была в компании с серьёзным человеком в чёрном костюме."},
          {type:"p", text:"Когда же девушка сама предложила Мише встретиться в реальности, Миша сначала испугался, но потом согласился. Он боялся, что, если Милана увидит его и узнает всю правду, то она не захочет больше общаться с ним."},
          {type:"p", text:"Когда, наконец, они встретились, Миша даже не понял, как быстро пролетело время и как легко ему было с Миланой. Милана рассказала Мише грустную историю о том, что, когда она училась в школе, у неё не было друзей. Она была полной и необщительной. Её часто называли «белой вороной». После школы она решила изменить себя. Стала больше заниматься спортом, похудела, начала знакомиться с разными людьми. Кроме того, она поступила в очень престижную школу моделей и даже изменила имя Маша на Милана. Она стала совершенно другим человеком. И уже в 20 лет лучшие модельные агентства стали приглашать её на работу."},
          {type:"p", text:"Целый день Миша и Милана провели вместе. Они гуляли по городу, ходили на выставку картин, а вечером посидели в кафе. Миша понял, что он влюбился. «А кто же этот человек на фотографии в чёрном костюме?» – спросил Миша. «Ах, так это же мой фотограф!» – с улыбкой ответила Милана."},
          {type:"p", text:"Когда же Миша решился и рассказал Милане свою тайну о том, что он вовсе не бизнесмен и что у него нет своей фирмы и что на работу он ездит на метро, Милана сказала, что для неё это не так важно. Ей понравился он сам: оптимистичный, открытый, интересный и целеустремлённый – именно таким Милана увидела Мишу в реальности."},
          {type:"p", text:"Похоже, что Миша и сам не понял, как виртуальная реальность его изменила. Он поверил в себя и в то, что и в реальной жизни сможет стать тем, кем он хочет, и заниматься тем, чем нравится ему. А самое главное – он нашёл ту женщину, рядом с которой он теперь хотел быть всегда и которой было неважно, есть у него фирма, машина и личный водитель или нет."}

        blocks:[
          {type:"p", text:"Россия – огромная страна. Туристы со всего мира приезжают сюда, чтобы познакомиться с её природой и достопримечательностями. Люди, которые любят путешествовать и хотят своими глазами увидеть знаменитое северное сияние, едут на север России в город Мурманск, столицу северного сияния. Зимой там полярная ночь."},
          {type:"p", text:"Гостиница «Аврора Вилладж» находится недалеко от Мурманска, где свет города не мешает наблюдать природное чудо. Это целый комплекс отдыха вдали от цивилизации. Он состоит из десяти иглу. В каждом иглу – стеклянный купол, над которым в небе можно увидеть северное сияние. Номера небольшие, но очень уютные. В каждом номере есть кровати, стол, стулья, кондиционер, печь, ванная комната и интернет. Ещё в отеле есть кухня, где можно приготовить еду из продуктов, которые вы взяли с собой. Или вы можете заказать обед в кафе."},

        title:"Он знает, где мёд",
        subtitle:"Почему медведь так называется и как он стал национальным символом России.",
        blocks:[
          {type:"p", text:"Вы, наверное, знаете, кто такой медведь? В России много медведей: чёрные, бурые и даже белые на севере. Русские всегда любили и уважали этих сильных, красивых животных. Медведь – один из национальных символов России. Медведя можно увидеть на гербах таких городов, как Новгород, Ярославль, Рыбинск. А в некоторых городах есть даже памятники медведю."},
          {type:"p", text:"А вы знаете, почему медведь так называется? Мед-ведь – это «мёд» и «ведать». «Ведать» – старое слово, которое значит «знать». Так что медведь – это тот, кто знает мёд или знает, где мёд."},
          {type:"h", text:"Священное животное"},
          {type:"p", text:"Почему так? Дело в том, что в древние времена на Руси считали, что медведь – это священное животное. Славяне думали, что медведь – это их родственник, покровитель и помощник. Ведь он такой большой и сильный и так удивительно похож на человека. Он может ходить на задних лапах, как человек, он ест рыбу, мясо, ягоды, мёд… А его большие длинные лапы похожи на ноги и руки людей."},
          {type:"p", text:"Настоящее название медведя было бер. До сих пор в современном русском языке дом медведя называется «берлога», то есть место, где лежит бер. Но как о священном животном нельзя было говорить о медведе прямо. Поэтому его называли не бер, а «медведь», «хозяин», «сам», «старик», «косолапый»."},
          {type:"p", text:"Медведь очень часто встречается в русских сказках, где его называют даже Михайло Потапыч. Михайло – это Михаил. Так что имя Михаил, Миша тоже использовали, чтобы говорить о медведе. Кстати, игрушка медведь по-русски называется «мишка»."},
          {type:"h", text:"Учёные медведи и Олимпиада"},
          {type:"p", text:"Потом в России специальные «учёные медведи» часто выступали на ярмарках, на улицах и были очень популярными артистами. Мишки танцевали на задних лапах, пили из бутылки, показывали разные смешные вещи, например, как ходят солдаты, как девушка смотрит в зеркало и так далее. Люди с удовольствием смотрели на них и платили деньги."},
          {type:"p", text:"А в 1980 году мишка даже стал символом Олимпийских игр, которые проходили в Москве. Он так и назывался – Олимпийский мишка. В конце Олимпиады мишка плакал, улетал в небо, и звучала знаменитая песня о ласковом Мише, который возвращается в свой сказочный лес."},
          {type:"p", text:"И до сих пор медведь остаётся национальным символом России и одним из самых популярных русских животных."}

        subtitle:"Студент опоздал на лекцию — и этот день изменил всё.",
        blocks:[
          {type:"p", text:"Вчера был понедельник. Обычно по понедельникам я езжу в университет на лекции. Занятия начинаются в 9, поэтому я выхожу из дома в 8 часов, но в этот день я проспал, выбежал, нет, – вылетел из дома в 8 часов 45 минут и побежал к станции метро."},
          {type:"p", text:"Когда я отбежал от дома метров на 200, вспомнил, что не взял тетрадь с конспектами. «Не судьба!» – подумал я и медленно пошёл по улице. Зашёл в киоск, купил булочку, йогурт, кока-колу, потом шёл по улице и завтракал. Доехал на метро до станции «Университет», вышел из метро, перешёл через проспект, хотел сесть на автобус, но подумал, что погода прекрасная и можно дойти до факультета пешком, пройти через маленький парк."},
          {type:"p", text:"Когда я вошёл в университет, лекция ещё не кончилась, а по коридору ходил мой друг Витька. Он тоже опоздал на лекцию, решил не входить в аудиторию, но подождать меня. Он был очень рад, что я пришёл до перерыва и мы можем зайти в буфет выпить кофе."},
          {type:"h", text:"И тут я увидел ЕЁ"},
          {type:"p", text:"Мы вошли в буфет… И тут я увидел ЕЁ! Маленькая, тонкая, стройная девушка, казалось, не шла, а плыла по залу навстречу нам. Витька что-то говорил, но я не слышал, я смотрел на девушку. «Что с тобой?» – спросил Витька. – «Ты что, не знаешь её? Пойдём, я тебя познакомлю. Да что ты стоишь?»"},
          {type:"p", text:"Но мои ноги не слушали меня, не хотели идти. Я не мог ничего сказать, только смотрел, как девушка подходила к нам. Наконец она подошла и сказала просто: «Привет, ребята!»"},
          {type:"p", text:"«Нина, это мой друг Пётр. Он какой-то странный сегодня, наверное, потому что опоздал на лекцию. Он всегда ходит на все занятия, всё знает, и вообще, его ждёт прекрасное будущее…» Витька говорил и говорил, а мы с Ниной только смотрели друг на друга и улыбались."},

          {type:"p", text:"Кто же не любит шоколад? Странный вопрос. Все любят. И взрослые, и дети. Шоколад не только вкусный, он ещё и настроение поднимает. А русский шоколад вы когда-нибудь пробовали? Если нет, обязательно надо попробовать, потому что это действительно вкусно!"},

          {type:"p", text:"Русский шоколад появился позже, чем в Европе, но стал таким популярным, что коробка шоколада в русском национальном стиле считалась замечательным подарком и в Европе, и в Америке."},
          {type:"p", text:"В России шоколад сначала был жидким, поэтому его не ели, а пили! Шоколад был очень дорогим удовольствием и угощением только для аристократов. Но постепенно уже в конце 18 века шоколад продавали на улицах, открывали кофейни, где обычные люди пили горячий шоколад и обсуждали разные новости."},
          {type:"h", text:"Фабрика Эйнема"},
          {type:"p", text:"В 1850 году немец Фердинанд фон Эйнем основал шоколадную фабрику в Москве, где делали молочный шоколад и шоколадные конфеты в красивой упаковке, которая часто была настоящим произведением искусства. Упаковки часто создавали знаменитые художники – например, Иван Билибин, Михаил Врубель, Александр Бенуа. Можно сказать, что история Эйнема – это история успеха европейского предпринимателя. После революции 1917 года фабрика получила другое название – «Красный Октябрь»."},
          {type:"h", text:"Фабрика Абрикосова"},
          {type:"p", text:"Вторая фабрика, которая появилась в России, – это фабрика Абрикосова. Её история – настоящая русская сказка! Основатель этой фабрики Степан Николаев был крепостным крестьянином, который стал свободным и открыл в Москве небольшой магазинчик. Здесь он продавал варенье из абрикосов. Именно поэтому он получил фамилию Абрикосов, которая позже стала его официальной фамилией."},
          {type:"p", text:"Настоящую империю шоколада построил его внук Алексей Абрикосов – маркетинговый гений своего времени. Он печатал рекламу в газетах, выпускал плакаты, в конфеты мог положить загадки для детей. И тогда дети просили родителей купить именно эти конфеты. Фабрика Абрикосова участвовала в разных выставках и получила право изображать на своих изделиях герб Российской империи."},
          {type:"p", text:"Империя Абрикосовых стала символом русского успеха, потому что доказала, что талант и труд помогают человеку стать богатым и известным. После революции фабрика Абрикосова имела другое название – «Фабрика имени П. А. Бабаева»."},
          {type:"h", text:"Шоколад «Алёнка»"},
          {type:"p", text:"В Советском Союзе шоколад долгое время считался буржуазным лакомством. Но в 1960-х годах появилась новая технология, и стали производить качественные и доступные по цене шоколадные изделия. Очень скоро в советских магазинах начали продавать шоколад «Алёнка» с портретом милой голубоглазой девочки в платке. «Алёнка» стала не просто вкусным шоколадом, но и одним из символов России."},
          {type:"p", text:"Сейчас в России делают много разных видов шоколада и используют высококачественные ингредиенты."}

        blocks:[
          {type:"p", text:"Катюша, Катя, Екатерина… Известное и популярное женское имя в России. Но это имя сейчас есть и у панды тоже! Да, да! Это не ошибка и не фантазия. Панда Катюша живёт в Москве. И это первая большая панда в истории, которая родилась в России, в Московском зоопарке 24 августа 2023 года. День её рождения стал уникальным событием. Панда сначала была такая маленькая! Она весила всего 150 граммов."},
          {type:"p", text:"Имя для этой панды выбирали москвичи. Департамент культуры города Москвы организовал специальное голосование. Предлагали разные имена, но… Победило имя Катюша! И китайцы были очень рады, когда узнали об этом, потому что в Китае Катюша – очень популярное имя, которое связано с Россией."},
          {type:"p", text:"Панда Катюша живёт в Московском зоопарке вместе с мамой и папой. Посетителям зоопарка очень нравится эта дружная семья. Учёные говорят, что когда люди наблюдают за пандами, то это очень полезно. Поднимается настроение и у детей, и у взрослых. Если у вас плохое настроение, можно дать хороший совет – идите в зоопарк и смотрите на панду. Кстати, есть два варианта. Можно или лично прийти в зоопарк, или включить онлайн-трансляцию!"},

          {type:"p", text:"Директор Московского зоопарка постоянно рассказывает о жизни Катюши в своём телеграм-канале: как растёт и развивается панда, как играет с игрушками и гуляет, что ест, что умеет делать. Катюша любит есть бамбук, яблоки, морковь, специальный хлеб. Но, конечно, самое любимое блюдо – это бамбук. Панда может быть очень активной, но её типичный распорядок дня такой: проснулся – поел – поспал немного – опять поел – опять поспал. Отличная жизнь! Не правда ли?"}

          {type:"p", text:"«Как прожить долго?» – на этот вопрос учёные из разных стран мира до сих пор ищут ответ. Конечно, здоровый и активный образ жизни и правильное питание играют в этом вопросе большую роль. Однако многие люди, которые прожили больше 100 лет, отмечали, что хорошее настроение и оптимизм – важные аспекты долгой жизни."},
          {type:"p", text:"Француженка Жанна Кальман имеет титул самой старой женщины в истории. Жанна прожила 122 года и 164 дня. Она часто шутила, что секрет её долголетия в том, что она любила шоколад, оливковое масло и вино. Она занималась спортом: теннисом, плаванием, а также каталась на роликах и велосипеде. А ещё она много гуляла на свежем воздухе."},
          {type:"p", text:"Ещё одну долгожительницу звали Канэ Танака. Она родилась в Японии и прожила 119 лет. Один из секретов долголетия Канэ – ежедневные нагрузки для мозга. Каждый день она много читала, занималась математикой, каллиграфией, играла в настольные игры и писала стихи. Она вставала в 6 часов утра, делала зарядку и шла гулять. В многочисленных интервью Канэ говорила, что главный секрет долголетия не в правильном питании или спорте, а в бодрости духа и в хорошем настроении. Кстати, Канэ также, как и Жанна Кальман, очень любила сладкое и газированные напитки."},
          {type:"p", text:"У американки Сары Кнаусс, которая также прожила 119 лет, не было каких-то особенных рецептов долголетия. Во время интервью в 1998 году Сара объяснила секрет долгой жизни так: «Я очень спокойный человек, и меня ничто не беспокоит». Ещё она дала всем такой совет: «Больше работайте и не думайте о том, сколько вам лет». Сара была также очень позитивным человеком и любила пошутить."},
          {type:"p", text:"Последний мужчина, который родился в XIX веке, а умер в XXI, – это японец Дзироэмон Кимура. Он прожил 116 лет и 54 дня. Главной причиной своего долголетия Кимура считал здоровый образ жизни. Он также предпочитал есть небольшими порциями. Кроме того, у Кимуры были хорошие гены. Его старшие братья и сёстры прожили до 90 лет, а младший брат – до 100."},
          {type:"p", text:"На сегодняшний день самой старой женщиной в мире является британка Этель Кейтерем. Сейчас ей уже 116 лет. В 2019 году сама королева Великобритании Елизавета II отправила ей открытку и поздравила её с днём рождения. Секрет долгой жизни Этель Кейтерем – это спокойствие. Журналистам она говорила так: «Я никогда ни с кем не спорю, я слушаю и делаю то, что мне нравится»."}
        ],

        blocks:[
          {type:"p", text:"Много лет назад жили два художника. Они были большими друзьями, очень уважали друг друга. Однажды один из них нарисовал прекрасную картину. На этой картине он нарисовал виноград, который был как настоящий. Маленькая птица увидела эту картину и решила, что виноград настоящий, и начала клевать его."},
          {type:"p", text:"Когда второй художник увидел картину, которую нарисовал его друг, он сказал: «Мой друг, ты нарисовал прекрасную картину, но я нарисую картину лучше». Первый художник очень ждал, когда его друг нарисует картину. Он часто спрашивал своего друга: «Скажи, пожалуйста, когда твоя картина будет готова?»"},
          {type:"p", text:"Наконец второй художник сказал, что его картина готова. Когда первый художник пришёл в студию, в которой работал его друг, он увидел не картину, а занавеску и сказал: «Дорогой друг, я хочу увидеть не занавеску, а картину, которую ты нарисовал. Открой, пожалуйста, занавеску!»"},
          {type:"p", text:"Второй художник ответил своему другу: «Я не могу открыть эту занавеску, потому что я нарисовал её». Первый художник долго смотрел на картину, на которой художник нарисовал занавеску, и сказал: «Конечно, друг мой, твоя картина лучше. Когда я нарисовал виноград, обманул только маленькую глупую птицу. А ты, когда нарисовал занавеску, обманул меня, старого опытного художника»."}

        subtitle:"Философия, которая предлагает замедлиться и почувствовать настоящий момент.",
        blocks:[
          {type:"p", text:"В нашем быстром мире, где технологии и работа заставляют нас жить в быстром темпе, иногда человек хочет просто остановиться и подумать в тишине. Зачем эта суета, почему и зачем я всё время спешу?"},
          {type:"p", text:"Общество «Темпус» предлагает изменить свою жизнь: жить медленнее и обращать внимание на настоящий момент, а не спешить за результатом. «Темпус» предлагает отказаться от суеты и спешки, которые провоцируют постоянный стресс. Жить медленнее, чувствовать жизнь и получать удовольствие от жизни."},
          {type:"h", text:"Как мы можем жить медленнее?"},
          {type:"p", text:"Творчество. Рисование или занятия музыкой могут помочь замедлить время и почувствовать настоящий момент. Готовить – это тоже творчество. Если вы неспешно готовите вкусное блюдо, особенно для ваших близких, это полезно и для вас, и для них."},
          {type:"p", text:"Отдых на природе. Прогулки по лесу или парку тоже помогают нам лучше чувствовать мир вокруг и забывать о суете."},
          {type:"p", text:"Общение. «Темпус» предлагает проводить «медленные» мероприятия. Например, встреча за чашкой чая, где главное — общение с друзьями, а не быстрое потребление еды."},
          {type:"p", text:"Чтение. Чтение книг в медленном темпе тоже прекрасно помогает уйти от суеты и спешки современной жизни и почувствовать настоящий момент."},
          {type:"p", text:"Осознанное обучение. Ещё одна важная идея — это «замедленное обучение». В школах и университетах важно не просто выучить информацию, а понять её. Это помогает лучше запоминать и осмысливать материал."},
          {type:"p", text:"Местное производство. Местные фермерские рынки и маленькие мастерские играют важную роль в жизни общества. Они помогают экономике, а покупатели начинают ценить продукты, которые делают их соседи."},

        subtitle:"Пять тем, которые в России считаются запретными на рабочем месте.",
        blocks:[
          {type:"p", text:"Согласно различным опросам, в российском обществе много тем, о которых не принято говорить на работе."},
          {type:"p", text:"Прежде всего на работе не приветствуются разговоры о личной жизни коллег и начальника. Если вы не знаете, какая ситуация и какие проблемы в семье у вашего коллеги, то не нужно самому обсуждать его или её личную жизнь и задавать неудобные вопросы. Не стоит также забывать о том, что в некоторых культурах разговоры о семье считаются неприличными."},
          {type:"p", text:"Вторая запретная тема для обсуждения на работе – это тема здоровья. При этом обсуждать здоровый образ жизни, фитнес и диеты – это нормально. Но если речь идёт о проблемах со здоровьем кого-либо из коллег или лично вас, это уже совсем другое. Лучше не рассказывать о проблемах со здоровьем на работе. Вы можете просто сказать кому-то, что вам нужно пойти к врачу, или попросить у начальника отпуск по болезни."},
          {type:"p", text:"Третья тема-табу – это финансы. Никогда не обсуждайте размеры зарплат ваших коллег по работе. В России, да и не только в России, неприлично задавать человеку вопросы о его зарплате и доходе его семьи. Кроме того, не стоит рассказывать о дорогих покупках, которые вы сделали, как, например, о покупке машины, квартиры, дорогостоящем отпуске или украшении. Это может быть причиной недовольства других ваших коллег по офису."},
          {type:"p", text:"Тему внешнего вида и вкуса коллег также лучше избегать на рабочем месте. Все люди разные. У каждого человека есть свой стиль и свой вкус: в музыке, в литературе, в искусстве, в одежде. Кому-то нравится джаз, кто-то обожает кей-поп, а кто-то ненавидит рэп. Если вы не хотите найти себе врагов на работе, то не стоит критиковать своих коллег за их вкус и стиль одежды. Не зря же говорят: «О вкусах не спорят»."},
          {type:"p", text:"Ну и, наконец, пятая запретная тема – это религия и вера в Бога. Россия – многонациональная страна. Здесь живут люди разных национальностей и религиозных убеждений. Мы не всегда знаем, какие религиозные взгляды у коллеги по работе. А может быть, он атеист? Нужно быть осторожным не только в разговоре с коллегами о религии, но и в поздравлениях с религиозными праздниками."},
          {type:"p", text:"Чтобы понять, подходит ли та или другая тема для конкретной ситуации, попробуйте сами ответить на такие вопросы: будет ли вашим коллегам интересно или полезно услышать эту информацию, будут ли они себя чувствовать комфортно, хотите ли вы, чтобы ваши коллеги знали детали вашей личной жизни, хотели бы вы сами узнать такую информацию или нет. Если нет, то и не начинайте сами разговор на такие темы. Намного приятнее поговорить с коллегами о погоде, о культуре, о спорте, о выставках или путешествиях."}

        subtitle:"Портной из провинциального города купил лотерейный билет — и стал известным модельером.",
        blocks:[
