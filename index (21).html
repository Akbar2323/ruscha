/* ---------- episode shell (built once) ---------- */
function renderEpisode(el){
  const sr = findSeries(openSeriesId);
  const ep = findEpisode(sr, openEpisodeId);
  if(!ep){ openEpisodeId=null; renderDictation(); return; }
  const sents = readySentences(ep);
  const epIdx = sr.episodes.findIndex(e=>e.id===ep.id);
  const nextEp = sr.episodes[epIdx+1];

  if(dictShellFor !== ep.id || !document.getElementById("lisAudio")){
    el.innerHTML = `
      <button class="btn btn-ghost btn-sm" id="epBack" style="margin-bottom:18px;">← ${sr.title}</button>
      <h2 class="dd-title">${ep.title}
        ${sr.levelRange ? `<span class="dd-level">Уровень: ${sr.levelRange}</span>` : ""}
      </h2>
      ${sents.length ? `
        <div class="dd-tabs" id="dictTabs">
          <button data-tab="type">Диктант</button>
          <button data-tab="transcript">Полный текст</button>
          ${ep.vocab && ep.vocab.length ? `<button data-tab="vocab">Словарь</button>` : ""}
        </div>` : ""}
      ${ep.youtubeId
        ? `<div class="yt-frame"><div id="ytHost"></div></div>`
        : `<audio id="lisAudio" preload="auto" style="display:none;"></audio>
           <div id="audioWarn" class="audio-warn" style="display:none;">
             Audio fayl topilmadi. <code>${ep.audioSrc}</code> nomli fayl saytga yuklanganini tekshiring.
           </div>`}
      <div id="dictArea" class="dd-area"></div>
      ${nextEp ? `<div class="read-nav"><span></span><button class="btn btn-ghost btn-sm" id="nextEp">${nextEp.title} →</button></div>` : ""}`;

    dictShellFor = ep.id;
    dictSegEnd = null;

    if(ep.youtubeId){
      loadYouTubeAPI().then(()=>{
        const player = new YT.Player("ytHost", {
          videoId: ep.youtubeId,
          playerVars: {rel:0, modestbranding:1, playsinline:1},
          events: {
            onReady: ()=>{
              Media.attachYT(player);
              // no timeupdate on YouTube, so watch the clock ourselves
              Media.poll = setInterval(()=>{
                updateTransport();
                if(dictSegEnd !== null && Media.getTime() >= dictSegEnd){
                  Media.pause(); dictSegEnd = null; updateTransport();
                }
              }, 120);
              paintDictArea(ep, readySentences(ep));
            }
          }
        });
      });
    } else {
      // walk the candidate filenames until one actually loads
      const a = document.getElementById("lisAudio");
      Media.attachAudio(a);
      const names = [ep.audioSrc].concat(ep.audioAlts || []);
      let i = 0;
      function tryNext(){
        if(i >= names.length){
          const w = document.getElementById("audioWarn");
          if(w) w.style.display = "block";
          return;
        }
        a.src = encodeURI(names[i++]);
        a.load();
      }
      a.addEventListener("error", tryNext);
      a.addEventListener("loadedmetadata", ()=>{
        const w = document.getElementById("audioWarn");
        if(w) w.style.display = "none";
      });
      a.addEventListener("timeupdate", ()=>{
        updateTransport();
        if(dictSegEnd !== null && a.currentTime >= dictSegEnd){
          a.pause(); dictSegEnd = null; updateTransport();
        }
      });
      a.addEventListener("play",  updateTransport);
      a.addEventListener("pause", updateTransport);
      tryNext();
    }

    document.getElementById("epBack").addEventListener("click", ()=>{
      Media.pause(); Media.reset();
      openEpisodeId=null; dictShellFor=null; renderDictation();
    });

    const tabs = document.getElementById("dictTabs");
    if(tabs) tabs.querySelectorAll("button").forEach(b=>{
      b.addEventListener("click", ()=>{ dictTab=b.dataset.tab; paintDictArea(ep, sents); });
    });
    if(nextEp) document.getElementById("nextEp").addEventListener("click", ()=>{
      Media.pause(); Media.reset();
      openEpisodeId=nextEp.id; dictSentIdx=0; dictTab="type";
      dictResults={}; dictShellFor=null; renderDictation();
    });
  }
  paintDictArea(ep, sents);
}

/* transport readout is sentence-relative */
function updateTransport(){
  const bar = document.getElementById("ddFill");
  const cur = document.getElementById("ddCur");
  const btn = document.getElementById("ddPlay");
  if(!bar || !cur || !Media.isReady()) return;
  const s = window.__ddSent;
  if(!s) return;
  const len = Math.max(0.1, clipEnd(s) - clipStart(s));
  const at  = Math.min(len, Math.max(0, Media.getTime() - clipStart(s)));
  bar.style.width = (at/len*100)+"%";
  cur.textContent = fmtTime(at);
  if(btn) btn.textContent = Media.paused() ? "▶" : "❚❚";
}

/* ---------- area ---------- */
function paintDictArea(ep, sents){
  const area = document.getElementById("dictArea");
  const tabs = document.getElementById("dictTabs");
  if(tabs) tabs.querySelectorAll("button").forEach(b=>b.classList.toggle("active", b.dataset.tab===dictTab));

  if(!sents.length){
    area.innerHTML = `<p style="color:var(--ink-soft); line-height:1.6;">Bu dars uchun matn hali kiritilmagan.</p>`;
    return;
  }
  if(dictTab === "transcript"){
    area.innerHTML = `
      ${ep.quiz ? `<div class="ep-quiz-note"><b>Вопрос выпуска:</b> ${ep.quiz.stem}</div>` : ""}
      <div style="font-family:var(--font-read); font-size:16px; line-height:1.85;">
        ${sents.map((x,i)=>`<p style="margin-bottom:10px;"><span class="tr-n">${i+1}</span>${x.text}</p>`).join("")}
      </div>`;
    return;
  }
  if(dictTab === "vocab"){
    area.innerHTML = (ep.vocab||[]).map(v=>`
      <div class="ep-vocab">
        <div class="ep-vocab-term">${v.term}</div>
        <div class="ep-vocab-def">${v.def}</div>
        <div class="ep-vocab-ex">${v.ex}</div>
      </div>`).join("");
    return;
  }
  if(dictSentIdx >= sents.length){ paintResults(area, ep, sents); return; }
  paintSentence(area, ep, sents);
}

/* ---------- one sentence ---------- */
/* Most learners here have no Russian layout installed, and dictation asks for
   whole sentences — without this the section is simply unusable for them.
   Laid out in the real ЙЦУКЕН order rather than alphabetically, so the muscle
   memory built here transfers to an actual Russian keyboard. */
const RU_ROWS = [
  "йцукенгшщзхъ",
  "фывапролджэ",
  "ячсмитьбю"
];

function ruKeyboard(){
  const on = state.showKeyboard !== false;
  return `
    <div class="kb-wrap">
      <button class="kb-toggle" id="kbToggle">${on ? "⌨ Klaviaturani yashirish" : "⌨ Kirill klaviaturasi"}</button>
      <div class="kb" id="ruKb" style="${on ? "" : "display:none;"}">
        <div class="kb-row kb-nums">
          ${"1234567890".split("").map(d=>`<button class="kb-key kb-num" data-ch="${d}">${d}</button>`).join("")}
        </div>
        ${RU_ROWS.map((row,i)=>`
          <div class="kb-row">
            ${i===0 ? `<button class="kb-key kb-yo" data-ch="ё">ё</button>` : ""}
            ${row.split("").map(ch=>`<button class="kb-key" data-ch="${ch}">${ch}</button>`).join("")}
            ${i===2 ? `<button class="kb-key kb-wide" data-ch="BACK" aria-label="O'chirish">⌫</button>` : ""}
          </div>`).join("")}
        <div class="kb-row">
          <button class="kb-key kb-punct" data-ch=",">,</button>
          <button class="kb-key kb-punct" data-ch=".">.</button>
          <button class="kb-key kb-space" data-ch=" ">bo'sh joy</button>
          <button class="kb-key kb-punct" data-ch="-">-</button>
          <button class="kb-key kb-punct" data-ch="?">?</button>
        </div>
      </div>
    </div>`;
}

/* Insert at the caret rather than appending, so a typo mid-sentence can be
   fixed without retyping the tail. */
function wireKeyboard(el, input){
  const kb = el.querySelector("#ruKb");
  const toggle = el.querySelector("#kbToggle");
  if(!kb || !toggle) return;

  toggle.addEventListener("click", ()=>{
    const showing = kb.style.display !== "none";
    kb.style.display = showing ? "none" : "";
    toggle.textContent = showing ? "⌨ Kirill klaviaturasi" : "⌨ Klaviaturani yashirish";
    state.showKeyboard = !showing;
    saveState();
    input.focus();
  });

  kb.querySelectorAll(".kb-key").forEach(k=>{
    k.addEventListener("mousedown", e=> e.preventDefault());   // keep focus in the field
    k.addEventListener("click", ()=>{
      const ch = k.dataset.ch;
      const start = input.selectionStart ?? input.value.length;
      const end   = input.selectionEnd   ?? input.value.length;
      if(ch === "BACK"){
        if(start !== end){
          input.value = input.value.slice(0,start) + input.value.slice(end);
          input.setSelectionRange(start, start);
        } else if(start > 0){
          input.value = input.value.slice(0,start-1) + input.value.slice(start);
          input.setSelectionRange(start-1, start-1);
        }
      } else {
        input.value = input.value.slice(0,start) + ch + input.value.slice(end);
        input.setSelectionRange(start+ch.length, start+ch.length);
      }
      input.focus();
    });
  });
}

function paintSentence(area, ep, sents){
  const idx = dictSentIdx;
  const sent = sents[idx];
  window.__ddSent = sent;
  const target = dictWords(sent.text);
  const len = Math.max(0.1, clipEnd(sent) - clipStart(sent));
  const canRec = !!(window.SpeechRecognition || window.webkitSpeechRecognition);

  area.innerHTML = `
    <div class="dd-nav">
      <button id="ddPrev" ${idx===0?"disabled":""} aria-label="Oldingi">←</button>
      <span>${idx+1} / ${sents.length}</span>
      <button id="ddNext" ${idx>=sents.length-1?"disabled":""} aria-label="Keyingi">→</button>
    </div>

    <div class="dd-player">
      <button id="ddPlay" aria-label="Tinglash">▶</button>
      <span class="dd-time"><span id="ddCur">0:00</span> / ${fmtTime(len)}</span>
      <div class="dd-track" id="ddTrack"><span id="ddFill"></span></div>
      <select id="ddRate" aria-label="Tezlik">
        <option value="0.6">0.6x</option>
        <option value="0.8">0.8x</option>
        <option value="1" selected>1x</option>
        <option value="1.25">1.25x</option>
      </select>
    </div>

    <div class="dd-inputwrap">
      <textarea id="dictIn" rows="3" placeholder="Eshitganingizni yozing..." autocomplete="off" spellcheck="false"></textarea>
      ${canRec ? `<button class="dd-mic" id="ddMic" aria-label="Ovoz bilan yozish">🎤</button>` : ""}
    </div>
    ${ruKeyboard()}

    <div class="dd-buttons">
      <button class="btn btn-primary btn-sm" id="dictCheck">Tekshirish</button>
      <button class="btn btn-ghost btn-sm" id="dictSkip">O'tkazish</button>
    </div>
    <div class="feedback-slot" id="dictSlot"></div>`;

  const input = document.getElementById("dictIn");
  const slot  = document.getElementById("dictSlot");
  wireKeyboard(area, input);
  const rateSel = document.getElementById("ddRate");
  rateSel.value = String(dictRate);
  Media.setRate(dictRate);

  function playFromStart(){
    Media.seek(clipStart(sent));
    dictSegEnd = clipEnd(sent);
    Media.play();
  }
  function toggle(){
    if(Media.paused()){
      const t = Media.getTime();
      if(t < clipStart(sent) || t >= clipEnd(sent)) Media.seek(clipStart(sent));
      dictSegEnd = clipEnd(sent);
      Media.play();
    } else Media.pause();
  }
  if(Media.kind !== "yt") playFromStart();   // browsers block YT autoplay until a tap
  updateTransport();
  input.focus();

  document.getElementById("ddPlay").addEventListener("click", toggle);
  rateSel.addEventListener("change", ()=>{
    dictRate = parseFloat(rateSel.value);
    Media.setRate(dictRate);
    input.focus();
  });
  document.getElementById("ddTrack").addEventListener("click", e=>{
    const r = e.currentTarget.getBoundingClientRect();
    Media.seek(clipStart(sent) + ((e.clientX - r.left)/r.width) * len);
    dictSegEnd = clipEnd(sent);
    updateTransport();
  });

  function go(i){
    Media.pause();
    dictSentIdx = Math.max(0, Math.min(sents.length, i));
    if(!state.dictProgress) state.dictProgress = {};
    state.dictProgress[ep.id] = dictSentIdx;
    saveState();
    paintDictArea(ep, sents);
  }
  document.getElementById("ddPrev").addEventListener("click", ()=>go(idx-1));
  document.getElementById("ddNext").addEventListener("click", ()=>go(idx+1));

  const mic = document.getElementById("ddMic");
  if(mic) mic.addEventListener("click", ()=>{
    const R = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!R) return;
    const rec = new R();
    rec.lang = "ru-RU"; rec.interimResults = false; rec.maxAlternatives = 1;
    mic.classList.add("rec");
    rec.onresult = e=>{ input.value = (input.value ? input.value+" " : "") + e.results[0][0].transcript; input.focus(); };
    rec.onend = ()=> mic.classList.remove("rec");
    rec.onerror = ()=> mic.classList.remove("rec");
    try{ rec.start(); }catch(err){ mic.classList.remove("rec"); }
  });

  function check(){
    const typed = dictWords(input.value);
    const marks = target.map((w,i)=> typed[i] !== undefined && dictNorm(typed[i]) === dictNorm(w));
    const allOk = marks.every(Boolean) && typed.length === target.length;

    if(allOk){
      // capitalisation is never an error, only a gentle note
      const capNotes = [];
      target.forEach((w,i)=>{ if(caseOnlyDiff(typed[i], w)) capNotes.push(w); });
      dictResults[idx] = dictResults[idx] || "ok";
      slot.innerHTML = `
        <div class="feedback good">✓ ${sent.text}</div>
        ${capNotes.length ? `<div class="cap-note">💡 Katta harf bilan: ${capNotes.map(w=>`<b>${w}</b>`).join(", ")}</div>` : ""}`;
      setTimeout(()=>go(idx+1), capNotes.length ? 2200 : 950);
    } else {
      const diff = target.map((w,i)=>
        marks[i] ? `<span class="word-chip ok">${w}</span>`
                 : (typed[i] === undefined ? `<span class="word-chip miss">?</span>`
                                           : `<span class="word-chip no">${typed[i]}</span>`)).join("");
      slot.innerHTML = `<div class="feedback bad">${marks.filter(Boolean).length}/${target.length} — yana urinib ko'ring<br>${diff}</div>`;
      input.focus();
    }
  }
  document.getElementById("dictCheck").addEventListener("click", check);

  // Skip puts the sentence into the box instead of flashing it below and jumping
  // on: the learner reads it, can retype it, and moves on when ready.
  document.getElementById("dictSkip").addEventListener("click", ()=>{
    dictResults[idx] = dictResults[idx] || "skip";
    input.value = sent.text;
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
    slot.innerHTML = `<div class="feedback neutral">Matn yozildi — o'qib chiqing, xohlasangiz o'zingiz qayta yozing. Tayyor bo'lsangiz <b>→</b> tugmasi bilan keyingisiga o'ting.</div>`;
  });
  input.addEventListener("keydown", e=>{
    if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); check(); }
    if(e.key === "Tab"){ e.preventDefault(); playFromStart(); }
  });
}

/* ---------- results ---------- */
function paintResults(area, ep, sents){
  const vals = Object.values(dictResults);
  const clean = vals.filter(v=>v==="ok").length;
  const pct = Math.round(clean / sents.length * 100);
  area.innerHTML = `
    <div style="text-align:center; padding:16px 0 6px;">
      <div style="font-family:var(--font-display); font-size:44px; font-weight:700; line-height:1;">${pct}%</div>
      <p style="color:var(--ink-soft); margin:10px 0 20px;">${clean} / ${sents.length} jumla mustaqil yozildi</p>
      <div class="dd-buttons" style="justify-content:center;">
        <button class="btn btn-primary btn-sm" id="dictRestart">Qaytadan</button>
        <button class="btn btn-ghost btn-sm" id="dictShowText">Matnni ko'rish</button>
      </div>
    </div>`;
  if(!state.dictationDone.includes(ep.id)){ state.dictationDone.push(ep.id); logActivity(10); }
  if(!state.dictProgress) state.dictProgress = {};
  state.dictProgress[ep.id] = 0;
  saveState();
  document.getElementById("dictRestart").addEventListener("click", ()=>{
    dictSentIdx=0; dictResults={}; paintDictArea(ep, sents);
  });
  document.getElementById("dictShowText").addEventListener("click", ()=>{
    dictTab="transcript"; paintDictArea(ep, sents);
  });
}

/* ===================== ARTICLES (CEFR-based) ===================== */
function articleWordCount(article){
  return article.blocks.filter(b=>b.type==="p"||b.type==="q").reduce((sum,b)=> sum + b.text.trim().split(/\s+/).length, 0);
}

function findArticle(id){
  for(const lvl of CEFR_LEVELS){
    const found = DATA.articles[lvl.id].find(a=>a.id===id);
    if(found) return {article:found, level:lvl.id};
  }
  return null;
}

function renderArticles(){
  if(!openArticleId) document.body.classList.remove("reading");
  // pick a sensible default CEFR level the first time: the first level that actually has content
  if(!state.articleLevel){
    const withContent = CEFR_LEVELS.find(l => DATA.articles[l.id].length>0);
    state.articleLevel = withContent ? withContent.id : "all";
  }

  const el = document.getElementById("view-articles");

  if(openArticleId){
    renderArticleDetail(el, openArticleId);
    return;
  }

  const lvl = state.articleLevel;
  const list = lvl==="all"
    ? CEFR_LEVELS.flatMap(l => DATA.articles[l.id].map(a => ({...a, _level:l.id})))
    : DATA.articles[lvl].map(a => ({...a, _level:lvl}));

  el.innerHTML = `
    <div class="section-title"><h2>Статья</h2><span>${state.articlesRead.length}/${articlesTotal()} o'qilgan</span></div>
    <div class="level-switch" id="cefrSwitch" style="margin-bottom:22px; width:fit-content; flex-wrap:wrap;"></div>
    <div id="artGrid" class="module-grid"></div>
  `;

  const cefrEl = document.getElementById("cefrSwitch");
  const tabs = [{id:"all", label:"Barchasi"}, ...CEFR_LEVELS];
  cefrEl.innerHTML = tabs.map(l => {
    const list = l.id==="all"
      ? CEFR_LEVELS.flatMap(x=>DATA.articles[x.id])
      : DATA.articles[l.id];
    const done = list.filter(a=>state.articlesRead.includes(a.id)).length;
    return `<button class="${l.id===lvl?'active':''}" data-cefr="${l.id}">${l.label}<span class="cefr-pill-count">${done}/${list.length}</span></button>`;
  }).join("");
  cefrEl.querySelectorAll("button").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.articleLevel = btn.dataset.cefr;
      saveState();
      renderArticles();
    });
  });

  const grid = document.getElementById("artGrid");
  if(list.length===0){
    grid.innerHTML = `<div class="panel" style="grid-column:1/-1;"><p style="color:var(--ink-soft);">Bu darajada hozircha maqola yo'q. Tez orada qo'shiladi — boshqa darajani tanlab ko'ring.</p></div>`;
    return;
  }
  grid.innerHTML = list.map(a => {
    const read = state.articlesRead.includes(a.id);
    const mins = readingMinutes(a);
    return `
      <div class="module-card art-card lvl-${a._level}${read ? ' is-done' : ''}" data-art="${a.id}">
        ${read ? '<span class="done-tick" aria-label="o\'qilgan">✓</span>' : ""}
        <div class="badge-row">
          <span class="badge badge-level">${CEFR_LEVELS.find(l=>l.id===a._level).label}</span>
          <span class="badge badge-kind">${articleKind(a)}</span>
          ${a.isNew && !read ? '<span class="badge badge-new">YANGI</span>' : ""}
        </div>
        <h3>${a.title}</h3>
        <p>${a.subtitle ? a.subtitle : ""}</p>
        <div class="prog">📖 ~${mins} daqiqa · ${articleWordCount(a)} so'z</div>
      </div>`;
  }).join("");
  grid.querySelectorAll(".module-card").forEach(card=>{
    card.addEventListener("click", ()=>{
      openArticleId = card.dataset.art;
      document.body.classList.add("reading");
      window.scrollTo(0,0);
      renderArticles();
    });
  });
}

const LETTERS = ["А","Б","В","Г","Д"];

/* ===================== article exercises =====================
   Two shapes cover the grammar drills that come with these texts:
     tf   — true/false statements about the text
     gap  — a sentence with {} placeholders; with a `bank` the learner picks
            from given words, without one they type the ending themselves
   Both are checked per item, forgiving of case and stray punctuation.        */
function exNorm(v){
  return (v||"").toString().toLowerCase().replace(/ё/g,"е")
    .replace(/[.,!?;:"«»()\u2014\u2013-]/g,"").trim();
}

function renderExercises(article){
  const ex = article.exercises || [];
  if(!ex.length) return "";
  return `
    <div class="divider-star"></div>
    <h4 style="font-size:14px; margin-bottom:14px;">Упражнения</h4>
    ${ex.map((block, bi)=>{
      if(block.type === "tf"){
        return `
        <div class="ex-group" data-b="${bi}">
          <div class="ex-group-title">${bi+1}. ${block.title}</div>
          ${block.items.map((it,ii)=>`
            <div class="tf-row" data-i="${ii}" data-a="${it.a ? 1 : 0}">
              <span class="tf-text">${ii+1}. ${escapeHtml(it.q)}</span>
              <span class="tf-btns">
                <button class="tf-btn" data-v="1">Правильно</button>
                <button class="tf-btn" data-v="0">Неправильно</button>
              </span>
            </div>`).join("")}
        </div>`;
      }
      if(block.type === "choice"){
        return `
        <div class="ex-group" data-b="${bi}">
          <div class="ex-group-title">${bi+1}. ${block.title}</div>
          ${block.items.map((it,ii)=>{
            const parts = it.text.split("{}");
            let html = `<span class="gap-num">${ii+1}.</span> `;
            parts.forEach((pt,k)=>{
              html += escapeHtml(pt);
              if(k < parts.length-1){
                html += `<span class="ch-set" data-i="${ii}" data-k="${k}">` +
                  it.choices[k].map(c=>`<button class="ch-opt" data-v="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join("") +
                  `</span>`;
              }
            });
            return `<div class="gap-row" data-i="${ii}">${html}</div>`;
          }).join("")}
        </div>`;
      }
      if(block.type === "open"){
        return `
        <div class="ex-group" data-b="${bi}">
          <div class="ex-group-title">${bi+1}. ${block.title}</div>
          ${block.note ? `<p class="ex-note">${escapeHtml(block.note)}</p>` : ""}
          ${block.items.map((it,ii)=>`
            <div class="open-row">
              <div class="open-q"><span class="gap-num">${ii+1}.</span> ${escapeHtml(it.q)}</div>
              <textarea class="open-in" rows="1" placeholder="Javobingizni yozing..." spellcheck="false"></textarea>
              <button class="open-toggle" data-b="${bi}" data-i="${ii}">Namunani ko'rish</button>
              <div class="open-a" id="oa-${bi}-${ii}" style="display:none;">${escapeHtml(it.a)}</div>
            </div>`).join("")}
        </div>`;
      }
      // gap
      return `
        <div class="ex-group" data-b="${bi}">
          <div class="ex-group-title">${bi+1}. ${block.title}</div>
          ${block.bank ? `<div class="gap-bank">${block.bank.map(w=>`<span>${escapeHtml(w)}</span>`).join("")}</div>` : ""}
          ${block.items.map((it,ii)=>{
            const parts = it.text.split("{}");
            let html = `<span class="gap-num">${ii+1}.</span> `;
            parts.forEach((pt,k)=>{
              html += escapeHtml(pt);
              if(k < parts.length-1){
                html += `<input class="gap-in" data-i="${ii}" data-k="${k}" size="${Math.max(3,(it.answers[k]||"").length+1)}" autocomplete="off" spellcheck="false">`;
              }
            });
            return `<div class="gap-row" data-i="${ii}">${html}</div>`;
          }).join("")}
        </div>`;
    }).join("")}
    <div class="ex-actions">
      <button class="btn btn-primary btn-sm" id="exCheck">Tekshirish</button>
      <button class="btn btn-ghost btn-sm" id="exShow">Javoblarni ko'rsatish</button>
    </div>
    <div id="exScore" class="ex-score" style="display:none;"></div>`;
}

function wireExercises(el, article){
  const ex = article.exercises || [];
  if(!ex.length) return;

  el.querySelectorAll(".ch-set .ch-opt").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const set = btn.closest(".ch-set");
      set.querySelectorAll(".ch-opt").forEach(b=>b.classList.remove("picked","ok","no"));
      btn.classList.add("picked");
      set.dataset.picked = btn.dataset.v;
    });
  });
  el.querySelectorAll(".open-toggle").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const box = document.getElementById("oa-"+btn.dataset.b+"-"+btn.dataset.i);
      const on = box.style.display === "none";
      box.style.display = on ? "block" : "none";
      btn.textContent = on ? "Namunani yashirish" : "Namunani ko'rish";
    });
  });

  el.querySelectorAll(".tf-row .tf-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const row = btn.closest(".tf-row");
      row.querySelectorAll(".tf-btn").forEach(b=>b.classList.remove("picked"));
      btn.classList.add("picked");
      row.dataset.picked = btn.dataset.v;
      row.classList.remove("ok","no");
    });
  });

  function grade(reveal){
    let right = 0, total = 0;
    ex.forEach((block, bi)=>{
      const group = el.querySelector(`.ex-group[data-b="${bi}"]`);
      if(block.type === "tf"){
        block.items.forEach((it,ii)=>{
          total++;
          const row = group.querySelector(`.tf-row[data-i="${ii}"]`);
          const want = it.a ? "1" : "0";
          const got  = row.dataset.picked;
          row.classList.remove("ok","no");
          if(got === want){ right++; row.classList.add("ok"); }
          else if(got !== undefined || reveal){
            row.classList.add("no");
            if(reveal){
              row.querySelectorAll(".tf-btn").forEach(b=>b.classList.toggle("correct", b.dataset.v === want));
            }
          }
        });
      } else if(block.type === "choice"){
        block.items.forEach((it,ii)=>{
          it.answers.forEach((ans,k)=>{
            total++;
            const set = group.querySelector(`.ch-set[data-i="${ii}"][data-k="${k}"]`);
            if(!set) return;
            const got = set.dataset.picked;
            set.querySelectorAll(".ch-opt").forEach(b=>{
              b.classList.remove("ok","no");
              if(reveal && b.dataset.v === ans) b.classList.add("ok");
            });
            if(got === ans){
              right++;
              set.querySelector(`.ch-opt[data-v="${ans}"]`).classList.add("ok");
            } else if(got !== undefined){
              set.querySelector(`.ch-opt[data-v="${got}"]`).classList.add("no");
              if(reveal) set.querySelector(`.ch-opt[data-v="${ans}"]`).classList.add("ok");
            }
          });
        });
      } else if(block.type === "open"){
        // free writing: not auto-scored, model answers are revealed instead
        if(reveal) block.items.forEach((it,ii)=>{
          const box = document.getElementById("oa-"+bi+"-"+ii);
          if(box) box.style.display = "block";
        });
      } else {
        block.items.forEach((it,ii)=>{
          it.answers.forEach((ans,k)=>{
            total++;
            const inp = group.querySelector(`.gap-in[data-i="${ii}"][data-k="${k}"]`);
            if(!inp) return;
            inp.classList.remove("ok","no");
            if(exNorm(inp.value) === exNorm(ans)){ right++; inp.classList.add("ok"); }
            else{
              inp.classList.add("no");
              if(reveal){ inp.value = ans; inp.classList.remove("no"); inp.classList.add("shown"); }
            }
          });
        });
      }
    });
    const box = el.querySelector("#exScore");
    box.style.display = "flex";
    box.innerHTML = reveal
      ? `<span>Javoblar ko'rsatildi</span><span>${right}/${total}</span>`
      : `<span>Natija</span><span>${right}/${total} to'g'ri</span>`;
  }

  el.querySelector("#exCheck").addEventListener("click", ()=>grade(false));
  el.querySelector("#exShow").addEventListener("click", ()=>grade(true));
}

/* ===================== article vocabulary panel =====================
   The glossary already exists for the inline highlights; here it is gathered
   below the text as a self-test strip. Translations start hidden so the panel
   works as recall practice rather than a list the eye slides over.        */
function renderArticleVocab(article){
  const g = article.glossary || [];
  if(!g.length) return "";
  const canTest = new Set(g.map(x=>x.uz)).size >= 4;
  return `
    <div class="artvocab" id="artVocab">
      <div class="artvocab-head">
        <div>
          <span class="artvocab-title">Словарь к тексту</span>
          <span class="artvocab-count">${g.length} ta so'z</span>
        </div>
        <div class="artvocab-tools">
          <button class="btn btn-ghost btn-sm" id="avToggle">Tarjimalarni ko'rsatish</button>
          ${canTest ? `<button class="btn btn-primary btn-sm" id="avTest">O'zingizni tekshiring</button>` : ""}
        </div>
      </div>

      <div class="artvocab-grid" id="avGrid">
        ${g.map((w,i)=>`
          <button class="av-card" data-i="${i}">
            <span class="av-term">${escapeHtml(w.term)}</span>
            <span class="av-uz">${escapeHtml(w.uz)}</span>
            <span class="av-more">
              <span class="av-def">${escapeHtml(w.def || "")}</span>
              ${w.ex ? `<span class="av-ex">${escapeHtml(w.ex)}</span>` : ""}
            </span>
          </button>`).join("")}
      </div>

      <div class="av-test" id="avTestBox" style="display:none;"></div>
    </div>`;
}

function wireArticleVocab(el, article){
  const g = article.glossary || [];
  if(!g.length) return;
  const grid = el.querySelector("#avGrid");
  if(!grid) return;

  grid.querySelectorAll(".av-card").forEach(card=>{
    card.addEventListener("click", ()=> card.classList.toggle("open"));
  });

  const toggle = el.querySelector("#avToggle");
  toggle.addEventListener("click", ()=>{
    const showing = grid.classList.toggle("reveal-all");
    toggle.textContent = showing ? "Tarjimalarni yashirish" : "Tarjimalarni ko'rsatish";
    if(!showing) grid.querySelectorAll(".av-card.open").forEach(c=>c.classList.remove("open"));
  });

  const testBtn = el.querySelector("#avTest");
  if(!testBtn) return;
  const box = el.querySelector("#avTestBox");

  function startTest(){
    // up to 6 words, each with three options drawn from this article only
    const pool = shuffled(g).slice(0, Math.min(6, g.length));
    let idx = 0, score = 0;

    function step(){
      if(idx >= pool.length){
        const pct = Math.round(score/pool.length*100);
        box.innerHTML = `
          <div class="av-result">
            <div class="av-score">${score}/${pool.length}</div>
            <p>${pct===100 ? "Barchasi to'g'ri!" : "Yana urinib ko'ring — so'zlar aralashtiriladi."}</p>
            <div class="shadow-actions" style="justify-content:center;">
              <button class="btn btn-primary btn-sm" id="avAgain">Yana bir marta</button>
              <button class="btn btn-ghost btn-sm" id="avClose">Yopish</button>
            </div>
          </div>`;
        box.querySelector("#avAgain").addEventListener("click", startTest);
        box.querySelector("#avClose").addEventListener("click", ()=>{
          box.style.display = "none"; box.innerHTML = "";
          testBtn.textContent = "O'zingizni tekshiring";
        });
        return;
      }
      const w = pool[idx];
      const wrong = shuffled(g.filter(x=>x.uz !== w.uz)).slice(0,2);
      const opts = shuffled([w, ...wrong]);
      box.innerHTML = `
        <div class="av-q">
          <div class="act-meta">Savol ${idx+1} / ${pool.length} · to'g'ri: ${score}</div>
          <div class="av-word">${escapeHtml(w.term)}</div>
          <div class="trki-options">
            ${opts.map((o,k)=>`<button class="trki-opt" data-ok="${o.uz===w.uz?1:0}"><span class="letter">${LETTERS[k]})</span><span>${escapeHtml(o.uz)}</span></button>`).join("")}
          </div>
        </div>`;
      let answered = false;
      box.querySelectorAll(".trki-opt").forEach(b=>{
        b.addEventListener("click", ()=>{
          if(answered) return;
          answered = true;
          const ok = b.dataset.ok === "1";
          box.querySelectorAll(".trki-opt").forEach(x=>{
            x.disabled = true;
            if(x.dataset.ok === "1") x.classList.add(ok && x===b ? "picked-correct" : "reveal-correct");
          });
          if(ok) score++; else b.classList.add("picked-wrong");
          setTimeout(()=>{ idx++; step(); }, ok ? 650 : 1400);
        });
      });
    }
    box.style.display = "block";
    testBtn.textContent = "Testni qayta boshlash";
    step();
    box.scrollIntoView({behavior:"smooth", block:"nearest"});
  }
  testBtn.addEventListener("click", startTest);
}

function renderArticleDetail(el, articleId){
  const found = findArticle(articleId);
  if(!found){ openArticleId = null; renderArticles(); return; }
  const {article, level} = found;
  const read = state.articlesRead.includes(article.id);
  const fullText = article.blocks.filter(b=>b.type==="p"||b.type==="q").map(b=>b.text).join(" ");
  const mins = readingMinutes(article);

  const siblings = DATA.articles[level];
  const idx = siblings.findIndex(a=>a.id===article.id);
  const prevArt = siblings[idx-1];
  const nextArt = siblings[idx+1];

  el.innerHTML = `
    <button class="read-exit" id="artBack">← Maqolalar ro'yxati</button>
    <div class="panel">
      <div class="badge-row">
        <span class="badge badge-level">${CEFR_LEVELS.find(l=>l.id===level).label}</span>
        <span class="badge badge-kind">${articleKind(article)}</span>
        <span class="badge badge-time">📖 ~${mins} daqiqa · ${articleWordCount(article)} so'z</span>
      </div>
      <div class="ex-head">
        <h3 style="font-family:var(--font-read); font-size:30px; font-weight:700; line-height:1.22; letter-spacing:-.015em;">${article.title}</h3>
        <div style="display:flex; gap:8px; align-items:center;">
          <div class="font-ctrl">
            <button id="fontMinus" title="Matnni kichraytirish">A-</button>
            <button id="fontPlus" title="Matnni kattalashtirish">A+</button>
          </div>
          <button class="btn btn-ghost btn-sm" id="artSpeak">🔊 Tinglash</button>
        </div>
      </div>
      ${article.subtitle ? `<p style="font-family:var(--font-read); font-style:italic; color:var(--ink-soft); font-size:17px; line-height:1.5; margin-bottom:22px;">${article.subtitle}</p>` : ""}
      ${article.author ? `<div class="article-byline"><b>${article.author.name}</b><span>${article.author.role}</span></div>` : ""}
      <div id="artBody" style="--article-fs:${17*state.articleFontScale}px;">
        ${article.blocks.map(b => {
          if(b.type==="h") return `<h4 style="font-family:var(--font-read); font-size:21px; font-weight:700; margin:34px 0 10px; color:var(--ink); letter-spacing:-.01em;">${escapeHtml(b.text)}</h4>`;
          if(b.type==="q") return `<div class="article-quote">${highlightVocab(b.text, article.glossary)}</div>`;
          return `<p class="article-text" style="margin-bottom:14px;">${highlightVocab(b.text, article.glossary)}</p>`;
        }).join("")}
      </div>
      <p class="vocab-hint">💡 Ajratib ko'rsatilgan so'zlarni bosing — tarjimasi, izohi va misoli chiqadi.</p>
      ${renderArticleVocab(article)}
      <div class="divider-star"></div>
      ${article.questions && article.questions.length ? `
        <h4 style="font-size:14px; margin-bottom:4px;">Задания к тексту</h4>
        <p style="font-size:12.5px; color:var(--ink-soft); margin-bottom:16px;">Matnni o'qib chiqing. Har bir savol uchun matn mazmunini eng to'liq va aniq ifodalovchi javobni tanlang (TRKI namunasi).</p>
        <div id="trkiList">
          ${article.questions.map((q,i)=>`
            <div class="trki-item" data-idx="${i}" data-correct="${q.correct}">
              <div class="trki-stem">${i+1}. ${q.stem}</div>
              <div class="trki-options">
                ${q.options.map((opt,oi)=>`<button class="trki-opt" data-oi="${oi}"><span class="letter">${LETTERS[oi]})</span><span>${opt}</span></button>`).join("")}
              </div>
            </div>`).join("")}
        </div>
        <div class="trki-score" id="trkiScore" style="display:none;"></div>` : ""}
      ${renderExercises(article)}
      <div style="margin-top:16px;">
        <button class="btn ${read?'btn-primary':'btn-warm'}" id="artDone">${read ? "✓ O'qilgan" : "O'qib bo'ldim"}</button>
      </div>
      <div class="read-nav">
        <button class="btn btn-ghost btn-sm" id="prevArt" ${!prevArt?"disabled":""}>${prevArt ? "← "+prevArt.title : "← Oldingi maqola yo'q"}</button>
        <button class="btn btn-ghost btn-sm" id="nextArt" ${!nextArt?"disabled":""}>${nextArt ? nextArt.title+" →" : "Keyingi maqola yo'q →"}</button>
      </div>
    </div>
  `;

  document.getElementById("artBack").addEventListener("click", ()=>{ openArticleId = null; renderArticles(); });
  document.getElementById("artSpeak").addEventListener("click", ()=> speak(fullText));
  wireExercises(el, article);
  wireArticleVocab(el, article);

  el.querySelectorAll(".vocab-hl").forEach(span=>{
    const open = (e)=>{
      e.stopPropagation();
      el.querySelectorAll(".vocab-hl.active").forEach(o=>o.classList.remove("active"));
      span.classList.add("active");
      showWordSheet(article.glossary[+span.dataset.g]);
    };
    span.addEventListener("click", open);
    span.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); open(e); } });
  });

  // font-size control: mutate the existing DOM in place so quiz progress isn't lost
  document.getElementById("fontMinus").addEventListener("click", ()=>{
    state.articleFontScale = Math.max(0.8, +(state.articleFontScale - 0.1).toFixed(2));
    saveState();
    document.getElementById("artBody").style.setProperty("--article-fs", (17*state.articleFontScale)+"px");
  });
  document.getElementById("fontPlus").addEventListener("click", ()=>{
    state.articleFontScale = Math.min(1.4, +(state.articleFontScale + 0.1).toFixed(2));
    saveState();
    document.getElementById("artBody").style.setProperty("--article-fs", (17*state.articleFontScale)+"px");
  });

  // TRKI-style reading comprehension: single-answer multiple choice, instant per-question feedback + running score
  function updateTrkiScore(){
    const items = el.querySelectorAll(".trki-item");
    const answered = [...items].filter(it => it.dataset.answered);
    const correct = answered.filter(it => it.querySelector(".picked-correct")).length;
    const box = document.getElementById("trkiScore");
    if(answered.length===0){ box.style.display="none"; return; }
    box.style.display = "flex";
    if(answered.length < items.length){
      box.innerHTML = `<span>Javob berildi: ${answered.length}/${items.length}</span><span>${correct} ta to'g'ri</span>`;
    } else {
      box.innerHTML = `<span>Natija tayyor! 🎉</span><span>${correct}/${items.length} to'g'ri javob</span>`;
    }
  }
  el.querySelectorAll(".trki-item").forEach(item=>{
    item.querySelectorAll(".trki-opt").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        if(item.dataset.answered) return;
        const correctIdx = item.dataset.correct;
        const pickedIdx = btn.dataset.oi;
        item.dataset.answered = "true";
        item.querySelectorAll(".trki-opt").forEach(b=>{
          b.disabled = true;
          if(b.dataset.oi === correctIdx) b.classList.add(pickedIdx===correctIdx ? "picked-correct" : "reveal-correct");
        });
        if(pickedIdx !== correctIdx) btn.classList.add("picked-wrong");
        updateTrkiScore();
      });
    });
  });

  document.getElementById("artDone").addEventListener("click", ()=>{
    if(!state.articlesRead.includes(article.id)){
      state.articlesRead.push(article.id);
      logActivity(6);
      saveState();
      renderArticleDetail(el, articleId);
    }
  });
  if(prevArt) document.getElementById("prevArt").addEventListener("click", ()=>{ openArticleId = prevArt.id; renderArticles(); });
  if(nextArt) document.getElementById("nextArt").addEventListener("click", ()=>{ openArticleId = nextArt.id; renderArticles(); });
}

  document.getElementById("wsUz").textContent = entry.uz || "";
  document.getElementById("wsDef").textContent = entry.def || "";
  const ex = document.getElementById("wsEx");

  ex.style.display = entry.ex ? "block" : "none";

function hideWordSheet(){
  document.getElementById("wordSheet").classList.remove("open");

}

function applyTheme(){
  const dark = state.theme === "dark";
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute("content", dark ? "#1E252E" : "#FFFFFF");
  const cs = document.querySelector('meta[name="color-scheme"]');
  if(cs) cs.setAttribute("content", dark ? "dark" : "only light");
  const btn = document.getElementById("themeBtn");
  if(btn) btn.innerHTML = dark ? ICON_SUN : ICON_MOON;
}

function toggleTheme(){
  state.theme = state.theme === "dark" ? "light" : "dark";
  applyTheme();
  saveState();
}

/* ===================== INIT ===================== */
document.getElementById("resetBtn").addEventListener("click", resetProgress);
document.getElementById("themeBtn").addEventListener("click", toggleTheme);
document.getElementById("wsClose").addEventListener("click", hideWordSheet);
document.getElementById("wsSpeak").addEventListener("click", ()=>{ if(wsCurrent) speak(wsCurrent.ex || wsCurrent.term); });
document.addEventListener("click", e=>{
  const sheet = document.getElementById("wordSheet");
  if(sheet.classList.contains("open") && !sheet.contains(e.target) && !e.target.closest(".vocab-hl")) hideWordSheet();
});
document.addEventListener("keydown", e=>{ if(e.key === "Escape") hideWordSheet(); });
applyTheme();
loadState();
</script>
</body>
</html>
