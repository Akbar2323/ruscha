          {type:"p", text:"В конце концов Иван решил, что ему нужно что-то изменить. Однажды, когда он возвращался после работы домой, он заметил киоск с лотерейными билетами. Иван остановился перед этим киоском. И несмотря на то что он не верил, что сможет выиграть, он купил билет."},
          {type:"p", text:"На следующий день Иван как обычно рано утром пошёл на работу. И как обычно хозяин ругал его за какие-то мелочи. И так продолжалось ещё несколько месяцев, пока однажды он не получил на телефон сообщение. В сообщении было всего 5 слов, но эти слова изменили его жизнь навсегда: «Вы выиграли 10 000 000 рублей!» И в этот же день его начальник сообщил ему, что увольняет его. Но когда он увидел сияющие от счастья глаза Ивана, он долго не мог понять, чему он так радовался."},
          {type:"h", text:"Новая жизнь"},
          {type:"p", text:"Иван был рад, что теперь может осуществить свою давнюю мечту, что он может развиваться, используя свой опыт и способности, и стать успешным модельером."},
          {type:"p", text:"Первое, что он сделал, это открыл свою собственную мастерскую и начал шить одежду, которая отражала его оригинальный и неповторимый стиль. Количество его клиентов росло с каждым днём. Заказов становилось всё больше и больше. Скоро он переехал в Москву и стал одним из самых известных модельеров в городе. Его клиентами были как обычные люди, так и известные артисты и музыканты."},
          {type:"p", text:"И вот однажды в его ателье пришёл директор одного очень известного французского дома моды. Он хотел заказать себе в Москве костюм с элементами русского стиля. И ему очень понравилась одежда, создаваемая Иваном и его коллегами. И директор французского дома моды пригласил Ивана на работу в Париж. Недолго думая, Иван согласился, и через некоторое время он стал одним из самых известных в мире модельеров из России."},
          {type:"p", text:"И всё это произошло благодаря тому, что однажды Иван решил рискнуть и купил тот счастливый лотерейный билет!"}

      {
        id:"vperyod-k-mechte-b1",
        isNew:true,
        title:"Вперёд к мечте",
        subtitle:"Как визажистка из Иванова стала блогером-миллионником.",
        blocks:[
          {type:"p", text:"Ещё совсем недавно Алёна из «города невест» Иваново даже не думала о том, что через несколько лет её жизнь сильно изменится и она станет блогером-миллионником."},
          {type:"p", text:"Алёна – обычная русская девушка, которая после школы закончила колледж визажистов в своём родном городе Иваново. У Алёны был талант создавать прекрасные образы, которые подчёркивали индивидуальность каждого человека. Её подруги часто просили Алёну сделать им макияж на свадьбу, день рождения или свидание, и она с удовольствием это делала."},
          {type:"p", text:"Однажды одна из них предложила Алёне сфотографировать её работы и выложить фотографии в известную социальную сеть. Алёна решила последовать этому совету, и так начался её путь к популярности. Сначала у неё было всего несколько подписчиков, но благодаря высокому уровню мастерства и профессионализма, а также красоте и оригинальности её работ, число её подписчиков быстро росло."},
          {type:"h", text:"Путь к популярности"},
          {type:"p", text:"Люди начали замечать её талант, и многие стали приходить к ней за советами и услугами по макияжу. Популярность Алёны как визажиста росла. За её творчеством следили не только жители Иванова, но и жители других городов России. Они оставляли положительные отзывы и комментарии под её работами."},
          {type:"p", text:"Когда количество подписчиков достигло нескольких тысяч, Алёна решила публиковать не только фотографии, но и видео. Она записывала видеоролики, где показывала процесс создания макияжа, объясняла техники и секреты своего мастерства, а также отвечала на вопросы зрителей и подписчиков. Видеоролики Алёны вмиг становились популярными, и у неё появилась узнаваемость. Её начали называть «Богиней макияжа»."},
          {type:"p", text:"Несмотря на то что большинство отзывов были положительными, Алёне приходилось сталкиваться с негативными комментариями от хейтеров. Но она не обращала на них особого внимания и продолжала творить, оставаясь верной своим идеалам и ценностям."},
          {type:"p", text:"Благодаря своему упорству и трудолюбию, Алёна смогла добиться настоящего успеха. Ещё через несколько месяцев количество её подписчиков достигло одного миллиона, и она стала одним из самых известных блогеров в области макияжа в России."},
          {type:"p", text:"Сейчас у Алёны есть свой блог, своя аудитория, свой бренд, и при этом она продолжает активно работать: проводит мастер-классы и тренинги, сотрудничает с известными брендами косметики, снимается в телевизионных шоу и фотосессиях. История Алёны является ярким примером того, как можно добиться успеха, следуя за своей мечтой и веря в себя и свой талант."}

        blocks:[
          {type:"p", text:"Жил-был диван-ворчун. На самом деле это был самый обычный зелёный диван, который молодая семья купила в мебельном магазине 20 лет назад. Тогда он был новый и красивый. Этот диван был гордостью квартиры. И молодые люди заботились о нём и относились к нему, как к члену своей семьи."},
          {type:"p", text:"Но время шло, и в семье росли дети – мальчик Витя и девочка Галя. И с каждым годом отношение к дивану становилось всё хуже и хуже. Его стали реже чистить, на него бросали и не убирали разные вещи, а под диваном лежали какие-то бумажки, детские игрушки, очки и даже старый носок. А один раз Галя пролила на диван кофе, и на нём осталось большое тёмное пятно."},
          {type:"p", text:"Конечно, дивану всё это не нравилось. Ему было обидно, что его больше не ценят. И когда диван оставался один дома, он начинал ворчать, выражая своё недовольство: «Как же так можно вести себя со мной? Да, я уже не такой молодой и красивый, как раньше! Мне 20 лет, я почти пенсионер! Меня бы помыть и почистить, а тут такое! И как они не понимают, что мне тоже нужна любовь и забота?»"},
          {type:"h", text:"Вечеринка"},
          {type:"p", text:"И вот однажды семья, в которой жил диван, решила устроить вечеринку и пригласила много гостей. В их числе была одна пара с пятилетним мальчиком. И маленькому мальчику очень понравился этот старый зелёный диван. Мальчик оказался очень активным и решил попрыгать на диване. И тут бедный диван как затрещал! Он издал громкий звук. Все гости испуганно замолчали, а маленький мальчик покраснел и заплакал. У дивана сломалась правая ножка."},
          {type:"p", text:"Диван уже не смог сдерживать свои эмоции и закричал: «Вот теперь вы видите, что происходит, когда люди не ценят вещи! Я был вашим другом, а вы меня не уважали, а только использовали! Я больше не хочу и не буду терпеть такого отношения!»"},

          {type:"p", text:"А когда к Вите и Гале приехали в гости их бабушка и дедушка и увидели, что случилось с диваном, они решили забрать диван к себе на дачу. «На даче ему будет лучше», – сказала бабушка. И действительно, в загородном доме бабушки и дедушки диван перестал злиться и ворчать. Он впервые за долгое время почувствовал, что он нужен, что его любят и ценят! Диван был очень рад общению с бабушкой и дедушкой."},

        subtitle:"Два друга построили машину времени и отправились в будущее.",
        blocks:[
          {type:"p", text:"В одном небольшом провинциальном городе жил молодой учёный по имени Евгений. Он всегда мечтал о том, чтобы создать машину времени и отправиться в прошлое или даже в будущее. День и ночь он работал над своим изобретением. И вот пришёл тот день, когда он построил настоящую машину времени и предложил своему другу программисту Сергею отправиться в путешествие во времени. И поехать они решили в будущее."},
          {type:"p", text:"Когда они приехали и вышли из машины, они почувствовали, что было очень жарко. И в городе, куда они попали, было огромное количество людей, не похожих на тех, которые жили в их реальном мире. Они были намного выше обычных людей и двигались по улицам очень быстро. И у каждого в руке был какой-то мини-компьютер, с которым они говорили на каком-то странном языке."},
          {type:"p", text:"Когда Сергей попробовал спросить у одного прохожего на английском языке, где они находятся и как называется этот город, прохожий ответил ему на языке, который не был похож ни на один из языков, которые он знал. Это была какая-то смесь из английского, китайского и какого-то африканского языков. «Совсем ничего не понятно», – сказал Евгений."},
          {type:"h", text:"Город будущего"},
          {type:"p", text:"И они пошли дальше гулять и изучать этот новый для них мир. Кроме необычных людей, на улицах этого города было очень много роботов, которые убирали улицы, ремонтировали дороги; роботы-полицейские следили за порядком. Так как было очень жарко, друзья решили пойти в какой-нибудь магазин, чтобы купить воды. Когда они шли, на дорогах они заметили машины, в которых не было водителей, а над ними летал ещё какой-то беспилотный транспорт."},
          {type:"p", text:"Наконец, они пришли в магазин. В магазине были очень странные продукты, которые они раньше никогда не видели: напитки из каких-то экзотических растений, салаты из водорослей, мясо из гусениц и жуков и необычные морепродукты. Друзья взяли воду и пошли на кассу. Но кассы не было. А около выхода из магазина стоял огромный компьютер, который, как они потом поняли, уже снял деньги с их банковской карты."},
          {type:"h", text:"Обратно домой"},

        subtitle:"Пожилая женщина в бизнес-классе, важный господин рядом — и история, которая всех удивила.",
        blocks:[
          {type:"p", text:"Эта история произошла в конце сентября. В бизнес-классе самолёта, который летел из Мурманска в Москву, сидела пожилая женщина. На вид ей было лет 80. Её одежда была очень скромной и старой. На голове у женщины был платок, в руках – старенькая дамская сумочка и какая-то фотография."},
          {type:"p", text:"Рядом с пожилой женщиной сидел важный господин. На нём был деловой костюм чёрного цвета и белая рубашка. Он важно сидел в своём кресле, на столе перед ним стоял дорогой ноутбук. Мужчина пил дорогое шампанское и что-то печатал на ноутбуке. Иногда он вставал, доставал какие-то вещи из своей кожаной сумки, потом снова садился на своё место, открывал ноутбук и как-то странно смотрел на свою соседку. Было видно, что ему явно не нравилось такое соседство."},
          {type:"p", text:"Минут через 30 после начала полёта он неожиданно очень невежливо обратился к старушке: «Уважаемая! Я не знаю, как Вас зовут и как Вы оказались в бизнес-классе самолёта, но я буду очень благодарен Вам, если Вы пересядете в экономкласс. Для моей работы мне нужно больше места, а в экономклассе я видел одно свободное место. Это место как раз для Вас!»"},
          {type:"p", text:"В это время стюардесса, которая проходила мимо, услышала слова этого господина и сказала: «Эта женщина заплатила за свой билет и, как и Вы, имеет право лететь в бизнес-классе и сидеть на своём месте». «Вам что-нибудь принести?» – обратилась стюардесса к старушке."},
          {type:"h", text:"История старушки"},
          {type:"p", text:"Пожилая женщина только покачала головой и начала рассказывать свою историю, которая поразила не только стюардессу и важного господина, но и других пассажиров бизнес-класса."},
          {type:"p", text:"«Я никогда не жила богато», – так начала свой рассказ старушка. «Полжизни я проработала поваром на судоремонтном заводе в Мурманске. Работу свою я любила, хотя зарплата моя была небольшой. Никогда в жизни я не летала на самолёте, но всегда мечтала работать стюардессой. Мне казалось, что это очень романтично: видеть рассветы, закаты, небо, облака."},
          {type:"p", text:"Но главная мечта моей жизни – это увидеть своего внука, которого я не видела 20 лет. Когда моему внуку Николаю было всего 4 года, я поссорилась с его мамой, моей дочерью, и она увезла его в Москву. Сейчас я пенсионерка, и всё это время я копила каждый рубль, экономила на одежде и продуктах, жила очень скромно, чтобы накопить на билет на самолёт в бизнес-класс и встретиться со своим внуком и поздравить его с днём рождения»."},
          {type:"p", text:"В этот момент её соседу в дорогом костюме стало очень стыдно за свои слова, и он сказал: «Извините меня. Я не знал…» Стюардесса же спросила старушку: «Кем же работает Ваш внук?» – «Он пилот», – ответила пожилая женщина, – «как раз сейчас он сидит за штурвалом этого самолёта. И сегодня у него день рождения. Я очень хочу поздравить его с этим днём и сказать ему, что я очень его люблю»."},
          {type:"h", text:"Встреча"},
          {type:"p", text:"Когда самолёт, наконец, прилетел в Москву, стюардесса попросила пилота выйти к пассажирам. Когда Николай вышел из кабины, все пассажиры начали аплодировать ему, а старушка подошла к нему с фотографией в руке и сказала: «Коля, я твоя бабушка. На этой фотографии тебе 4 года, и я подарила тебе игрушечный самолёт. Сегодня тебе 25 лет, и ты уже сам управляешь самолётом. Я очень горжусь тобой. Сегодня я самая счастливая»."},
          {type:"p", text:"Николай обнял бабушку, а другие пассажиры ещё стояли и не спешили выходить из салона, чтобы не мешать бабушке и внуку."},
          {type:"p", text:"Вот так билет на самолёт стал для бабушки Николая не просто пропуском в другой класс, а билетом к долгожданной встрече и к исполнению самой большой мечты её жизни."}

        blocks:[
          {type:"p", text:"В небольшой русской деревне в летнем поле стояла необычная фигура – смешное пугало по имени Вася. На нём была старая жёлтая рубашка, короткие зелёные шорты и нелепая красная шляпа. Вообще, это пугало должно было пугать птиц и защищать урожай. Но Вася никого не хотел пугать. Наоборот, он был очень дружелюбным и добрым пугалом. Ему было скучно просто так день и ночь стоять в огороде. Он мечтал, что когда-нибудь кто-нибудь обязательно обратит на него внимание. Он хотел быть душой компании, а не страшным стражем."},
          {type:"p", text:"И вот однажды утром, когда на горизонте появилось солнце, к Васе прилетела маленькая птичка – синичка. Она совсем не испугалась его. Птичка села на его шляпу и громко закричала: «Ты почему такой грустный?» Вася не мог говорить, он же был пугалом. Но на его деревянном лице вдруг появилась широкая улыбка. Он был очень рад. Синичка стала прилетать к Васе каждый день и рассказывать ему разные новости. Так началась их дружба. Васе уже не было так грустно и одиноко."},
          {type:"p", text:"Через два дня синичка прилетела к Васе, но уже не одна. С ней были другие синички, которым она рассказала о своём новом друге. А на третий день прилетели скворцы и весёлые воробьи. Птицы рассказывали Васе истории о своей жизни, о встречах с другими птицами, о далёких путешествиях и даже о том, как спасли птенца от кошки. Некоторые птицы пели Васе песни, а Вася дарил им свою добрую и широкую улыбку. Теперь Вася был не одиноким пугалом, а душой компании."},
          {type:"h", text:"Вороны"},
          {type:"p", text:"И вот однажды днём, когда друзья Васи спали, к Васе прилетели вороны. Один ворон сел ему на шляпу, другой стал рвать его рубашку, третий ворон громко кричал. Хотя Вася был очень испуган, он ничего не мог сделать. И вдруг он увидел, что его друзья птицы летят к нему, чтобы его защитить. Вороны разлетелись в разные стороны, а птицы снова были рядом со своим деревянным другом."},
          {type:"h", text:"Прощание"},
          {type:"p", text:"Время шло, и скоро наступила осень. В это время в поле начали собирать урожай. К Васе снова прилетела та самая синичка, которая познакомила его со своими подругами. Эта синичка сказала Васе: «Мы скоро улетим в тёплые края, но мы всегда будем помнить о тебе. Ты стал для нас настоящим другом. Мы знаем, что ты не можешь двигаться, но твоё сердце полетит с нами. Твоя добрая улыбка будет согревать нас. Когда придёт весна, мы обязательно вернёмся»."},
          {type:"p", text:"Когда синичка сказала эти слова, прилетели её подруги, и они все вместе устроили для Васи прощальный концерт. Они пели самые красивые песни, которые знали, благодарили Васю за дружбу и тепло. А потом они улетели. Вася же всю осень и зиму хранил тёплые воспоминания о своих друзьях, которые сделали его жизнь в огороде интересной, яркой и незабываемой."}
        ],

        title:"Загадочный номер",
        subtitle:"Молодому человеку приснился номер телефона — и этот сон изменил его будущее.",
        blocks:[
          {type:"p", text:"Окончив школу, Эрик ещё не определился, чем он хотел бы заниматься в будущем. В школе он увлекался химией и биологией, но он не хотел быть ни химиком, ни биологом, ни врачом. Родители Эрика считали, что он мог бы стать социологом или журналистом, так как он обладал такими качествами, как коммуникабельность, наблюдательность, терпение, а также креативность и отзывчивость."},
          {type:"p", text:"И действительно, у Эрика было много друзей, которые его любили. Они вместе ходили в кино и в кафе, выезжали на природу, играли в онлайн-игры и в футбол. Когда кто-либо из его друзей нуждался в помощи, Эрик всегда приходил на помощь. И если Эрику нужна была помощь, его друзья всегда были рядом."},
          {type:"h", text:"Сон"},
          {type:"p", text:"И вот в один прекрасный летний день Эрику приснился незнакомый номер телефона, все цифры в котором были только 8 и 1. Проснувшись, он сразу же записал его. День-два Эрик не решался позвонить по этому номеру, но ему было очень любопытно, чей же этот номер и кто этот загадочный абонент."},
          {type:"p", text:"Наконец, через два дня Эрик решился позвонить по этому номеру. Ответила девушка. Эрик сказал ей, что видел её номер во сне. К большому удивлению Эрика, она не положила трубку, а ответила нормальным голосом: «Хорошо, я понимаю. Но сейчас я ничего не могу Вам рассказать. Ещё не время. Когда придёт время, Вы сами всё узнаете». После этого она положила трубку. Эрик был растерян и не мог понять, о чём говорила эта девушка и что он должен узнать."},
          {type:"h", text:"Встреча"},
          {type:"p", text:"Время шло, и вот наступил день, когда Эрик получил письмо с загадочным адресом. В письме было написано, что он должен прийти на определённое место в определённое время. Не сказав никому ни слова о случившемся, Эрик решился прийти на указанное место. На площади около входа в метро он встретил ту самую девушку, с которой разговаривал по телефону. Она представилась как Елена и рассказала ему, что она психолог, работает в Институте психоанализа и занимается изучением снов и их влиянием на реальность, на мозг и здоровье человека."},
          {type:"p", text:"Елена объяснила Эрику, что его сон был сигналом о том, что ему нужны были изменения в жизни. Эрик и сам это понимал, так как ему было пора определяться, куда идти учиться и чем заниматься в будущем. Эрик рассказал Елене, что ему было бы интересно заниматься изучением и анализом снов и что он хотел бы помогать людям, у которых проблемы со сном. И тогда Елена предложила ему поступить в Институт психоанализа и присоединиться к их научному коллективу, чтобы исследовать и анализировать сновидения людей."},
          {type:"p", text:"После встречи с Еленой Эрик успешно сдал экзамены и поступил на факультет психологии Института психоанализа. Это было началом его нового пути, полного интересных событий, встреч и открытий."}

        author:{name:"Светлана Орлова", role:"доктор медицинских наук, профессор, заведующая кафедрой клинической нутрициологии"},
        blocks:[
          {type:"p", text:"С наступлением осени на многих людей без видимой причины накатывает тоска, и чем реже выглядывает солнце, тем она сильнее. Этому есть научное обоснование."},
          {type:"p", text:"В человеческом организме есть фермент, который переводит аминокислоту триптофан в серотонин — гормон счастья. Катализатором процесса является витамин D, который вырабатывается в коже под действием солнечных, а точнее, ультрафиолетовых лучей. Когда его не хватает, у человека портится настроение, он хандрит и раздражается по пустякам, и даже поводов для радости у него как будто становится меньше."},
          {type:"q", text:"Самый «депрессивный» период — с середины октября по февраль."},
          {type:"p", text:"В это время многие жалуются на подавленное и полусонное состояние. Все потому, что из-за особенностей атмосферы осенью и зимой солнечные лучи с трудом достигают земли. К тому же в это время года человек полностью одет, а значит, кожа не получает достаточно витамина D. Даже поход в солярий не способен решить проблему — витамин D в этом случае хоть и образуется, но в недостаточном количестве. Зато можно получить проблему гораздо опаснее — развитие меланомы."},
          {type:"p", text:"Нехватка витамина D сказывается не только на настроении, но и на иммунитете. Защитные функции организма ослабевают, и человек начинает чаще болеть, что тоже никак не способствует поднятию духа."},
          {type:"p", text:"Больше всего осеннему унынию подвержены люди, чья работа связана с постоянным стрессом. Причем женщины мрачную погоду переносят тяжелее. А для метеозависимых людей, особенно пожилых, низкое давление, которое свойственно осенней погоде, и отсутствие ярких красок вовсе становится испытанием."},
          {type:"p", text:"Помочь организму просто: спать достаточное количество часов, отдыхать, гулять, вести активный образ жизни и, конечно же, правильно питаться. Хоть основной источник витамина D — солнце, он также поступает в организм из продуктов питания. Например, содержится в сливочном масле и рыбе. Доступен и в форме БАДов. Так что нехватку солнечного витамина вполне можно восполнить."}

      {
        id:"muzyka-emotsii",
        isNew:true,
        title:"Почему музыка заставляет нас испытывать эмоции",
        subtitle:"Под одну мелодию мы плачем, другая вызывает радость. Так происходит у всех? И что лучше слушать в важные моменты жизни?",
        blocks:[
          {type:"p", text:"Бывает, включишь в машине радио, слышишь знакомую мелодию, и на глазах появляются слезы. Или, наоборот, при первых звуках возникает радость и желание созидать. Это влияние музыки."},
          {type:"p", text:"По сути, музыка представляет собой организованный шум, который имеет три характеристики: частоту, ритм, громкость. От их сочетания зависит выброс гормонов, которые определяют эмоциональное состояние человека."},
          {type:"h", text:"Какая музыка повышает настроение"},
          {type:"p", text:"Наиболее приятной считается музыка, максимально воспроизводящая ритм сердца — 120 ударов в минуту. Он сохранен нами с пренатального периода — как ритм биения сердца матери, ассоциирующийся с безопасностью. Такая музыка активирует отдел мозга под названием «прилежащее ядро». Это стимулирует выработку двух гормонов: дофамина, отвечающего за удовольствие и мотивацию, интерес к жизни, и тироксина, который повышает уровень энергии."},
          {type:"p", text:"Из классики к такой музыке относятся, к примеру, Григ и Моцарт. Кстати, такой же ритм используется в сельском хозяйстве для повышения удоев."},
          {type:"p", text:"Для улучшения настроения отлично подходят афроамериканские ритмы — регги, блюзы. Они стимулируют выработку гормона окситоцина, что пробуждает либидо и настрой на романтику и доверие."},
          {type:"h", text:"Какую музыку слушать в периоды грусти и обиды"},
          {type:"p", text:"Если хочется дать выход переживаниям, можно послушать орган Баха, а в версии лайт — Eric Clapton «Tears in Heaven», R.E.M. «Everybody Hurts», Баста «Сансара». Эта музыка стимулирует выработку окситоцина с опиоидами, что придает душевным переживаниям мистико-философский окрас. Человек страдает, но при этом видит, что жизнь — это не только боль. Норадреналин с адреналином и тестостероном — это история выплеска агрессии. Для этого можно включить громче Nirvana «Negative Creep», The Prodigy «Smack My Bitch Up», Grimes «Kill V. Maim», Linkin Park «Bleed it Out», Muse «Assassin». Выброс агрессии происходит за счет сочетания темпа 140–160 ударов в минуту с повышенной громкостью. За рулем такую музыку лучше не слушать, так как она приводит к агрессивной манере вождения. Но есть в ней и положительный момент: можно поддерживать тяжелый физический труд или тренировки с большими весами."},
          {type:"h", text:"О чем говорят предпочтения в музыке"},
          {type:"p", text:"Предпочтения в музыке показывают интеллект, характер, жизненные стратегии человека. Так, песни ABBA, The Beatles — это позитивная музыка, имеющая темп 120–140 ударов в минуту. Человек, которому нравятся эти исполнители, открыт, излишне сентиментален, плохо переносит глупость, ограниченность суждений и негативизм. Но делать обратные выводы о характере не стоит. Предпочтения у всех разные."},
          {type:"p", text:"При этом музыка вызывает у многих людей одинаковые эмоции, на что влияет в том числе генетическая память. Специальная структура головного мозга — лимбическая система — содержит память нескольких поколений. Она особенно важна для выживания. Когда вы видите в лесу корягу, похожую на змею, отскакиваете, потому что работает лимбическая система: по опыту предков вы знаете, что укус змеи может быть смертелен."},
          {type:"p", text:"Треки, сохраненные в нашей генетической памяти, уже не способствуют выживанию, но они есть. Если человеку нравится, к примеру, скандинавская музыка, скорее всего, генетическая экспертиза покажет, что среди его предков были скандинавы. Видимо, мозг улавливает знакомые ноты, и музыка воспринимается как своя, родная."},
          {type:"p", text:"Наиболее сильное впечатление производит та музыка, которая обманывает наши ожидания, когда тихая мелодия, например, сменяется оглушительно громкой. Человеческий мозг настроен на новизну. Поэтому монотонность вызывает потерю интереса, а небольшой диапазон новизны, чередующейся с чем-то привычным, — его ростом. На новизну вырабатывается дофамин, а на узнавание знакомого — серотонин и эндорфин, которые иногда называют гормонами удовольствия."},
          {type:"h", text:"Как музыка влияет на организм человека"},
          {type:"p", text:"Музыка калибрует сердечный ритм, действует положительно на центральную, вегетативную нервные системы, улучшая работу внутренних органов и систем."},
          {type:"p", text:"Полезно слушать ее и во время занятий спортом. Это доказало исследование, проведенное в 2012 году учеными Университета Шеффилд — Халлам в Великобритании. Велосипедисты, слушающие музыку во время тренировки, при такой же нагрузке потребляют на 7% меньше кислорода, чем те, кто тренируются в тишине."},
          {type:"p", text:"Так что, собираясь в следующий раз на велопрогулку, не забудьте загрузить в плеер специальные треки. Желательно без слов, чтобы мозг активировал подкорковые отделы. Например, подойдут OK Go «Here it Goes Again», Ariana Grande «Be Me Baby», Katy Perry «One Of The Boys» и другие композиции с частотой 145 ударов в минуту."},
          {type:"p", text:"Консультант: Марина Спиранде, психолог-психосоматолог, консультативный член Психологической лиги."}

        subtitle:"Ученые полагают, что зубы мудрости достались нам от древних предков с более крупными челюстями",
        blocks:[
          {type:"p", text:"Зубы мудрости — это третий комплект моляров, расположенный в самом конце рта. По форме они напоминают первые и вторые моляры, но могут быть чуть меньше. Их называют зубами мудрости, потому что они появляются последними из 32 постоянных. Вырастают в возрасте от 17 до 25 лет, когда человек становится старше и, как считается, мудрее."},
          {type:"p", text:"Но не у всех. А многие из тех, у кого эти зубы все же вырастают, удаляют их. Так зачем они нужны?"},
          {type:"h", text:"Зубы наших предков"},
          {type:"p", text:"У обезьян, горилл и шимпанзе тоже есть зубы мудрости. И здесь есть связь. Несколько миллионов лет назад у обезьяноподобных предков челюсти и зубы были больше, чем у современных людей. Например, вид Australopithecus afarensis, прозванный видом Люси по имени известного ископаемого экземпляра, жил примерно три–четыре миллиона лет назад."},
          {type:"p", text:"Челюсть и зубы Australopithecus afarensis были значительно массивнее и толще современных. У него было три больших моляра с толстой эмалью. Ископаемые черепа этих древних людей также свидетельствуют о наличии мощной жевательной мускулатуры."},
          {type:"p", text:"Ученые полагают, что более массивные челюсти и зубы были необходимы из-за того, что пищу, которую ели предки человека, вроде сырого мяса и растений, было намного труднее пережевывать, чем современную."},
          {type:"h", text:"Смена рациона питания"},
          {type:"p", text:"Современная пища гораздо мягче, а значит и зубам требуется меньше работы. В результате челюсти стали меньше, а лица более плоскими. Поэтому зубы мудрости уже не так важны."},
          {type:"p", text:"Сегодня примерно у 25% людей отсутствует хотя бы один зуб мудрости, то есть он вовсе не сформировался. Хотя у человека зачастую не вырастают и другие зубы, чаще всего это случается именно с зубами мудрости. Ученые точно не знают, почему так, но это может быть связано с генетикой. Есть мнение, что отсутствие зубов мудрости является преимуществом, поскольку в меньшую челюсть легче разместить меньшее количество зубов."},
          {type:"h", text:"Почему зубы мудрости иногда удаляют"},
          {type:"p", text:"Иногда, из-за нехватки места, зубы мудрости могут застрять в челюстной кости и не полностью прорезаться. Как правило, так происходит в нижней челюсти. Если зубы мудрости частично видны, некоторые люди могут жаловаться на боль, кариес или воспаление десен, из-за чего эти зубы удаляют."},
          {type:"p", text:"Но если они полностью прорезались, правильно расположены и здоровы, этого обычно не требуется. Пусть растут. Главное — не забывать чистить."}
        ],
        glossary:[
          {term:"Комплект", uz:"to'plam", def:"Набор предметов, составляющих целое.", ex:"Зубы мудрости — это третий комплект моляров.", forms:["комплект"]},
          {term:"Напоминать (что)", uz:"o'xshamoq", def:"Быть похожим на что-то.", ex:"По форме они напоминают первые моляры.", forms:["напоминают"]},
          {term:"Прорезаться", uz:"chiqmoq (tish haqida)", def:"О зубе: появиться наружу через десну.", ex:"Зуб может не полностью прорезаться.", forms:["прорезаться","прорезались"]},
          {term:"Застрять", uz:"tiqilib qolmoq", def:"Остановиться и не мочь двигаться дальше.", ex:"Зубы могут застрять в челюстной кости.", forms:["застрять","застряла"]},
          {term:"Из-за нехватки (чего)", uz:"yetishmovchiligi sababli", def:"По причине недостатка чего-либо.", ex:"Из-за нехватки места зуб не прорезается.", forms:["из-за нехватки"]},

          {term:"Воспаление", uz:"yallig'lanish", def:"Болезненная реакция ткани на повреждение.", ex:"Некоторые жалуются на воспаление дёсен.", forms:["воспаление"]},
          {term:"Полагать", uz:"taxmin qilmoq / hisoblamoq", def:"Считать, думать (книжный стиль).", ex:"Учёные полагают, что челюсти были больше.", forms:["полагают"]},
          {term:"Свидетельствовать (о чём)", uz:"dalolat bermoq", def:"Служить доказательством чего-либо.", ex:"Черепа свидетельствуют о мощной мускулатуре.", forms:["свидетельствуют"]},
          {term:"Массивный", uz:"yirik / og'ir", def:"Крупный, тяжёлый, плотный.", ex:"Челюсти были значительно массивнее.", forms:["массивнее"]},
          {term:"Пережёвывать", uz:"chaynamoq", def:"Тщательно измельчать пищу зубами.", ex:"Сырое мясо труднее пережёвывать.", forms:["пережевывать"]},
          {term:"Свидетельствовать о наличии (чего)", uz:"mavjudligidan dalolat bermoq", def:"Показывать, что что-то существует.", ex:"Черепа свидетельствуют о наличии мощной мускулатуры.", forms:["о наличии"]},
          {term:"Отсутствовать", uz:"bo'lmaslik / yo'q bo'lmoq", def:"Не иметься, не быть в наличии.", ex:"У 25% людей отсутствует зуб мудрости.", forms:["отсутствует"]},
          {term:"Сформироваться", uz:"shakllanmoq", def:"Полностью развиться, образоваться.", ex:"Зуб вовсе не сформировался.", forms:["сформировался"]},
          {term:"Зачастую", uz:"ko'pincha", def:"Часто, во многих случаях (книжн.).", ex:"У человека зачастую не вырастают и другие зубы.", forms:["зачастую"]},
          {term:"Быть связанным (с чем)", uz:"bog'liq bo'lmoq", def:"Иметь отношение к чему-либо.", ex:"Это может быть связано с генетикой.", forms:["связано"]},
          {term:"Преимущество", uz:"ustunlik", def:"Выгода, плюс по сравнению с другим.", ex:"Отсутствие зубов мудрости является преимуществом.", forms:["преимуществом"]},
          {term:"Как правило", uz:"odatda / qoida tariqasida", def:"Обычно, в большинстве случаев.", ex:"Как правило, так происходит в нижней челюсти.", forms:["как правило"]},
          {term:"Удалять", uz:"olib tashlamoq", def:"Убирать, вырезать (о зубе, органе).", ex:"Эти зубы удаляют из-за боли.", forms:["удаляют","удалить"]}

      {
        id:"malenkie-sobaki-agressivnee",
        isNew:true,
        title:"Почему маленькие собаки кажутся агрессивнее больших?",
        subtitle:"Вряд ли кто-то наденет тесное розовое трико на стаффа или украсит немецкую овчарку заколками для волос. Может быть, дело в этом?",
        author:{name:"Дмитрий Терихов", role:"кинолог, специалист по поведению собак"},
        blocks:[
          {type:"p", text:"Стереотип о задиристой маленькой собачке так стар, что даже вошел в русскую классику: у Крылова на слона лает именно Моська, а не какой-нибудь Полкан или Барбос. Действительно ли представители мелких пород более агрессивны, чем большие псы?"},
          {type:"p", text:"Оказывается, маленькие, весящие до 9 кг, собачки на самом деле пугливее и эмоциональнее своих крупных сородичей. К такому выводу пришли ученые из Венского университета ветеринарной медицины. Они опросили примерно 1500 владельцев псов и проанализировали ответы. Выяснилось, что маленькие собаки более тревожны по сравнению с крупными собратьями и намного яростнее защищают свою миску или подстилку."},
          {type:"p", text:"Многие считают, что любая небольшая собака выводилась как комнатная, то есть она по умолчанию доброжелательная и спокойная. Поэтому ярость с ее стороны производит большое впечатление. Хотя далеко не каждый небольшой пес — милый ласковый компаньон. Такса — охотник на зверя в норе, поэтому у представителей этой породы быстрая реакция и вспыльчивый характер."},
          {type:"p", text:"Кроме этого, человек по-разному воспринимает поведение маленьких и больших собак. Последних мы больше боимся и потому более внимательно за ними следим, чтобы успеть себя защитить. Например, если человек заметит, что кавказская овчарка подняла уши, хвост или шерсть на загривке, то он отойдет на безопасное расстояние до того, как животное начнет проявлять открытую агрессию: рычать и бросаться."},
          {type:"q", text:"«Вряд ли кто-то наденет тесное розовое трико на стаффа или украсит немецкую овчарку заколками для волос», — отмечает кинолог."},
          {type:"p", text:"Маленький же песик, согласно известной поговорке, до старости кажется щенком. Он не ассоциируется с опасностью. Поэтому первые сигналы того, что «моська» чем-то недовольна, прохожие пропускают. Зато заливистый лай испуганного тойтерьера или померанского шпица сразу привлекает внимание."},
          {type:"p", text:"Срабатывает и эффект неожиданности. Хотя далеко не каждый небольшой пес — милый ласковый компаньон. Цвергшнауцер, самый маленький из шнауцеров, — прирожденный крысолов, а к этому умению прилагается повышенный уровень агрессии. Даже забавный тойпудель, похожий на вязаную крючком игрушку, может показать зубки. Что уж говорить об ягдтерьере, способном обратить в бегство медведя!"},
          {type:"p", text:"А ученые из Хельсинки, опубликовавшие свои исследования в Scientific Reports, заявили открытым текстом: да, маленькие собаки более агрессивны, чем средние и крупные. Крошечные чихуахуа обошли по этому показателю золотистых ретриверов и лабрадоров! Недавно ученые объявили, что обнаружили в крошечных чихуахуа гены волка."},
          {type:"p", text:"Самыми кусачими из всех псов оказались представители небольших пород — таксы, джек-рассел-терьеры и чихуахуа. Ученые из Центра взаимодействия животных и общества при Школе ветеринарной медицины Пенсильванского университета считают, что маленькие собаки чаще проявляют агрессию, поскольку чувствуют себя в опасности чаще, нежели их крупные родственники. Вот и приходится четвероногим «карликам» действовать по принципу «Лучшая защита — это нападение!»."},
          {type:"p", text:"По мнению зоологов из Пенсильвании, в агрессивном поведении маленькой собачки иногда бывает виноват недостаток воспитания. Если владельцы крупных псов обычно учат своих питомцев себя вести, то любители мелких пород не всегда этим озадачиваются. Напрасно! Тревожным от природы маленьким собачкам необходимо уметь себя контролировать."},
          {type:"p", text:"Можно сказать и о другой ошибке хозяев тойтерьеров, шпицев и прочих «малышей». Их часто воспринимают как живой аксессуар. Особенно не везет йоркширским терьерам. Замысловатые прически и неудобные, но стильные костюмчики причиняют собакам дискомфорт. И естественной реакцией на него будет нервозность."},
          {type:"p", text:"Подводя итог: представители мелких пород действительно более склонны к агрессии, чем представители крупных. Поэтому нужно быть очень внимательным при выборе питомца и готовиться к тому, что заниматься с маленькой собакой придется так же серьезно, как и с большой."}
        ],

          {term:"Сородич", uz:"qarindosh jonzot", def:"Животное того же вида.", ex:"Они пугливее своих крупных сородичей.", forms:["сородичей"]},

          {term:"Вспыльчивый", uz:"jahldor", def:"Быстро выходящий из себя.", ex:"У таксы вспыльчивый характер.", forms:["вспыльчивый"]},
          {term:"Воспринимать", uz:"qabul qilmoq / idrok etmoq", def:"Понимать и оценивать по-своему.", ex:"Человек по-разному воспринимает поведение собак.", forms:["воспринимает","воспринимают"]},
          {term:"Загривок", uz:"ensa (hayvonda)", def:"Задняя часть шеи у животного.", ex:"Овчарка подняла шерсть на загривке.", forms:["загривке"]},
          {term:"Проявлять агрессию", uz:"tajovuz ko'rsatmoq", def:"Открыто вести себя враждебно.", ex:"Животное начинает проявлять открытую агрессию.", forms:["проявлять открытую агрессию","проявляют агрессию"]},
          {term:"Рычать", uz:"irillamoq", def:"Издавать низкий угрожающий звук.", ex:"Собака начинает рычать и бросаться.", forms:["рычать"]},

          {term:"Эффект неожиданности", uz:"kutilmaganlik ta'siri", def:"Сильная реакция из-за внезапности.", ex:"Срабатывает и эффект неожиданности.", forms:["эффект неожиданности"]},
          {term:"Прирождённый", uz:"tug'ma", def:"Обладающий способностью от природы.", ex:"Цвергшнауцер — прирождённый крысолов.", forms:["прирождённый","прирожденный"]},

      {
        id:"kofe-bodrit-ne-vseh",
        isNew:true,
        title:"Почему кофе бодрит не всех?",
        subtitle:"В кофе содержится не только кофеин, но и теобромин. Поэтому напиток действует на человека не так однозначно, как многие думают. Особенно, если кофе растворимый.",
        author:{name:"Маргарита Аристархова", role:"врач, кандидат медицинских наук"},
        blocks:[
          {type:"p", text:"Большинство людей начинает утро с чашечки этого ароматного напитка, чтобы взбодриться. Но есть те, кто заканчивает ей вечер, чтобы снять накопившееся за день напряжение и быстрее заснуть. Такой двоякий эффект оказывается потому, что в составе кофе находятся два алкалоида: бодрящий кофеин и теобромин, который обладает успокаивающим и усыпляющим действием. Обычно кофеина больше, но в растворимом кофе эти алкалоиды содержатся примерно в равной пропорции. А чаще всего люди пьют именно его."},
          {type:"p", text:"Отсюда «эффект 30-го километра», который прежде всего касается дальнобойщиков и тех, кто едет на дальнее расстояние. Ученые выявили, что максимальное количество аварий происходит в промежутке от 30 до 50 км от места последней стоянки. И тому есть объяснение. Перед отправлением в рейс водитель выпивает чашку растворимого кофе (а то и несколько) и берет с собой термос с этим напитком. Поначалу чувствует себя бодро, так как на организм влияет кофеин, но уже через 25 минут в действие вступает теобромин, который начинает усыплять. За это время водитель в среднем успевает проехать от 30 до 50 км. В современных фурах кабины удобные, поэтому человека укачивает независимо от того, выспался он или нет. Концентрация внимания снижается, можно даже заснуть за рулем."},
          {type:"q", text:"«Максимальное количество аварий происходит в промежутке от 30 до 50 км от места последней стоянки»"},
          {type:"p", text:"Еще одна причина неодинаковой реакции людей на кофе связана с работой мозга. На большинство из нас кофеин действует как блокатор рецепторов, тормозящих нервную систему. Поэтому, выпив чашечку кофе, мы «разгоняем» свою нервную систему, запуская механизм ее стимуляции. Но у некоторых людей (и это обусловлено генетически) рецепторы, ответственные за восприятие кофеина, перестают работать. И тогда человек ощущает сонливость. Решив, что, возможно, напиток был недостаточно крепок, выпивает еще одну чашку и окончательно засыпает."},
          {type:"p", text:"Многое зависит от самого напитка. Так, взбодриться с помощью латте, капучино или глясе не удастся, потому что кофеин скрепляется с молекулами белка, а это сильно снижает скорость его усвоения. В результате в кровь он поступает медленно, в незначительном объеме и не оказывает на нервную систему возбуждающего воздействия. А теплый жирный напиток, каким является кофе с молоком, еще и усыпляет."},
          {type:"p", text:"В полной мере почувствовать бодрящий эффект кофеина не смогут и те, кто пьет много воды. В их организмах циркулирует большое количество крови, в результате чего концентрация кофеина ниже, чем у тех, кто пьет мало жидкости."},
          {type:"p", text:"Если же употреблять кофе в сочетании со свежевыжатым грейпфрутовым соком, действие кофеина будет сильнее. Вещества, содержащиеся в цитрусовых, блокируют определенные печеночные ферменты. В итоге усвоению кофеина ничто не препятствует и он сильнее воздействует на мозг и нервную систему."},
          {type:"p", text:"Таким образом, на каждого кофе оказывает свой эффект — и каким он будет, можно понять только на практике."}
        ],

      {
        id:"tsvety-schastlivee",
        isNew:true,
        title:"Почему цветы делают нас счастливее",
        subtitle:"Они влияют на женщин и мужчин одинаково или нет? Объясняем.",
        blocks:[
          {type:"p", text:"В наши дни цветы все чаще оказываются в вазе, поднимая настроение одним своим видом. Исследователи из Колледжа сельскохозяйственных наук Университета Джорджии решили выяснить, почему так происходит и что на самом деле мы получаем от букетов. Команда ученых опросила больше 8500 человек по всей стране и оказалось, что люди все чаще покупают цветы не для праздников, а просто так."},
          {type:"h", text:"Какие цветы покупают чаще всего"},
          {type:"p", text:"Если спросить, какой цветок самый популярный в мире, ответ очевиден. Это роза. Биологи считают, что она живет на планете уже более 25 млн лет, а люди начали выращивать ее в садах свыше 5000 лет. На долю роз приходится больше 30% всех продаваемых срезанных цветов в мире. Существует более 150 видов и тысячи сортов, от нежных миниатюр до крупных чайно-гибридных кустов."},
          {type:"p", text:"И дело не только в красоте. Культурное значение розы сложилось за тысячелетия: древние греки посвящали ее богине любви Афродите, а средневековая Англия выбрала алую и белую розы символами враждующих королевских домов в знаменитой войне."},
          {type:"p", text:"В России розы прочно занимают первое место, захватывая 49% всего цветочного рынка. Это почти 2 млрд штук в год. На втором месте с большим отрывом расположились хризантемы (14% рынка), а замыкают тройку гвоздики (11%)."},
          {type:"p", text:"Однако мировые тренды меняются. Аналитики, изучившие данные поисковых запросов, предсказывают, что в ближайшие годы популярность пионов продолжит стремительно расти. Их глобальный онлайн-поиск вырос на 175% за последние два года. Следом идут тюльпаны (рост интереса на 127%), чья родина, кстати, не Голландия, а горы Центральной Азии. На третьем месте с показателем 123% оказались львиный зев, который особенно любят в крупнейших городах вроде Нью-Йорка, Лондона и Берлина."},
          {type:"h", text:"Как на нас влияют цветы"},
          {type:"p", text:"Оказывается, у любви к цветам есть научное обоснование. Японские нейробиологи провели эксперимент: они давали добровольцам смотреть на цветы и изображения змей, замеряя при этом активность мозга. Результат поразил самих ученых. При взгляде на цветы у человека на 3,4% понижалось кровяное давление, а уровень гормона стресса падал на 21%."},
          {type:"p", text:"Более того, в мозге снижалась активность двух центров — миндалевидного тела (оно отвечает за страх и негативные эмоции) и гиппокампа (он хранит неприятные воспоминания). Простыми словами, цветы буквально помогают забыть о плохом и успокоиться. Это эволюционный механизм: наши предки инстинктивно искали места с растительностью, где была вода и еда, и древние участки мозга до сих пор дают нам сигнал о том, что здесь безопасно."},
          {type:"p", text:"Ученые из Университета Рутгерса в Нью-Джерси провели десятимесячное исследование и доказали, что регулярное присутствие цветов в доме вызывает стойкое чувство благодарности, радости и повышает удовлетворенность жизнью в целом."},
          {type:"h", text:"Правда ли, что цветы влияют только на женщин"},
          {type:"p", text:"Психолог Дженнет Хэвиленд-Джонс из того же Университета Рутгерса провела несколько исследований и доказала: цветы влияют на эмоции, настроение, социальное поведение и даже память как для мужчин, так и для женщин."},
          {type:"p", text:"В одном из экспериментов участники обоих полов при виде цветов начинали чаще улыбаться и охотнее общаться с окружающими. Правда, ученые заметили интересную деталь: у женщин при этом возникала так называемая «улыбка Дюшенна» — искренняя, непроизвольная, которую психологи считают маркером подлинной радости. Еще один эксперимент проходил в лифте: когда незнакомец дарил цветок, и мужчины, и женщины начинали вести себя позитивнее и доброжелательнее."},
          {type:"p", text:"Крупные исследования, как правило, больше сосредоточены на женщинах, поэтому точной статистики «кто счастливее» пока не существует. Но известно, что мужчины не остаются равнодушными. В Токио офисные сотрудники — именно мужчины — смотрели на красные розы всего четыре минуты, и их настроение улучшалось. А в эксперименте с энцефалограммой у мужчин при виде цветов активизировались участки мозга, отвечающие за удовольствие."},
          {type:"p", text:"Есть и различия в восприятии. Женщины чаще ищут в цветах эмоциональную поддержку и сильнее реагируют на красоту. Мужчины больше ценят чувственное удовольствие — цвет, запах, — и часто воспринимают букет как мощный социальный сигнал для окружающих. Но главный вывод один: цветы делают счастливее всех. Просто по-своему."}
        ],

      {
        id:"verblyudy-kaktusy",
        isNew:true,
        title:"Правда ли, что верблюды едят кактусы?",
        subtitle:"Как устроено их пищеварение и чувствуют ли они боль от колючек.",
        blocks:[
          {type:"p", text:"У большинства людей при слове «верблюд» перед глазами встает картинка из детских книжек — одинокое животное посреди песчаных дюн меланхолично жует сухую колючку. С появлением коротких роликов в социальных сетях это представление только укрепилось, ведь видео, где «корабль пустыни» с хрустом и без видимых страданий заглатывает огромный зеленый кактус целиком, мгновенно становятся вирусными. На самом деле кактусы не входят в привычный рацион верблюдов, а колючая диета — лишь вынужденная мера."},
          {type:"h", text:"Что верблюды едят на самом деле"},
          {type:"p", text:"Верблюды действительно относятся к травоядным животным, но засушливая среда обитания заставила их стать абсолютно всеядными вегетарианцами. В отличие от коров или овец, которые нуждаются в сочной зеленой траве, верблюды максимально эффективно используют любую доступную флору. Они специализируются на поедании листьев жестких деревьев, коры, кустарников и грубых сухих веток."},
          {type:"p", text:"В условиях экстремальной засухи кактусы и другие суккуленты превращаются для них в бесценный источник влаги. Эти мясистые растения накапливают в себе чистую воду, помогая животным поддерживать водный баланс. Кроме того, в них много клетчатки и минералов. Однако биологи подчеркивают, что это лишь запасной вариант. В обычное время верблюды предпочтут обычную сухую траву. Но если наступает голод, эти выносливые млекопитающие могут переключиться не только на кактусы, но даже на кости и падаль."},
          {type:"h", text:"Как верблюды едят колючки и не ранят пасть"},
          {type:"p", text:"Главный секрет безопасной трапезы кроется в анатомическом устройстве ротовой полости животного. Вся внутренняя поверхность его щек и языка усыпана сотнями сосочков. Это специальные конусообразные бугорки, которые состоят из твердого кератина — того же материала, из которого состоят наши ногти."},
          {type:"p", text:"Эти сосочки направлены строго назад, в сторону пищевода. Они работают как конвейерная лента: захватывают жесткий кактус и продвигают его напрямую в глотку, не позволяя острым иглам вонзаться в мягкие ткани или застревать во рту. Кроме того, внутренние стенки пасти покрыты плотной, грубой кожистой тканью, которую практически невозможно поцарапать или проколоть."},
          {type:"h", text:"Какую роль во время еды играет слюна"},
          {type:"p", text:"В процессе эволюции организм верблюдов научился выделять чрезвычайно густую, вязкую слюну в огромных количествах. Как только кусок колючего растения попадает в рот, эта слизистая масса мгновенно и плотно обволакивает каждую иглу."},

/* ===================== state ===================== */
let state = {
  level: "beginner",
  streak: 0,
  lastActive: null,
  xp: 0,
  known: [],       // flashcard ids known
  fcIndex: {},          // per-collection card position, keyed by collection id
  dictationDone: [],
  articleLevel: null,   // CEFR level currently browsed in the Articles module
  articlesRead: [],      // article ids marked as read
  dictProgress: {},          // episodeId -> sentence index, so a lesson resumes
  activeDays: [],            // YYYY-MM-DD of days with any activity (last 30 kept)
  showKeyboard: true,        // on-screen Cyrillic keyboard in dictation
  theme: "light",            // "light" | "dark"
  preferredVoiceName: null,  // user's chosen TTS voice (browser-dependent)
  articleFontScale: 1     // reading text size multiplier (adjustable via A-/A+)
};

let openArticleId = null; // which article is currently open for reading (null = showing list)

const STORAGE_KEY = "ruscha_progress_v1";

/* Two storage backends: window.storage exists only inside Claude's artifact
   sandbox, while the published site runs on plain localStorage. Without this
   fallback nothing was being saved once the site was hosted. */
const hasArtifactStorage = typeof window !== "undefined"
  && window.storage && typeof window.storage.get === "function";

async function storageRead(){
  if(hasArtifactStorage){
    const res = await window.storage.get(STORAGE_KEY);
    return res && res.value ? res.value : null;
  }
  try{ return localStorage.getItem(STORAGE_KEY); }catch(e){ return null; }
}
async function storageWrite(value){
  if(hasArtifactStorage){ await window.storage.set(STORAGE_KEY, value); return; }
  try{ localStorage.setItem(STORAGE_KEY, value); }catch(e){}
}

async function loadState(){
  try{
    const raw = await storageRead();
    if(raw) state = Object.assign(state, JSON.parse(raw));
  }catch(e){ /* nothing saved yet, or storage unavailable */ }
  applyStreak();
  applyTheme();
  renderAll();
  renderVoicePicker();
  if('speechSynthesis' in window) speechSynthesis.getVoices();
}

async function saveState(){
  try{ await storageWrite(JSON.stringify(state)); }
  catch(e){ console.error("Saqlashda xatolik:", e); }
}

function todayStr(){ return new Date().toISOString().slice(0,10); }

function applyStreak(){
  const today = todayStr();
  if(state.lastActive === today) return;
  const y = new Date(); y.setDate(y.getDate()-1);
  const yesterday = y.toISOString().slice(0,10);
  if(state.lastActive === yesterday){ /* streak continues once activity logged today */ }
  else if(state.lastActive !== today){ /* gap: will reset on next activity */ }
}

function logActivity(points){
  const today = todayStr();
  if(!state.activeDays) state.activeDays = [];
  if(!state.activeDays.includes(today)){
    state.activeDays.push(today);
    if(state.activeDays.length > 30) state.activeDays = state.activeDays.slice(-30);
  }
  if(state.lastActive !== today){
    const y = new Date(); y.setDate(y.getDate()-1);
    const yesterday = y.toISOString().slice(0,10);
    state.streak = (state.lastActive === yesterday) ? state.streak + 1 : 1;
    state.lastActive = today;
  }
  state.xp += points;
  saveState();
  updateStatPills();
}

/* ===================== helpers ===================== */
function normalize(s){
  return s.toLowerCase().replace(/[.,!?;:"«»()]/g,"").replace(/\s+/g," ").trim();
}

function escapeHtml(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function escapeRegex(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

/* Russian is heavily inflected, so a glossary term rarely appears verbatim.
   Each entry may carry explicit `forms`; otherwise we strip a common ending to
   get a stem and allow a few trailing letters. Verified at ~95% coverage on the
   current articles with no false positives. */
const RU_ENDINGS = ["оваться","еваться","иваться","ываться","ировать","ировал",
  "овать","евать","ивать","ывать","аться","иться","еться","уться",
  "ость","ство","ение","ание","ять","ать","еть","ить","уть",
  "ый","ий","ой","ая","ое","ее","ик","ок","ец",
  "а","я","о","е","ы","и","ь","й","у","ю"];

function ruStem(word){
  let w = word.toLowerCase().replace(/ё/g,"е");
  for(const e of RU_ENDINGS){
    if(w.endsWith(e) && w.length - e.length >= 4){ w = w.slice(0, w.length - e.length); break; }
  }
  return w;
}

/* Russian texts spell ё and е interchangeably, so treat them as the same letter. */
function yoFlex(s){ return s.replace(/[её]/gi, "[её]"); }

function termPattern(entry){
  if(entry.forms && entry.forms.length){
    const alts = entry.forms.slice().sort((a,b)=>b.length-a.length)
                   .map(f => yoFlex(escapeRegex(f))).join("|");
    return new RegExp("(?<![а-яё])(" + alts + ")(?![а-яё])", "gi");
  }
  const words = entry.term.replace(/\([^)]*\)/g,"").trim().split(/\s+/).filter(Boolean);
  const parts = words.map(w => yoFlex(escapeRegex(ruStem(w))) + "[а-яё]{0,6}");
  return new RegExp("(?<![а-яё])(" + parts.join("\\s+") + ")(?![а-яё])", "gi");
}

// Wrap glossary words in the article body so they can be tapped for a definition.
function highlightVocab(text, glossary){
  let out = escapeHtml(text);
  const marks = [];
  glossary.forEach((g, gi)=>{
    const re = termPattern(g);
    let m;
    while((m = re.exec(out)) !== null){
      marks.push({start:m.index, end:m.index+m[0].length, gi});
      if(m.index === re.lastIndex) re.lastIndex++;
    }
  });
  if(!marks.length) return out;
  // keep the longest match when two overlap, then splice from the end
  marks.sort((a,b)=> a.start-b.start || (b.end-b.start)-(a.end-a.start));
  const keep = [];
  let lastEnd = -1;
  for(const mk of marks){ if(mk.start >= lastEnd){ keep.push(mk); lastEnd = mk.end; } }
  keep.sort((a,b)=> b.start-a.start);
  for(const mk of keep){
    const word = out.slice(mk.start, mk.end);
    out = out.slice(0,mk.start)
        + `<span class="vocab-hl" data-g="${mk.gi}" tabindex="0" role="button">${word}</span>`
        + out.slice(mk.end);
  }
  return out;
}

function levenshtein(a,b){
  const m=a.length, n=b.length;
  const d = Array.from({length:m+1}, (_,i)=>[i,...Array(n).fill(0)]);
  for(let j=0;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      d[i][j] = a[i-1]===b[j-1] ? d[i-1][j-1] : 1 + Math.min(d[i-1][j-1], d[i-1][j], d[i][j-1]);
    }
  }
  return d[m][n];
}

function similarityScore(a,b){
  const na = normalize(a), nb = normalize(b);
  if(na.length===0 && nb.length===0) return 100;
  const dist = levenshtein(na, nb);
  const maxLen = Math.max(na.length, nb.length, 1);
  return Math.round((1 - dist/maxLen) * 100);
}

function wordDiff(target, attempt){
  const t = normalize(target).split(" ");
  const a = normalize(attempt).split(" ");
  return t.map((w,i)=> ({word:w, ok: a[i]===w}));
}

let voicesReady = false;
if('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged = () => { voicesReady = true; renderVoicePicker(); };
}

function getRussianVoices(){
  if(!('speechSynthesis' in window)) return [];
  return speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith("ru"));
}

// Browser TTS quality depends entirely on the voices installed on the person's
// system/browser — we can't add a studio-quality voice ourselves, but we can pick
// the most natural-sounding one automatically, favouring network ("online") voices
// (e.g. Chrome's "Google русский") over the often robotic default local ones.
function getBestRussianVoice(){
  const ru = getRussianVoices();
  if(ru.length === 0) return null;
  if(state.preferredVoiceName){
    const chosen = ru.find(v => v.name === state.preferredVoiceName);
    if(chosen) return chosen;
  }
  const preferredHints = ["google", "yandex", "milena", "katya", "natural", "online"];
  for(const hint of preferredHints){
    const match = ru.find(v => v.name.toLowerCase().includes(hint));
    if(match) return match;
  }
  const online = ru.find(v => v.localService === false);
  if(online) return online;
  return ru[0];
}

function speak(text){
  if(!('speechSynthesis' in window)){ alert("Brauzeringiz ovoz chiqarishni (Text-to-Speech) qo'llab-quvvatlamaydi. Google Chrome'dan foydalanib ko'ring."); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ru-RU";
  u.rate = 0.95;
  u.pitch = 1;
  const voice = getBestRussianVoice();
  if(voice) u.voice = voice;
  speechSynthesis.speak(u);
}

function findCollection(id){
  return DATA.vocab.find(c => c.id === id) || null;
}

// Progress for one collection: how many of its words are marked known.
function collKnown(coll){
  const known = state.known.filter(k => k.startsWith(coll.id+":")).length;
  return {known, total: coll.words.length};
}

// Progress across every collection — used by the dashboard and the hero ring.
function vocabTotalKnown(){
  let known = 0, total = 0;
  DATA.vocab.forEach(c => {
    const s = collKnown(c);
    known += s.known; total += s.total;
  });
  return {known, total};
}

function shuffled(arr){
  const a = arr.slice();
  for(let i=a.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

/* Some texts arrive with grammar drills attached and some are reading-only,
   so the card says which one it is. */
function articleKind(a){
  return (a.exercises && a.exercises.length) ? "Статья + Упражнение" : "Статья";
}

function articlesTotal(){
  return CEFR_LEVELS.reduce((sum, l) => sum + DATA.articles[l.id].length, 0);
}

function readingMinutes(article){
  const words = articleWordCount(article);
  return Math.max(1, Math.round(words/100));
}

/* Looks across the saved progress and picks the single most useful thing to
   offer on return. Preference order: an unfinished dictation lesson, then the
   next unread article at the level the learner was last browsing. */
function findResumePoint(){
  // 1. a dictation lesson that was started but not finished
  if(state.dictProgress){
    for(const sr of DATA.listening){
      for(const ep of sr.episodes){
        const at = state.dictProgress[ep.id] || 0;
        const total = readySentences(ep).length;
        if(at > 0 && total && at < total && !state.dictationDone.includes(ep.id)){
          return {
            kind:"dictation", series:sr.id, episode:ep.id,
            title:ep.title, meta:sr.title,
            detail:`Jumla ${at+1} / ${total}`,
            pct: Math.round(at/total*100)
          };
        }
      }
    }
  }
  // 2. the next unread article, starting from the level last browsed
  const order = CEFR_LEVELS.map(l=>l.id);
  const start = state.articleLevel && state.articleLevel !== "all"
    ? order.indexOf(state.articleLevel) : 0;
  const rotated = order.slice(Math.max(0,start)).concat(order.slice(0, Math.max(0,start)));
  for(const lvl of rotated){
    for(const a of DATA.articles[lvl]){
      if(!state.articlesRead.includes(a.id)){
        const lab = CEFR_LEVELS.find(l=>l.id===lvl).label;
        return {
          kind:"article", level:lvl, article:a.id,
          title:a.title, meta:lab + " · " + articleKind(a),
          detail:`~${readingMinutes(a)} daqiqa · ${articleWordCount(a)} so'z`,
          pct: 0
        };
      }
    }
  }
  return null;
}

/* A learner who cannot name their weakest area has no way to direct effort.
   These figures come entirely from what is already saved, so the panel is
   honest about real activity rather than showing decorative numbers. */
function progressStats(){
  const artTotal = articlesTotal();
  const artDone  = state.articlesRead.length;

  let epTotal = 0, epDone = 0;
  DATA.listening.forEach(sr=>sr.episodes.forEach(e=>{
    if(readySentences(e).length){ epTotal++; if(state.dictationDone.includes(e.id)) epDone++; }
  }));

  const {known, total} = vocabTotalKnown();

  return [
    {key:"articles",  label:"Статья",  done:artDone, total:artTotal, unit:"matn",  view:"articles"},
    {key:"dictation", label:"Диктант", done:epDone,  total:epTotal,  unit:"dars",  view:"dictation"},
    {key:"vocab",     label:"Словарь", done:known,   total:total,    unit:"so'z",  view:"flashcards"}
  ];
}

/* Seven-day strip: which of the last seven days had any activity. */
function weekStrip(){
  const days = state.activeDays || [];
  const out = [];
  const names = ["Ya","Du","Se","Ch","Pa","Ju","Sh"];
  for(let i=6;i>=0;i--){
    const d = new Date();
    d.setDate(d.getDate()-i);
    const key = d.toISOString().slice(0,10);
    out.push({name:names[d.getDay()], on:days.includes(key), today:i===0});
  }
  return out;
}

function renderStats(){
  const rows = progressStats();
  const anyProgress = rows.some(r=>r.done > 0);
  if(!anyProgress) return "";          // nothing to report yet

  const week = weekStrip();
  return `
    <div class="stats">
      <div class="stats-bars">
        ${rows.map(r=>{
          const pct = r.total ? Math.round(r.done/r.total*100) : 0;
          return `
          <button class="stat-row" data-go="${r.view}">
            <span class="stat-name">${r.label}</span>
            <span class="stat-bar"><span style="width:${pct}%"></span></span>
            <span class="stat-num">${r.done}<span>/${r.total} ${r.unit}</span></span>
          </button>`;
        }).join("")}
      </div>
      <div class="stats-week">
        <span class="stats-week-label">Oxirgi 7 kun</span>
        <span class="week-dots">
          ${week.map(d=>`<span class="wd${d.on?' on':''}${d.today?' today':''}" title="${d.name}"><i>${d.name}</i></span>`).join("")}
        </span>
      </div>
    </div>`;
}

const MATCH_ROUND = 6;
let matchRound = 0;

function renderMatchingActivity(el, coll){
  const total = coll.words.length;
  const rounds = Math.ceil(total / MATCH_ROUND);
  if(matchRound >= rounds) matchRound = 0;
  const slice = coll.words.slice(matchRound*MATCH_ROUND, matchRound*MATCH_ROUND + MATCH_ROUND);
  const left  = shuffled(slice.map((w,i)=>({...w, key:i})));
  const right = shuffled(slice.map((w,i)=>({...w, key:i})));

  el.innerHTML = `
    ${activityHeader(coll, "matching")}
    <div class="panel">
      <p style="font-size:13.5px; color:var(--ink-soft); margin-bottom:18px;">Avval ruscha so'zni, keyin unga mos o'zbekcha ma'noni bosing.</p>
      <div class="match-grid">
        <div class="match-col" id="matchLeft">
          ${left.map(w=>`<button class="match-item" data-key="${w.key}" data-side="l">${w.ru}</button>`).join("")}
        </div>
        <div class="match-col" id="matchRight">
          ${right.map(w=>`<button class="match-item" data-key="${w.key}" data-side="r">${w.uz}</button>`).join("")}
        </div>
      </div>
      <div class="act-meta" id="matchMeta">Bo'lim ${matchRound+1} / ${rounds} · ${slice.length} juft</div>
      <div style="margin-top:14px; display:flex; gap:10px; flex-wrap:wrap;">
        <button class="btn btn-ghost btn-sm" id="matchAgain">Qayta aralashtirish</button>
        <button class="btn btn-primary btn-sm" id="matchNext" ${rounds<2?'disabled':''}>Keyingi bo'lim →</button>
      </div>
    </div>`;
  wireActivityHeader(el);

  let picked = null;
  let solved = 0;
  el.querySelectorAll(".match-item").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(btn.classList.contains("matched")) return;
      if(!picked){
        el.querySelectorAll(".match-item.picked").forEach(x=>x.classList.remove("picked"));
        picked = btn; btn.classList.add("picked"); return;
      }
      if(picked === btn){ btn.classList.remove("picked"); picked=null; return; }
      if(picked.dataset.side === btn.dataset.side){
        el.querySelectorAll(".match-item.picked").forEach(x=>x.classList.remove("picked"));
        picked = btn; btn.classList.add("picked"); return;
      }
      if(picked.dataset.key === btn.dataset.key){
        picked.classList.remove("picked"); picked.classList.add("matched");
        btn.classList.add("matched");
        picked = null; solved++;
        if(solved === slice.length){
          logActivity(4);
          document.getElementById("matchMeta").innerHTML = `<b style="color:var(--good);">✓ Bu bo'lim tugadi!</b>`;
        }
      } else {
        const wrong = picked, other = btn;
        wrong.classList.add("wrong"); other.classList.add("wrong");
        setTimeout(()=>{ wrong.classList.remove("wrong","picked"); other.classList.remove("wrong"); }, 550);
        picked = null;
      }
    });
  });
  document.getElementById("matchAgain").addEventListener("click", ()=> renderFlashcards());
  document.getElementById("matchNext").addEventListener("click", ()=>{
    matchRound = (matchRound+1) % rounds; renderFlashcards();
  });
}

/* ===================== DICTATION ===================== */
/* ===================== ДИКТАНТ (listening) =====================
   Listen-and-type. Deliberately minimal: sentence counter with arrows, a player
   scoped to the current sentence, one text box, Check and Skip. Nothing else.

   The <audio> element is created once per episode and never re-rendered, and the
   custom transport reports time relative to the current sentence, so the player
   reads 0:00 / 0:08 for that clip rather than the position in the whole file.  */
let openSeriesId = null;
let openEpisodeId = null;
let dictSentIdx = 0;
let dictTab = "type";
let dictResults = {};
let dictShellFor = null;
let dictSegEnd = null;
let dictRate = 1;

/* One playback interface over two very different backends.
   Hosted mp3 -> <audio>. YouTube -> the IFrame Player API, so the video stays on
   YouTube (nothing is re-hosted) while we still control it sentence by sentence.
   YouTube fires no timeupdate event, so its position is polled instead. */
const Media = {
  kind: null, el: null, yt: null, ready: false, poll: null,
  reset(){
    if(this.poll){ clearInterval(this.poll); this.poll = null; }
    this.kind = null; this.el = null; this.yt = null; this.ready = false;
  },
  attachAudio(el){ this.reset(); this.kind = "audio"; this.el = el; this.ready = true; },
  attachYT(player){ this.reset(); this.kind = "yt"; this.yt = player; this.ready = true; },
  isReady(){ return this.ready && (this.kind === "audio" ? !!this.el : !!(this.yt && this.yt.seekTo)); },
  getTime(){
    if(!this.isReady()) return 0;
    return this.kind === "audio" ? this.el.currentTime : (this.yt.getCurrentTime() || 0);
  },
  seek(t){
    if(!this.isReady()) return;
    if(this.kind === "audio") this.el.currentTime = t; else this.yt.seekTo(t, true);
  },
  play(){
    if(!this.isReady()) return;
    if(this.kind === "audio"){ const p = this.el.play(); if(p && p.catch) p.catch(()=>{}); }
    else this.yt.playVideo();
  },
  pause(){
    if(!this.isReady()) return;
    if(this.kind === "audio") this.el.pause(); else this.yt.pauseVideo();
  },
  paused(){
    if(!this.isReady()) return true;
    return this.kind === "audio" ? this.el.paused : this.yt.getPlayerState() !== 1;
  },
  setRate(r){
    if(!this.isReady()) return;
    if(this.kind === "audio") this.el.playbackRate = r; else this.yt.setPlaybackRate(r);
  }
};

/* Load the YouTube IFrame API once, on demand. */
let ytApiPromise = null;
function loadYouTubeAPI(){
  if(window.YT && window.YT.Player) return Promise.resolve();
  if(ytApiPromise) return ytApiPromise;
  ytApiPromise = new Promise(resolve=>{
    window.onYouTubeIframeAPIReady = ()=> resolve();
    const tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);
  });
  return ytApiPromise;
}

function findSeries(id){ return DATA.listening.find(s => s.id === id) || null; }
function findEpisode(series, id){ return series ? series.episodes.find(e => e.id === id) || null : null; }
function readySentences(ep){ return (ep.sentences || []).filter(s => s.text && s.text.trim()); }

/* Comparison is deliberately forgiving: case, punctuation, dashes, quotes and
   ё/е are all ignored, so the learner is only ever judged on the words. */
function dictNorm(w){
  return w.toLowerCase()
          .replace(/ё/g,"е")
          .replace(/[\u2018\u2019'`]/g,"")
          .replace(/[.,!?;:"«»()\[\]{}\u2014\u2013\u2012-]/g,"")
          .replace(/\s+/g,"")
          .trim();
}
/* true when the words match but only the capitalisation differs */
function caseOnlyDiff(a,b){
  if(a === b) return false;
  const strip = x => x.replace(/[\u2018\u2019'`]/g,"").replace(/[.,!?;:"«»()\[\]{}\u2014\u2013\u2012-]/g,"");
  return strip(a).toLowerCase() === strip(b).toLowerCase() && strip(a) !== strip(b);
}
/* Split into comparable words, dropping tokens that are pure punctuation — a
   standalone em dash would otherwise count as a word the learner has to type. */
function dictWords(text){
  return text.trim().split(/\s+/).filter(w => w && dictNorm(w) !== "");
}
/* Timings come from forced alignment (espeak synthesis + MFCC/DTW warping against
   the real recording), so only a small margin is needed to avoid clipping the
   first and last phoneme. */
const CLIP_PAD_IN = 0.12;
const CLIP_PAD_OUT = 0.20;
function clipStart(sent){ return Math.max(0, sent.start - CLIP_PAD_IN); }
function clipEnd(sent){ return sent.end + CLIP_PAD_OUT; }

function fmtTime(t){
  if(!isFinite(t) || t<0) t=0;
  return Math.floor(t/60)+":"+String(Math.floor(t%60)).padStart(2,"0");
}

function renderDictation(){
  const el = document.getElementById("view-dictation");
  if(openSeriesId && openEpisodeId){ renderEpisode(el); return; }
  dictShellFor = null;
  if(openSeriesId){ renderEpisodeList(el); return; }
  renderSeriesList(el);
}

/* ---------- series list ---------- */
/* Series thumbnail. Drawn as SVG rather than a bitmap: no extra files to host,
   no licensing question, a couple of hundred bytes each, and it scales sharply
   on any screen. The short label is what the eye actually recognises in a grid. */
const SERIES_TINTS = {
  red:    ["#E8503A","#C43A26","#FFF"],
  blue:   ["#2E6FD6","#1B4EA8","#FFF"],
  green:  ["#2A9D63","#1B7048","#FFF"],
  violet: ["#7A55C9","#57389B","#FFF"],
  amber:  ["#D98A1F","#A96412","#FFF"],
  teal:   ["#1F9B9B","#137272","#FFF"]
};

function tileThumb({id, label, sub, tint, alt}){
  const t = SERIES_TINTS[tint] || SERIES_TINTS.blue;
  const up = (label || "").toUpperCase();
  // shrink the type as the label grows so it always fits inside the tile
  const size = up.length > 9 ? 11 : up.length > 6 ? 13 : 16;
  return `
    <svg class="ser-thumb" viewBox="0 0 100 100" role="img" aria-label="${escapeHtml(alt || label || "")}">
      <defs>
        <linearGradient id="g-${id}" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="${t[0]}"/><stop offset="1" stop-color="${t[1]}"/>
        </linearGradient>
      </defs>
      <rect width="100" height="100" rx="14" fill="url(#g-${id})"/>
      <circle cx="82" cy="20" r="26" fill="#fff" opacity=".08"/>
      <circle cx="16" cy="86" r="18" fill="#fff" opacity=".07"/>
      <text x="50" y="${sub ? 54 : 58}" text-anchor="middle" fill="${t[2]}"
            font-family="Inter, sans-serif" font-weight="800" font-size="${size}"
