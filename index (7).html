let matchRound = 0;

function renderMatchingActivity(el, coll){
  const total = coll.words.length;
  const rounds = Math.ceil(total / MATCH_ROUND);
  if(matchRound >= rounds) matchRound = 0;
  const slice = coll.words.slice(matchRound*MATCH_ROUND, matchRound*MATCH_ROUND + MATCH_ROUND);
  const left  = shuffled(slice.map((w,i)=>({...w, key:i})));
  const right = shuffled(slice.map((w,i)=>({...w, key:i})));

  el.innerHTML = `
    ${activityHeader(coll, "matching")}
    <div class="panel">
      <p style="font-size:13.5px; color:var(--ink-soft); margin-bottom:18px;">Avval ruscha so'zni, keyin unga mos o'zbekcha ma'noni bosing.</p>
      <div class="match-grid">
        <div class="match-col" id="matchLeft">
          ${left.map(w=>`<button class="match-item" data-key="${w.key}" data-side="l">${w.ru}</button>`).join("")}
        </div>
        <div class="match-col" id="matchRight">
          ${right.map(w=>`<button class="match-item" data-key="${w.key}" data-side="r">${w.uz}</button>`).join("")}
        </div>
      </div>
      <div class="act-meta" id="matchMeta">Bo'lim ${matchRound+1} / ${rounds} · ${slice.length} juft</div>
      <div style="margin-top:14px; display:flex; gap:10px; flex-wrap:wrap;">
        <button class="btn btn-ghost btn-sm" id="matchAgain">Qayta aralashtirish</button>
        <button class="btn btn-primary btn-sm" id="matchNext" ${rounds<2?'disabled':''}>Keyingi bo'lim →</button>
      </div>
    </div>`;
  wireActivityHeader(el);

  let picked = null;
  let solved = 0;
  el.querySelectorAll(".match-item").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(btn.classList.contains("matched")) return;
      if(!picked){
        el.querySelectorAll(".match-item.picked").forEach(x=>x.classList.remove("picked"));
        picked = btn; btn.classList.add("picked"); return;
      }
      if(picked === btn){ btn.classList.remove("picked"); picked=null; return; }
      if(picked.dataset.side === btn.dataset.side){
        el.querySelectorAll(".match-item.picked").forEach(x=>x.classList.remove("picked"));
        picked = btn; btn.classList.add("picked"); return;
      }
      if(picked.dataset.key === btn.dataset.key){
        picked.classList.remove("picked"); picked.classList.add("matched");
        btn.classList.add("matched");
        picked = null; solved++;
        if(solved === slice.length){
          logActivity(4);
          document.getElementById("matchMeta").innerHTML = `<b style="color:var(--good);">✓ Bu bo'lim tugadi!</b>`;
        }
      } else {
        const wrong = picked, other = btn;
        wrong.classList.add("wrong"); other.classList.add("wrong");
        setTimeout(()=>{ wrong.classList.remove("wrong","picked"); other.classList.remove("wrong"); }, 550);
        picked = null;
      }
    });
  });
  document.getElementById("matchAgain").addEventListener("click", ()=> renderFlashcards());
  document.getElementById("matchNext").addEventListener("click", ()=>{
    matchRound = (matchRound+1) % rounds; renderFlashcards();
  });
}

/* ---------- 3. quiz ---------- */
let quizIdx = 0, quizScore = 0, quizOrder = null;

function renderQuizActivity(el, coll){
  if(!quizOrder || quizOrder.length !== coll.words.length){
    quizOrder = shuffled(coll.words.map((_,i)=>i));
    quizIdx = 0; quizScore = 0;
  }
  if(quizIdx >= quizOrder.length){
    el.innerHTML = `
      ${activityHeader(coll, "quiz")}
      <div class="panel" style="text-align:center;">
        <div style="font-family:var(--font-display); font-size:40px; font-weight:700;">${quizScore}/${quizOrder.length}</div>
        <p style="color:var(--ink-soft); margin:10px 0 20px;">Test tugadi.</p>
        <button class="btn btn-primary" id="quizRestart">Qaytadan boshlash</button>
      </div>`;
    wireActivityHeader(el);
    document.getElementById("quizRestart").addEventListener("click", ()=>{ quizOrder=null; renderFlashcards(); });
    return;
  }

  const word = coll.words[quizOrder[quizIdx]];
  const distractors = shuffled(coll.words.filter(w => w.uz !== word.uz)).slice(0,3);
  const options = shuffled([word, ...distractors]);

  el.innerHTML = `
    ${activityHeader(coll, "quiz")}
    <div class="panel">
      <div class="act-meta" style="margin-bottom:16px;">Savol ${quizIdx+1} / ${quizOrder.length} · to'g'ri: ${quizScore}</div>
      <div style="font-family:var(--font-display); font-size:32px; font-weight:700; margin-bottom:6px;">${word.stress || word.ru}</div>
      <p style="font-size:13.5px; color:var(--ink-soft); margin-bottom:18px;">Bu so'z nima degani?</p>
      <div class="trki-options" id="quizOpts">
        ${options.map((o,i)=>`<button class="trki-opt" data-ok="${o.uz===word.uz?1:0}"><span class="letter">${LETTERS[i]})</span><span>${o.uz}</span></button>`).join("")}
      </div>
    </div>`;
  wireActivityHeader(el);

  el.querySelectorAll("#quizOpts .trki-opt").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(el.querySelector("#quizOpts").dataset.done) return;
      el.querySelector("#quizOpts").dataset.done = "1";
      const ok = btn.dataset.ok === "1";
      el.querySelectorAll("#quizOpts .trki-opt").forEach(b=>{
        b.disabled = true;
        if(b.dataset.ok === "1") b.classList.add(ok && b===btn ? "picked-correct" : "reveal-correct");
      });
      if(!ok) btn.classList.add("picked-wrong"); else quizScore++;
      logActivity(1);
      setTimeout(()=>{ quizIdx++; renderFlashcards(); }, ok ? 700 : 1500);
    });
  });
}

/* ---------- 4. typing ---------- */
let typeIdx = 0, typeScore = 0, typeOrder = null;

function renderTypingActivity(el, coll){
  if(!typeOrder || typeOrder.length !== coll.words.length){
    typeOrder = shuffled(coll.words.map((_,i)=>i));
    typeIdx = 0; typeScore = 0;
  }
  if(typeIdx >= typeOrder.length){
    el.innerHTML = `
      ${activityHeader(coll, "typing")}
      <div class="panel" style="text-align:center;">
        <div style="font-family:var(--font-display); font-size:40px; font-weight:700;">${typeScore}/${typeOrder.length}</div>
        <p style="color:var(--ink-soft); margin:10px 0 20px;">Mashq tugadi.</p>
        <button class="btn btn-primary" id="typeRestart">Qaytadan boshlash</button>
      </div>`;
    wireActivityHeader(el);
    document.getElementById("typeRestart").addEventListener("click", ()=>{ typeOrder=null; renderFlashcards(); });
    return;
  }

  const word = coll.words[typeOrder[typeIdx]];
  el.innerHTML = `
    ${activityHeader(coll, "typing")}
    <div class="panel">
      <div class="act-meta" style="margin-bottom:16px;">So'z ${typeIdx+1} / ${typeOrder.length} · to'g'ri: ${typeScore}</div>
      <div style="font-size:22px; font-weight:600; margin-bottom:6px;">${word.uz}</div>
      <p style="font-size:13.5px; color:var(--ink-soft); margin-bottom:16px;">Shu so'zning ruschasini yozing (kirill alifbosida).</p>
      <input type="text" id="typeInput" placeholder="Ruscha yozing..." autocomplete="off" spellcheck="false"/>
      <div class="cyr-pad" id="cyrPad">
        ${"абвгдеёжзийклмнопрстуфхцчшщъыьэюя".split("").map(ch=>`<button data-ch="${ch}">${ch}</button>`).join("")}
        <button data-ch="BACK" class="wide">⌫</button>
      </div>
      <div style="margin-top:14px; display:flex; gap:10px; flex-wrap:wrap;">
        <button class="btn btn-primary btn-sm" id="typeCheck">Tekshirish</button>
        <button class="btn btn-ghost btn-sm" id="typeSkip">O'tkazib yuborish →</button>
      </div>
      <div class="feedback-slot"></div>
    </div>`;
  wireActivityHeader(el);

  const input = document.getElementById("typeInput");
  input.focus();
  document.getElementById("cyrPad").querySelectorAll("button").forEach(b=>{
    b.addEventListener("click", ()=>{
      if(b.dataset.ch === "BACK") input.value = input.value.slice(0,-1);
      else input.value += b.dataset.ch;
      input.focus();
    });
  });

  function check(){
    const slot = el.querySelector(".feedback-slot");
    if(slot.dataset.done) return;
    const val = input.value.trim().toLowerCase().replace(/ё/g,"е");
    const target = word.ru.toLowerCase().replace(/ё/g,"е");
    slot.dataset.done = "1";
    input.disabled = true;
    if(val === target){
      typeScore++;
      slot.innerHTML = `<div class="feedback good">✓ To'g'ri!</div>`;
      logActivity(2);
      setTimeout(()=>{ typeIdx++; renderFlashcards(); }, 800);
    } else {
      slot.innerHTML = `<div class="feedback bad">To'g'ri javob: <b>${word.stress || word.ru}</b></div>`;
      setTimeout(()=>{ typeIdx++; renderFlashcards(); }, 1900);
    }
  }
  document.getElementById("typeCheck").addEventListener("click", check);
  input.addEventListener("keydown", e=>{ if(e.key === "Enter") check(); });
  document.getElementById("typeSkip").addEventListener("click", ()=>{ typeIdx++; renderFlashcards(); });
}

/* ===================== DICTATION ===================== */
/* ===================== ДИКТАНТ (listening) =====================
   Listen-and-type. Deliberately minimal: sentence counter with arrows, a player
   scoped to the current sentence, one text box, Check and Skip. Nothing else.

   The <audio> element is created once per episode and never re-rendered, and the
   custom transport reports time relative to the current sentence, so the player
   reads 0:00 / 0:08 for that clip rather than the position in the whole file.  */
let openSeriesId = null;
let openEpisodeId = null;
let dictSentIdx = 0;
let dictTab = "type";
let dictResults = {};
let dictShellFor = null;
let dictSegEnd = null;
let dictRate = 1;

function findSeries(id){ return DATA.listening.find(s => s.id === id) || null; }
function findEpisode(series, id){ return series ? series.episodes.find(e => e.id === id) || null : null; }
function readySentences(ep){ return (ep.sentences || []).filter(s => s.text && s.text.trim()); }

function dictNorm(w){
  return w.toLowerCase().replace(/ё/g,"е").replace(/[.,!?;:"«»()\u2014\u2013-]/g,"").trim();
}
function dictWords(text){ return text.trim().split(/\s+/).filter(Boolean); }
function fmtTime(t){
  if(!isFinite(t) || t<0) t=0;
  return Math.floor(t/60)+":"+String(Math.floor(t%60)).padStart(2,"0");
}

function renderDictation(){
  const el = document.getElementById("view-dictation");
  if(openSeriesId && openEpisodeId){ renderEpisode(el); return; }
  dictShellFor = null;
  if(openSeriesId){ renderEpisodeList(el); return; }
  renderSeriesList(el);
}

/* ---------- series list ---------- */
function renderSeriesList(el){
  if(DATA.listening.length === 0){
    el.innerHTML = `
      <div class="section-title"><h2>Диктант</h2><span>bo'sh</span></div>
      <div class="panel"><p style="color:var(--ink-soft);">Hozircha audio qo'shilmagan.</p></div>`;
    return;
  }
  el.innerHTML = `
    <div class="section-title"><h2>Диктант</h2><span>${DATA.listening.length} ta bo'lim</span></div>
    <div class="module-grid">
      ${DATA.listening.map(sr=>{
        const done = sr.episodes.filter(e=>state.dictationDone.includes(e.id)).length;
        return `
        <div class="module-card" data-series="${sr.id}">
          <div class="badge-row">
            <span class="badge badge-level">${sr.levelRange || ""}</span>
            ${done===sr.episodes.length && done>0 ? '<span class="badge badge-done">✓ tugallangan</span>' : ""}
          </div>
          <h3>${sr.title}</h3>
          ${sr.description ? `<p>${sr.description}</p>` : ""}
          <div class="prog">${sr.episodes.length} ta dars · ${done} bajarilgan</div>
        </div>`;
      }).join("")}
    </div>`;
  el.querySelectorAll(".module-card").forEach(c=>{
    c.addEventListener("click", ()=>{ openSeriesId=c.dataset.series; renderDictation(); });
  });
}

/* ---------- episode list ---------- */
function renderEpisodeList(el){
  const sr = findSeries(openSeriesId);
  if(!sr){ openSeriesId=null; renderDictation(); return; }
  el.innerHTML = `
    <button class="btn btn-ghost btn-sm" id="srBack" style="margin-bottom:16px;">← Bo'limlarga qaytish</button>
    <div class="section-title">
      <h2>${sr.title} ${sr.levelRange ? `<span style="font-family:var(--font-mono); font-size:13px; color:var(--ink-faint); font-weight:500;">(${sr.levelRange})</span>` : ""}</h2>
      <span>${sr.episodes.length} ta dars</span>
    </div>
    <div class="ep-list">
      ${sr.episodes.map((e,i)=>{
        const done = state.dictationDone.includes(e.id);
        const n = readySentences(e).length;
        const at = state.dictProgress ? state.dictProgress[e.id] : 0;
        return `
        <button class="ep-row" data-ep="${e.id}">
          <span class="ep-num">${i+1}</span>
          <span class="ep-main">
            <span class="ep-title">${e.title}</span>
            <span class="ep-meta">${e.duration ? e.duration+" · " : ""}${n ? n+" ta jumla" : "matn tayyorlanmoqda"}${at && n && !done ? " · "+(at+1)+"-jumlada" : ""}</span>
          </span>
          ${done ? '<span class="badge badge-done">✓</span>' : ""}
        </button>`;
      }).join("")}
    </div>`;
  document.getElementById("srBack").addEventListener("click", ()=>{ openSeriesId=null; renderDictation(); });
  el.querySelectorAll(".ep-row").forEach(r=>{
    r.addEventListener("click", ()=>{
      openEpisodeId = r.dataset.ep;
      dictSentIdx = (state.dictProgress && state.dictProgress[openEpisodeId]) || 0;
      dictTab="type"; dictResults={}; dictShellFor=null;
      renderDictation();
    });
  });
}

/* ---------- episode shell (built once) ---------- */
function renderEpisode(el){
  const sr = findSeries(openSeriesId);
  const ep = findEpisode(sr, openEpisodeId);
  if(!ep){ openEpisodeId=null; renderDictation(); return; }
  const sents = readySentences(ep);
  const epIdx = sr.episodes.findIndex(e=>e.id===ep.id);
  const nextEp = sr.episodes[epIdx+1];

  if(dictShellFor !== ep.id || !document.getElementById("lisAudio")){
    el.innerHTML = `
      <button class="btn btn-ghost btn-sm" id="epBack" style="margin-bottom:18px;">← ${sr.title}</button>
      <h2 class="dd-title">${ep.title}
        ${sr.levelRange ? `<span class="dd-level">Уровень: ${sr.levelRange}</span>` : ""}
      </h2>
      ${sents.length ? `
        <div class="dd-tabs" id="dictTabs">
          <button data-tab="type">Диктант</button>
          <button data-tab="transcript">Полный текст</button>
          ${ep.vocab && ep.vocab.length ? `<button data-tab="vocab">Словарь</button>` : ""}
        </div>` : ""}
      <audio id="lisAudio" preload="auto" style="display:none;"></audio>
      <div id="audioWarn" class="audio-warn" style="display:none;">
        Audio fayl topilmadi. <code>${ep.audioSrc}</code> nomli fayl saytga yuklanganini tekshiring.
      </div>
      <div id="dictArea" class="dd-area"></div>
      ${nextEp ? `<div class="read-nav"><span></span><button class="btn btn-ghost btn-sm" id="nextEp">${nextEp.title} →</button></div>` : ""}`;

    dictShellFor = ep.id;
    dictSegEnd = null;

    // walk the candidate filenames until one actually loads
    (function attachAudio(){
      const a = document.getElementById("lisAudio");
      const names = [ep.audioSrc].concat(ep.audioAlts || []);
      let i = 0;
      function tryNext(){
        if(i >= names.length){
          const w = document.getElementById("audioWarn");
          if(w) w.style.display = "block";
          return;
        }
        a.src = encodeURI(names[i++]);
        a.load();
      }
      a.addEventListener("error", tryNext);
      a.addEventListener("loadedmetadata", ()=>{
        const w = document.getElementById("audioWarn");
        if(w) w.style.display = "none";
      });
      tryNext();
    })();

    document.getElementById("epBack").addEventListener("click", ()=>{
      const a=document.getElementById("lisAudio"); if(a) a.pause();
      openEpisodeId=null; dictShellFor=null; renderDictation();
    });
    const audio = document.getElementById("lisAudio");
    audio.addEventListener("timeupdate", ()=>{
      updateTransport();
      if(dictSegEnd !== null && audio.currentTime >= dictSegEnd){
        audio.pause(); dictSegEnd = null; updateTransport();
      }
    });
    audio.addEventListener("play",  updateTransport);
    audio.addEventListener("pause", updateTransport);

    const tabs = document.getElementById("dictTabs");
    if(tabs) tabs.querySelectorAll("button").forEach(b=>{
      b.addEventListener("click", ()=>{ dictTab=b.dataset.tab; paintDictArea(ep, sents); });
    });
    if(nextEp) document.getElementById("nextEp").addEventListener("click", ()=>{
      audio.pause();
      openEpisodeId=nextEp.id; dictSentIdx=0; dictTab="type";
      dictResults={}; dictShellFor=null; renderDictation();
    });
  }
  paintDictArea(ep, sents);
}

/* transport readout is sentence-relative */
function updateTransport(){
  const audio = document.getElementById("lisAudio");
  const bar = document.getElementById("ddFill");
  const cur = document.getElementById("ddCur");
  const btn = document.getElementById("ddPlay");
  if(!audio || !bar || !cur) return;
  const s = window.__ddSent;
  if(!s) return;
  const len = Math.max(0.1, s.end - s.start);
  const at  = Math.min(len, Math.max(0, audio.currentTime - s.start));
  bar.style.width = (at/len*100)+"%";
  cur.textContent = fmtTime(at);
  if(btn) btn.textContent = audio.paused ? "▶" : "❚❚";
}

/* ---------- area ---------- */
function paintDictArea(ep, sents){
  const area = document.getElementById("dictArea");
  const tabs = document.getElementById("dictTabs");
  if(tabs) tabs.querySelectorAll("button").forEach(b=>b.classList.toggle("active", b.dataset.tab===dictTab));

  if(!sents.length){
    area.innerHTML = `<p style="color:var(--ink-soft); line-height:1.6;">Bu dars uchun matn hali kiritilmagan.</p>`;
    return;
  }
  if(dictTab === "transcript"){
    area.innerHTML = `
      ${ep.quiz ? `<div class="ep-quiz-note"><b>Вопрос выпуска:</b> ${ep.quiz.stem}</div>` : ""}
      <div style="font-family:var(--font-read); font-size:16px; line-height:1.85;">
        ${sents.map((x,i)=>`<p style="margin-bottom:10px;"><span class="tr-n">${i+1}</span>${x.text}</p>`).join("")}
      </div>`;
    return;
  }
  if(dictTab === "vocab"){
    area.innerHTML = (ep.vocab||[]).map(v=>`
      <div class="ep-vocab">
        <div class="ep-vocab-term">${v.term}</div>
        <div class="ep-vocab-def">${v.def}</div>
        <div class="ep-vocab-ex">${v.ex}</div>
      </div>`).join("");
    return;
  }
  if(dictSentIdx >= sents.length){ paintResults(area, ep, sents); return; }
  paintSentence(area, ep, sents);
}

/* ---------- one sentence ---------- */
function paintSentence(area, ep, sents){
  const idx = dictSentIdx;
  const sent = sents[idx];
  window.__ddSent = sent;
  const target = dictWords(sent.text);
  const len = Math.max(0.1, sent.end - sent.start);
  const canRec = !!(window.SpeechRecognition || window.webkitSpeechRecognition);

  area.innerHTML = `
    <div class="dd-nav">
      <button id="ddPrev" ${idx===0?"disabled":""} aria-label="Oldingi">←</button>
      <span>${idx+1} / ${sents.length}</span>
      <button id="ddNext" ${idx>=sents.length-1?"disabled":""} aria-label="Keyingi">→</button>
    </div>

    <div class="dd-player">
      <button id="ddPlay" aria-label="Tinglash">▶</button>
      <span class="dd-time"><span id="ddCur">0:00</span> / ${fmtTime(len)}</span>
      <div class="dd-track" id="ddTrack"><span id="ddFill"></span></div>
      <select id="ddRate" aria-label="Tezlik">
        <option value="0.6">0.6x</option>
        <option value="0.8">0.8x</option>
        <option value="1" selected>1x</option>
        <option value="1.25">1.25x</option>
      </select>
    </div>

    <div class="dd-inputwrap">
      <textarea id="dictIn" rows="3" placeholder="Eshitganingizni yozing..." autocomplete="off" spellcheck="false"></textarea>
      ${canRec ? `<button class="dd-mic" id="ddMic" aria-label="Ovoz bilan yozish">🎤</button>` : ""}
    </div>

    <div class="dd-buttons">
      <button class="btn btn-primary btn-sm" id="dictCheck">Tekshirish</button>
      <button class="btn btn-ghost btn-sm" id="dictSkip">O'tkazish</button>
    </div>
    <div class="feedback-slot" id="dictSlot"></div>`;

  const audio = document.getElementById("lisAudio");
  const input = document.getElementById("dictIn");
  const slot  = document.getElementById("dictSlot");
  const rateSel = document.getElementById("ddRate");
  rateSel.value = String(dictRate);
  audio.playbackRate = dictRate;

  function playFromStart(){
    audio.currentTime = sent.start;
    dictSegEnd = sent.end;
    const p = audio.play();
    if(p && p.catch) p.catch(()=>{});
  }
  function toggle(){
    if(audio.paused){
      if(audio.currentTime < sent.start || audio.currentTime >= sent.end) audio.currentTime = sent.start;
      dictSegEnd = sent.end;
      const p = audio.play(); if(p && p.catch) p.catch(()=>{});
    } else audio.pause();
  }
  playFromStart();
  updateTransport();
  input.focus();

  document.getElementById("ddPlay").addEventListener("click", toggle);
  rateSel.addEventListener("change", ()=>{
    dictRate = parseFloat(rateSel.value);
    audio.playbackRate = dictRate;
    input.focus();
  });
  document.getElementById("ddTrack").addEventListener("click", e=>{
    const r = e.currentTarget.getBoundingClientRect();
    audio.currentTime = sent.start + ((e.clientX - r.left)/r.width) * len;
    dictSegEnd = sent.end;
    updateTransport();
  });

  function go(i){
    audio.pause();
    dictSentIdx = Math.max(0, Math.min(sents.length, i));
    if(!state.dictProgress) state.dictProgress = {};
    state.dictProgress[ep.id] = dictSentIdx;
    saveState();
    paintDictArea(ep, sents);
  }
  document.getElementById("ddPrev").addEventListener("click", ()=>go(idx-1));
  document.getElementById("ddNext").addEventListener("click", ()=>go(idx+1));

  const mic = document.getElementById("ddMic");
  if(mic) mic.addEventListener("click", ()=>{
    const R = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!R) return;
    const rec = new R();
    rec.lang = "ru-RU"; rec.interimResults = false; rec.maxAlternatives = 1;
    mic.classList.add("rec");
    rec.onresult = e=>{ input.value = (input.value ? input.value+" " : "") + e.results[0][0].transcript; input.focus(); };
    rec.onend = ()=> mic.classList.remove("rec");
    rec.onerror = ()=> mic.classList.remove("rec");
    try{ rec.start(); }catch(err){ mic.classList.remove("rec"); }
  });

  function check(){
    if(slot.dataset.done) return;
    const typed = dictWords(input.value);
    const marks = target.map((w,i)=> typed[i] !== undefined && dictNorm(typed[i]) === dictNorm(w));
    const allOk = marks.every(Boolean) && typed.length === target.length;
    if(allOk){
      slot.dataset.done = "1";
      dictResults[idx] = dictResults[idx] || "ok";
      slot.innerHTML = `<div class="feedback good">✓ ${sent.text}</div>`;
      setTimeout(()=>go(idx+1), 900);
    } else {
      const diff = target.map((w,i)=>
        marks[i] ? `<span class="word-chip ok">${w}</span>`
                 : (typed[i] === undefined ? `<span class="word-chip miss">?</span>`
                                           : `<span class="word-chip no">${typed[i]}</span>`)).join("");
      slot.innerHTML = `<div class="feedback bad">${marks.filter(Boolean).length}/${target.length} — yana urinib ko'ring<br>${diff}</div>`;
      input.focus();
    }
  }
  document.getElementById("dictCheck").addEventListener("click", check);
  document.getElementById("dictSkip").addEventListener("click", ()=>{
    slot.dataset.done = "1";
    dictResults[idx] = dictResults[idx] || "skip";
    slot.innerHTML = `<div class="feedback bad">${sent.text}</div>`;
    setTimeout(()=>go(idx+1), 1500);
  });
  input.addEventListener("keydown", e=>{
    if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); check(); }
    if(e.key === "Tab"){ e.preventDefault(); playFromStart(); }
  });
}

/* ---------- results ---------- */
function paintResults(area, ep, sents){
  const vals = Object.values(dictResults);
  const clean = vals.filter(v=>v==="ok").length;
  const pct = Math.round(clean / sents.length * 100);
  area.innerHTML = `
    <div style="text-align:center; padding:16px 0 6px;">
      <div style="font-family:var(--font-display); font-size:44px; font-weight:700; line-height:1;">${pct}%</div>
      <p style="color:var(--ink-soft); margin:10px 0 20px;">${clean} / ${sents.length} jumla mustaqil yozildi</p>
      <div class="dd-buttons" style="justify-content:center;">
        <button class="btn btn-primary btn-sm" id="dictRestart">Qaytadan</button>
        <button class="btn btn-ghost btn-sm" id="dictShowText">Matnni ko'rish</button>
      </div>
    </div>`;
  if(!state.dictationDone.includes(ep.id)){ state.dictationDone.push(ep.id); logActivity(10); }
  if(!state.dictProgress) state.dictProgress = {};
  state.dictProgress[ep.id] = 0;
  saveState();
  document.getElementById("dictRestart").addEventListener("click", ()=>{
    dictSentIdx=0; dictResults={}; paintDictArea(ep, sents);
  });
  document.getElementById("dictShowText").addEventListener("click", ()=>{
    dictTab="transcript"; paintDictArea(ep, sents);
  });
}

/* ===================== ARTICLES (CEFR-based) ===================== */
function articleWordCount(article){
  return article.blocks.filter(b=>b.type==="p"||b.type==="q").reduce((sum,b)=> sum + b.text.trim().split(/\s+/).length, 0);
}

function findArticle(id){
  for(const lvl of CEFR_LEVELS){
    const found = DATA.articles[lvl.id].find(a=>a.id===id);
    if(found) return {article:found, level:lvl.id};
  }
  return null;
}

function renderArticles(){
  // pick a sensible default CEFR level the first time: the first level that actually has content
  if(!state.articleLevel){
    const withContent = CEFR_LEVELS.find(l => DATA.articles[l.id].length>0);
    state.articleLevel = withContent ? withContent.id : "all";
  }

  const el = document.getElementById("view-articles");

  if(openArticleId){
    renderArticleDetail(el, openArticleId);
    return;
  }

  const lvl = state.articleLevel;
  const list = lvl==="all"
    ? CEFR_LEVELS.flatMap(l => DATA.articles[l.id].map(a => ({...a, _level:l.id})))
    : DATA.articles[lvl].map(a => ({...a, _level:lvl}));

  el.innerHTML = `
    <div class="section-title"><h2>Статья</h2><span>${state.articlesRead.length}/${articlesTotal()} o'qilgan</span></div>
    <div class="level-switch" id="cefrSwitch" style="margin-bottom:22px; width:fit-content; flex-wrap:wrap;"></div>
    <div id="artGrid" class="module-grid"></div>
  `;

  const cefrEl = document.getElementById("cefrSwitch");
  const tabs = [{id:"all", label:"Barchasi"}, ...CEFR_LEVELS];
  cefrEl.innerHTML = tabs.map(l => {
    const count = l.id==="all" ? articlesTotal() : DATA.articles[l.id].length;
    return `<button class="${l.id===lvl?'active':''}" data-cefr="${l.id}">${l.label}<span class="cefr-pill-count">${count}</span></button>`;
  }).join("");
  cefrEl.querySelectorAll("button").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.articleLevel = btn.dataset.cefr;
      saveState();
      renderArticles();
    });
  });

  const grid = document.getElementById("artGrid");
  if(list.length===0){
    grid.innerHTML = `<div class="panel" style="grid-column:1/-1;"><p style="color:var(--ink-soft);">Bu darajada hozircha maqola yo'q. Tez orada qo'shiladi — boshqa darajani tanlab ko'ring.</p></div>`;
    return;
  }
  grid.innerHTML = list.map(a => {
    const read = state.articlesRead.includes(a.id);
    const mins = readingMinutes(a);
    return `
      <div class="module-card" data-art="${a.id}">
        <div class="badge-row">
          <span class="badge badge-level">${CEFR_LEVELS.find(l=>l.id===a._level).label}</span>
          ${a.isNew ? '<span class="badge badge-new">YANGI</span>' : ""}
          ${read ? '<span class="badge badge-done">✓ o\'qilgan</span>' : ""}
        </div>
        <h3>${a.title}</h3>
        <p>${a.subtitle ? a.subtitle : ""}</p>
        <div class="prog">📖 ~${mins} daqiqa · ${articleWordCount(a)} so'z</div>
      </div>`;
  }).join("");
  grid.querySelectorAll(".module-card").forEach(card=>{
    card.addEventListener("click", ()=>{
      openArticleId = card.dataset.art;
      renderArticles();
    });
  });
}

const LETTERS = ["А","Б","В","Г","Д"];

function renderArticleDetail(el, articleId){
  const found = findArticle(articleId);
  if(!found){ openArticleId = null; renderArticles(); return; }
  const {article, level} = found;
  const read = state.articlesRead.includes(article.id);
  const fullText = article.blocks.filter(b=>b.type==="p"||b.type==="q").map(b=>b.text).join(" ");
  const mins = readingMinutes(article);

  const siblings = DATA.articles[level];
  const idx = siblings.findIndex(a=>a.id===article.id);
  const prevArt = siblings[idx-1];
  const nextArt = siblings[idx+1];

  el.innerHTML = `
    <button class="btn btn-ghost btn-sm" id="artBack" style="margin-bottom:16px;">← Ro'yxatga qaytish</button>
    <div class="panel">
      <div class="badge-row">
        <span class="badge badge-level">${CEFR_LEVELS.find(l=>l.id===level).label}</span>
        <span class="badge badge-time">📖 ~${mins} daqiqa · ${articleWordCount(article)} so'z</span>
      </div>
      <div class="ex-head">
        <h3 style="font-family:var(--font-read); font-size:27px; font-weight:700; line-height:1.25; letter-spacing:-.01em; max-width:640px;">${article.title}</h3>
        <div style="display:flex; gap:8px; align-items:center;">
          <div class="font-ctrl">
            <button id="fontMinus" title="Matnni kichraytirish">A-</button>
            <button id="fontPlus" title="Matnni kattalashtirish">A+</button>
          </div>
          <button class="btn btn-ghost btn-sm" id="artSpeak">🔊 Tinglash</button>
        </div>
      </div>
      ${article.subtitle ? `<p style="font-family:var(--font-read); font-style:italic; color:var(--ink-soft); font-size:16px; line-height:1.5; margin-bottom:20px; max-width:640px;">${article.subtitle}</p>` : ""}
      ${article.author ? `<div class="article-byline"><b>${article.author.name}</b><span>${article.author.role}</span></div>` : ""}
      <div id="artBody" style="--article-fs:${16.5*state.articleFontScale}px;">
        ${article.blocks.map(b => {
          if(b.type==="h") return `<h4 style="font-family:var(--font-read); font-size:19px; font-weight:700; margin:30px 0 12px; color:var(--ink);">${escapeHtml(b.text)}</h4>`;
          if(b.type==="q") return `<div class="article-quote">${highlightVocab(b.text, article.glossary)}</div>`;
          return `<p class="article-text" style="margin-bottom:14px;">${highlightVocab(b.text, article.glossary)}</p>`;
        }).join("")}
      </div>
      <p class="vocab-hint">💡 Ajratib ko'rsatilgan so'zlarni bosing — tarjimasi, izohi va misoli chiqadi.</p>
      <div class="divider-star"></div>
      <h4 style="font-size:14px; margin-bottom:4px;">Задания к тексту</h4>
      <p style="font-size:12.5px; color:var(--ink-soft); margin-bottom:16px;">Matnni o'qib chiqing. Har bir savol uchun matn mazmunini eng to'liq va aniq ifodalovchi javobni tanlang (TRKI namunasi).</p>
      <div id="trkiList">
        ${article.questions.map((q,i)=>`
          <div class="trki-item" data-idx="${i}" data-correct="${q.correct}">
            <div class="trki-stem">${i+1}. ${q.stem}</div>
            <div class="trki-options">
              ${q.options.map((opt,oi)=>`<button class="trki-opt" data-oi="${oi}"><span class="letter">${LETTERS[oi]})</span><span>${opt}</span></button>`).join("")}
            </div>
          </div>`).join("")}
      </div>
      <div class="trki-score" id="trkiScore" style="display:none;"></div>
      <div style="margin-top:16px;">
        <button class="btn ${read?'btn-primary':'btn-warm'}" id="artDone">${read ? "✓ O'qilgan" : "O'qib bo'ldim"}</button>
      </div>
      <div class="read-nav">
        <button class="btn btn-ghost btn-sm" id="prevArt" ${!prevArt?"disabled":""}>${prevArt ? "← "+prevArt.title : "← Oldingi maqola yo'q"}</button>
        <button class="btn btn-ghost btn-sm" id="nextArt" ${!nextArt?"disabled":""}>${nextArt ? nextArt.title+" →" : "Keyingi maqola yo'q →"}</button>
      </div>
    </div>
  `;

  document.getElementById("artBack").addEventListener("click", ()=>{ openArticleId = null; renderArticles(); });
  document.getElementById("artSpeak").addEventListener("click", ()=> speak(fullText));

  el.querySelectorAll(".vocab-hl").forEach(span=>{
    const open = (e)=>{
      e.stopPropagation();
      el.querySelectorAll(".vocab-hl.active").forEach(o=>o.classList.remove("active"));
      span.classList.add("active");
      showWordSheet(article.glossary[+span.dataset.g]);
    };
    span.addEventListener("click", open);
    span.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); open(e); } });
  });

  // font-size control: mutate the existing DOM in place so quiz progress isn't lost
  document.getElementById("fontMinus").addEventListener("click", ()=>{
    state.articleFontScale = Math.max(0.8, +(state.articleFontScale - 0.1).toFixed(2));
    saveState();
    document.getElementById("artBody").style.setProperty("--article-fs", (16.5*state.articleFontScale)+"px");
  });
  document.getElementById("fontPlus").addEventListener("click", ()=>{
    state.articleFontScale = Math.min(1.4, +(state.articleFontScale + 0.1).toFixed(2));
    saveState();
    document.getElementById("artBody").style.setProperty("--article-fs", (16.5*state.articleFontScale)+"px");
  });

  // TRKI-style reading comprehension: single-answer multiple choice, instant per-question feedback + running score
  function updateTrkiScore(){
    const items = el.querySelectorAll(".trki-item");
    const answered = [...items].filter(it => it.dataset.answered);
    const correct = answered.filter(it => it.querySelector(".picked-correct")).length;
    const box = document.getElementById("trkiScore");
    if(answered.length===0){ box.style.display="none"; return; }
    box.style.display = "flex";
    if(answered.length < items.length){
      box.innerHTML = `<span>Javob berildi: ${answered.length}/${items.length}</span><span>${correct} ta to'g'ri</span>`;
    } else {
      box.innerHTML = `<span>Natija tayyor! 🎉</span><span>${correct}/${items.length} to'g'ri javob</span>`;
    }
  }
  el.querySelectorAll(".trki-item").forEach(item=>{
    item.querySelectorAll(".trki-opt").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        if(item.dataset.answered) return;
        const correctIdx = item.dataset.correct;
        const pickedIdx = btn.dataset.oi;
        item.dataset.answered = "true";
        item.querySelectorAll(".trki-opt").forEach(b=>{
          b.disabled = true;
          if(b.dataset.oi === correctIdx) b.classList.add(pickedIdx===correctIdx ? "picked-correct" : "reveal-correct");
        });
        if(pickedIdx !== correctIdx) btn.classList.add("picked-wrong");
        updateTrkiScore();
      });
    });
  });

  document.getElementById("artDone").addEventListener("click", ()=>{
    if(!state.articlesRead.includes(article.id)){
      state.articlesRead.push(article.id);
      logActivity(6);
      saveState();
      renderArticleDetail(el, articleId);
    }
  });
  if(prevArt) document.getElementById("prevArt").addEventListener("click", ()=>{ openArticleId = prevArt.id; renderArticles(); });
  if(nextArt) document.getElementById("nextArt").addEventListener("click", ()=>{ openArticleId = nextArt.id; renderArticles(); });
}

/* ===================== word sheet ===================== */
let wsCurrent = null;

function showWordSheet(entry){
  if(!entry) return;
  wsCurrent = entry;
  document.getElementById("wsTerm").textContent = entry.term;
  document.getElementById("wsUz").textContent = entry.uz || "";
  document.getElementById("wsDef").textContent = entry.def || "";
  const ex = document.getElementById("wsEx");
  ex.textContent = entry.ex || "";
  ex.style.display = entry.ex ? "block" : "none";
  document.getElementById("wordSheet").classList.add("open");
}

function hideWordSheet(){
  document.getElementById("wordSheet").classList.remove("open");
  document.querySelectorAll(".vocab-hl.active").forEach(o=>o.classList.remove("active"));
  wsCurrent = null;
}

/* ===================== theme ===================== */
const ICON_SUN = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>';
const ICON_MOON = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5Z"/></svg>';

function applyTheme(){
  const dark = state.theme === "dark";
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute("content", dark ? "#10151C" : "#FFFFFF");
  const btn = document.getElementById("themeBtn");
  if(btn) btn.innerHTML = dark ? ICON_SUN : ICON_MOON;
}

function toggleTheme(){
  state.theme = state.theme === "dark" ? "light" : "dark";
  applyTheme();
  saveState();
}

/* ===================== INIT ===================== */
document.getElementById("resetBtn").addEventListener("click", resetProgress);
document.getElementById("themeBtn").addEventListener("click", toggleTheme);
document.getElementById("wsClose").addEventListener("click", hideWordSheet);
document.getElementById("wsSpeak").addEventListener("click", ()=>{ if(wsCurrent) speak(wsCurrent.ex || wsCurrent.term); });
document.addEventListener("click", e=>{
  const sheet = document.getElementById("wordSheet");
  if(sheet.classList.contains("open") && !sheet.contains(e.target) && !e.target.closest(".vocab-hl")) hideWordSheet();
});
document.addEventListener("keydown", e=>{ if(e.key === "Escape") hideWordSheet(); });
applyTheme();
loadState();
</script>
