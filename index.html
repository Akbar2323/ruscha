<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RUSCHA — Ruscha tilini o'rganish</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* White + blue. Blue carries every active, selected and primary state;
       text stays near-black (navy-tinted) so long reading passages remain easy. */
    --bg: #FFFFFF;
    --surface: #FFFFFF;
    --surface-soft: #F5F8FD;
    --ink: #0F1B2E;        /* 17.3:1 on white */
    --ink-soft: #5A6B80;   /* 5.5:1  */
    --ink-faint: #68778C;  /* 4.6:1  */
    --line: #DFE6F0;

    --accent: #2563EB;       /* white text on this = 5.2:1 */
    --accent-deep: #1D4ED8;  /* hover / pressed */
    --accent-soft: #EAF1FE;  /* tinted fills */

    /* Feedback only — colour here carries meaning, not style. */
    --good: #1B7F4B;
    --good-bg: #EDF6F0;
    --bad: #C0332E;
    --bad-bg: #FBEEED;

    --radius-lg: 6px;
    --radius-md: 5px;
    --radius-sm: 4px;

    --font-display: 'PT Serif', Georgia, serif;
    --font-body: 'Inter', -apple-system, sans-serif;
    --font-read: 'PT Serif', Georgia, serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:var(--font-display); margin:0; color:var(--ink); font-weight:700;}
  p{margin:0;}
  button{font-family:var(--font-body);}
  ::selection{background:var(--accent); color:#fff;}

  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px;}

  a{color:inherit;}

  /* ===== Layout shell ===== */
  .app-shell{
    display:grid;
    grid-template-columns: 252px 1fr;
    min-height:100vh;
  }

  /* ===== Sidebar ===== */
  .sidebar{
    background: var(--bg);
    color:var(--ink);
    padding:30px 20px;
    display:flex;
    flex-direction:column;
    position:sticky;
    top:0;
    height:100vh;
    border-right:1px solid var(--line);
  }
  .brand{
    display:block;
    padding:0 6px 28px;
    font-family:var(--font-display);
    font-weight:700;
    font-size:23px;
    letter-spacing:-.01em;
    color:var(--accent);
  }
  .brand small{
    display:block; font-family:var(--font-mono); font-weight:500;
    font-size:10px; letter-spacing:.09em; text-transform:uppercase;
    color:var(--ink-faint); margin-top:6px;
  }

  .nav-list{display:flex; flex-direction:column; gap:1px; margin-top:4px;}
  .nav-item{
    display:flex; align-items:center; gap:12px;
    padding:11px 12px; border-radius:var(--radius-sm);
    color:var(--ink-soft);
    font-weight:500; font-size:14.5px;
    cursor:pointer; border:none; background:transparent;
    text-align:left; width:100%;
    transition: background .12s ease, color .12s ease;
  }
  .nav-item svg{flex-shrink:0; opacity:.75;}
  .nav-item:hover{background:var(--surface-soft); color:var(--ink);}
  .nav-item.active{background:var(--accent); color:#fff;}
  .nav-item.active svg{opacity:1;}

  .sidebar-foot{margin-top:auto; padding-top:18px; border-top:1px solid var(--line);}
  .reset-link{
    background:none; border:none; color:var(--ink-faint);
    font-size:12px; cursor:pointer; padding:6px; text-decoration:underline;
    text-underline-offset:3px;
  }
  .reset-link:hover{color:var(--ink);}

  /* ===== Mobile bottom nav ===== */
  .bottom-nav{display:none;}

  /* ===== Main ===== */
  .main{
    padding:30px 40px 90px;
    max-width:1120px;
    width:100%;
    margin:0 auto;
  }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    gap:16px; flex-wrap:wrap; margin-bottom:26px;
  }
  .topbar-title{font-family:var(--font-display); font-size:24px; font-weight:700; letter-spacing:-.01em;}
  .topbar-right{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}

  .level-switch{
    display:flex; border:1px solid var(--line);
    border-radius:var(--radius-sm); padding:0; gap:0; overflow:hidden;
  }
  .level-switch button{
    border:none; border-right:1px solid var(--line); background:var(--bg);
    padding:9px 15px;
    font-weight:500; font-size:12.5px; color:var(--ink-soft); cursor:pointer;
    transition: background .12s, color .12s;
  }
  .level-switch button:last-child{border-right:none;}
  .level-switch button:hover{background:var(--surface-soft); color:var(--ink);}
  .level-switch button.active{background:var(--accent); color:#fff;}

  .stat-pill{
    display:flex; gap:6px; align-items:center; background:var(--bg);
    border:1px solid var(--line); padding:8px 13px; border-radius:var(--radius-sm);
    font-family:var(--font-mono); font-size:12px; font-weight:500; color:var(--ink-soft);
  }
  .stat-pill b{font-family:var(--font-mono); font-weight:700; color:var(--ink);}

  /* ===== Views ===== */
  .view{display:none;}
  .view.active{display:block; animation: fadein .35s ease;}
  @keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){
    .view.active{animation:none;}
    *{transition:none !important; animation:none !important;}
  }

  /* ===== Hero ===== */
  .hero{
    position:relative; overflow:hidden;
    background: var(--accent);
    border-radius: var(--radius-lg);
    padding:40px 40px 36px;
    color:#fff;
    margin-bottom:34px;
  }
  .hero-inner{position:relative; z-index:1; display:flex; justify-content:space-between; align-items:flex-end; gap:28px; flex-wrap:wrap;}
  .hero h1{font-family:var(--font-display); font-size:clamp(25px,3.4vw,36px); color:#fff; margin-bottom:10px; letter-spacing:-.015em; line-height:1.2;}
  .hero p{font-size:14.5px; color:rgba(255,255,255,.88); max-width:460px; line-height:1.6;}
  .hero-ring{flex-shrink:0;}
  .hero-stat{text-align:right;}
  .hero-stat .num{font-family:var(--font-display); font-size:44px; font-weight:700; line-height:1; color:#fff;}
  .hero-stat .lbl{font-family:var(--font-mono); font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:rgba(255,255,255,.5); margin-top:7px;}

  /* ===== Cards / grids ===== */
  .section-title{display:flex; align-items:baseline; justify-content:space-between; margin:6px 0 18px; gap:14px;}
  .section-title h2{font-family:var(--font-display); font-size:19px; font-weight:700; letter-spacing:-.01em;}
  .section-title span{font-size:11px; color:var(--ink-faint); font-family:var(--font-mono); letter-spacing:.05em; text-transform:uppercase;}

  .module-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; margin-bottom:34px;}
  .module-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md);
    padding:22px; cursor:pointer; transition: border-color .12s ease, background .12s ease;
    display:flex; flex-direction:column; gap:9px;
  }
  .module-card:hover{border-color:var(--accent); background:var(--surface-soft);}
  .module-card .icon-badge{
    width:36px; height:36px; border-radius:var(--radius-sm); display:flex; align-items:center; justify-content:center;
    background:var(--accent-soft); color:var(--accent); border:1px solid transparent;
  }
  .module-card h3{font-family:var(--font-display); font-size:17px; font-weight:700; line-height:1.3;}
  .module-card p{font-size:13px; color:var(--ink-soft); line-height:1.55;}
  .module-card .prog{font-size:10.5px; font-family:var(--font-mono); color:var(--ink-faint); font-weight:500; letter-spacing:.04em; text-transform:uppercase;}

  .panel{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md);
    padding:30px 32px; margin-bottom:20px;
  }

  /* generic small buttons */
  .btn{
    border:1px solid transparent; border-radius:var(--radius-sm); padding:10px 20px;
    font-weight:500; font-size:13.5px; font-family:var(--font-body);
    cursor:pointer; transition: background .12s ease, color .12s ease, border-color .12s ease;
    display:inline-flex; align-items:center; gap:8px;
  }
  .btn-primary{background:var(--accent); color:#fff; border-color:var(--accent);}
  .btn-primary:hover{background:var(--accent-deep); border-color:var(--accent-deep);}
  .btn-ghost{background:var(--bg); color:var(--ink); border-color:var(--line);}
  .btn-ghost:hover{border-color:var(--accent); color:var(--accent); background:var(--surface-soft);}
  .btn-warm{background:var(--bg); color:var(--accent); border-color:var(--accent);}
  .btn-warm:hover{background:var(--accent); color:#fff;}
  .btn:disabled{opacity:.35; cursor:not-allowed;}
  .btn:disabled:hover{background:var(--bg); color:var(--ink); border-color:var(--line);}
  .btn-sm{padding:7px 14px; font-size:12.5px;}

  .divider-star{display:flex; align-items:center; margin:26px 0;}
  .divider-star::before{content:""; height:1px; background:var(--line); flex:1;}

  /* Flashcards */
  .flashcard-wrap{perspective:1400px; width:100%; max-width:400px;}
  .flashcard{position:relative; width:100%; aspect-ratio:4/3; transform-style:preserve-3d; transition:transform .5s ease; cursor:pointer;}
  .flashcard.flipped{transform:rotateY(180deg);}
  .face{position:absolute; inset:0; backface-visibility:hidden; border-radius:var(--radius-md); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:26px; text-align:center;}
  .face.front{background:var(--surface); border:1px solid var(--accent);}
  .face.back{background:var(--accent); color:#fff; transform:rotateY(180deg);}

  /* Dictation / Speaking exercise blocks */
  .ex-block{border:1px solid var(--line); border-radius:var(--radius-md); padding:22px; margin-bottom:14px; background:var(--surface);}
  .ex-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:10px; flex-wrap:wrap;}
  .ex-num{font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint); letter-spacing:.05em; text-transform:uppercase;}
  textarea, input[type=text]{
    width:100%; border:1px solid var(--line); border-radius:var(--radius-sm); padding:12px 14px;
    font-family:var(--font-body); font-size:14.5px; background:var(--bg); color:var(--ink);
    resize:vertical;
  }
  textarea:focus, input[type=text]:focus{outline:none; border-color:var(--accent);}
  .feedback{margin-top:12px; padding:13px 15px; border-radius:var(--radius-sm); font-size:13.5px; line-height:1.55; border:1px solid var(--line);}
  .feedback.good{background:var(--good-bg); color:var(--good); border-color:var(--good);}
  .feedback.bad{background:var(--bad-bg); color:var(--bad); border-color:var(--bad);}
  .word-chip{display:inline-block; padding:2px 7px; border-radius:var(--radius-sm); margin:2px 3px 2px 0; font-size:13.5px; font-family:var(--font-mono);}
  .word-chip.ok{background:var(--good-bg); color:var(--good);}
  .word-chip.no{background:var(--bad-bg); color:var(--bad); text-decoration:line-through;}
  .mic-btn{
    width:60px; height:60px; border-radius:50%; border:1px solid var(--accent); background:var(--bg); color:var(--accent);
    font-size:22px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition: background .15s, color .15s;
  }
  .mic-btn:hover{background:var(--surface-soft);}
  .mic-btn.listening{background:var(--accent); color:#fff; animation: pulse 1.2s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(37,99,235,.35);}70%{box-shadow:0 0 0 15px rgba(37,99,235,0);}100%{box-shadow:0 0 0 0 rgba(37,99,235,0);}}
  .score-badge{font-family:var(--font-mono); font-weight:700; font-size:14px; padding:5px 12px; border-radius:var(--radius-sm); border:1px solid currentColor;}
  .hint-chip{display:inline-block; background:var(--surface-soft); color:var(--ink-soft); border:1px solid var(--line); font-family:var(--font-mono); font-size:11.5px; padding:4px 9px; border-radius:var(--radius-sm); margin:3px 4px 3px 0;}
  .word-count{font-family:var(--font-mono); font-size:12.5px; color:var(--ink-soft); margin-top:6px;}
  .glossary-item{display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px dashed var(--line); font-size:13.5px;}
  .glossary-item:last-child{border-bottom:none;}
  .article-text{
    font-family:var(--font-read);
    font-size:var(--article-fs, 17px); line-height:1.75; margin-bottom:6px; color:var(--ink);
  }
  .article-quote{
    border-left:3px solid var(--accent); padding:4px 0 4px 20px; margin:24px 0;
    font-family:var(--font-read); font-style:italic; font-weight:700;
    font-size:calc(var(--article-fs, 17px) * 1.04);
    color:var(--ink); line-height:1.6;
  }
  .article-byline{margin-bottom:20px; padding-bottom:16px; border-bottom:1px solid var(--line);}
  .article-byline b{font-size:13.5px; font-family:var(--font-body); font-weight:600;}
  .article-byline span{display:block; font-size:12px; color:var(--ink-soft); margin-top:2px;}
  details.qa{border:1px solid var(--line); border-radius:var(--radius-sm); padding:10px 14px; margin-top:10px; background:var(--surface-soft);}
  details.qa summary{cursor:pointer; font-weight:600; font-size:13.5px;}

  /* Article list badges */
  .badge-row{display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-bottom:10px;}
  .badge{
    font-family:var(--font-mono); font-size:10px; font-weight:600; padding:3px 8px;
    border-radius:var(--radius-sm); letter-spacing:.05em; text-transform:uppercase;
    border:1px solid var(--line); color:var(--ink-soft); background:var(--bg);
  }
  .badge-level{border-color:var(--accent); color:var(--accent);}
  .badge-new{background:var(--accent); color:#fff; border-color:var(--accent);}
  .badge-time{color:var(--ink-faint);}
  .badge-done{border-color:var(--good); color:var(--good);}

  /* CEFR filter pills with counts */
  .cefr-pill-count{opacity:.5; font-size:10.5px; margin-left:4px; font-family:var(--font-mono);}

  /* Font size control */
  .font-ctrl{display:flex; align-items:center; border:1px solid var(--line); border-radius:var(--radius-sm); overflow:hidden;}
  .font-ctrl button{
    border:none; border-right:1px solid var(--line); background:var(--bg); width:32px; height:30px; cursor:pointer;
    font-family:var(--font-body); font-weight:600; color:var(--ink-soft); font-size:12.5px;
  }
  .font-ctrl button:last-child{border-right:none;}
  .font-ctrl button:hover{background:var(--accent); color:#fff;}

  /* Reading nav (prev/next between articles) */
  .read-nav{display:flex; justify-content:space-between; margin-top:26px; padding-top:20px; border-top:1px solid var(--line); gap:10px;}
  .read-nav button:disabled{opacity:.3; cursor:not-allowed;}

  /* TRKI reading comprehension.
     Signature element: the lettered options are drawn as answer-sheet bubbles —
     the same artifact a student fills in on the real ТРКИ paper. The bubble fills
     solid on selection, so the answered state reads at a glance like a marked sheet. */
  .trki-item{border-top:1px solid var(--line); padding:22px 0 24px; margin:0; background:transparent;}
  .trki-item:first-child{border-top:none; padding-top:6px;}
  .trki-stem{
    font-family:var(--font-read); font-size:16px; font-weight:700;
    margin-bottom:16px; line-height:1.5; color:var(--ink);
  }
  .trki-options{display:flex; flex-direction:column; gap:2px;}
  .trki-opt{
    display:flex; gap:13px; align-items:flex-start; text-align:left; width:100%;
    border:1px solid transparent; background:transparent; color:var(--ink);
    font-family:var(--font-read); font-size:15px; line-height:1.5; padding:9px 12px;
    border-radius:var(--radius-sm); cursor:pointer;
    transition: background .12s ease, border-color .12s ease;
  }
  .trki-opt:hover{background:var(--surface-soft);}
  .trki-opt .letter{
    flex-shrink:0; width:25px; height:25px; border-radius:50%;
    border:1.5px solid #C3CFDF; color:var(--ink-soft);
    font-family:var(--font-mono); font-weight:600; font-size:11.5px;
    display:flex; align-items:center; justify-content:center; margin-top:1px;
    transition: background .12s ease, border-color .12s ease, color .12s ease;
  }
  .trki-opt:hover .letter{border-color:var(--accent); color:var(--accent);}

  .trki-opt.picked-correct{background:var(--good-bg); border-color:var(--good);}
  .trki-opt.picked-correct .letter{background:var(--good); border-color:var(--good); color:#fff;}
  .trki-opt.picked-wrong{background:var(--bad-bg); border-color:var(--bad);}
  .trki-opt.picked-wrong .letter{background:var(--bad); border-color:var(--bad); color:#fff;}
  .trki-opt.reveal-correct{border-color:var(--good);}
  .trki-opt.reveal-correct .letter{border-color:var(--good); color:var(--good);}
  .trki-opt[disabled]{cursor:default;}
  .trki-opt[disabled]:hover{background:transparent;}
  .trki-opt.picked-correct[disabled]:hover{background:var(--good-bg);}
  .trki-opt.picked-wrong[disabled]:hover{background:var(--bad-bg);}

  .trki-score{
    display:flex; align-items:center; justify-content:space-between; padding:16px 20px;
    background:var(--accent); color:#fff; border-radius:var(--radius-sm); margin-top:18px;
    font-weight:500; font-size:14px;
  }
  .trki-score b, .trki-score span:last-child{font-family:var(--font-mono); font-weight:600;}

  @media (max-width: 880px){
    .app-shell{grid-template-columns:1fr;}
    .sidebar{display:none;}
    .main{padding:20px 16px 96px;}
    .bottom-nav{
      display:flex; position:fixed; bottom:0; left:0; right:0; z-index:50;
      background: var(--bg); justify-content:space-around; padding:7px 4px 9px;
      border-top:1px solid var(--line);
    }
    .bottom-nav button{
      background:none; border:none; color:var(--ink-faint); display:flex; flex-direction:column;
      align-items:center; gap:3px; font-size:9.5px; font-weight:500; cursor:pointer; padding:4px 6px;
    }
    .bottom-nav button.active{color:var(--accent);}
    .bottom-nav button svg{opacity:.75;}
    .bottom-nav button.active svg{opacity:1;}
  }
</style>
</head>
<body>

<div class="app-shell">
  <nav class="sidebar" aria-label="Asosiy navigatsiya">
    <div class="brand">
      Ruscha
      <small>Rus tili · ТРКИ</small>
    </div>
    <div class="nav-list" id="navList"></div>
    <div class="sidebar-foot">
      <div id="voicePickerWrap" style="margin-bottom:12px;"></div>
      <button class="reset-link" id="resetBtn">Progressni tozalash</button>
    </div>
  </nav>

  <main class="main">
    <div class="topbar">
      <div class="topbar-title" id="viewTitle">Bosh sahifa</div>
      <div class="topbar-right">
        <div class="level-switch" id="levelSwitch"></div>
        <div class="stat-pill" title="Ketma-ket kunlar">🔥 <b id="streakVal">0</b></div>
        <div class="stat-pill" title="Ball">⭐ <b id="xpVal">0</b></div>
      </div>
    </div>

    <section class="view active" id="view-home"></section>
    <section class="view" id="view-flashcards"></section>
    <section class="view" id="view-dictation"></section>
    <section class="view" id="view-speaking"></section>
    <section class="view" id="view-writing"></section>
    <section class="view" id="view-articles"></section>
  </main>
</div>

<nav class="bottom-nav" id="bottomNav" aria-label="Mobil navigatsiya"></nav>

<script>
/* ===================== app.js ===================== */

const LEVELS = [
  {id:"beginner", label:"Boshlang'ich"},
  {id:"intermediate", label:"O'rta"},
  {id:"advanced", label:"Yuqori"}
];

// Articles follow the official TRKI (ТРКИ — Тест по русскому языку как иностранному) level
// names, since that's the actual certification exam this audience would sit. CEFR shown
// alongside each for orientation.
const CEFR_LEVELS = [
  {id:"a1", label:"Элементарный", cefr:"A1"},
  {id:"a2", label:"Базовый", cefr:"A2"},
  {id:"b1", label:"ТРКИ-1", cefr:"B1"},
  {id:"b2", label:"ТРКИ-2", cefr:"B2"},
  {id:"c1", label:"ТРКИ-3", cefr:"C1"}
];

const DATA = {
  flashcards: {
    beginner: [
      {ru:"Привет", tr:"privyet", uz:"Salom (norasmiy)", ex:"Привет! Как дела?"},
      {ru:"Здравствуйте", tr:"zdrastvuyte", uz:"Assalomu alaykum (rasmiy salom)", ex:"Здравствуйте, меня зовут Азиз."},
      {ru:"Спасибо", tr:"spasiba", uz:"Rahmat", ex:"Спасибо большое за помощь!"},
      {ru:"Пожалуйста", tr:"pajalusta", uz:"Marhamat / Iltimos", ex:"Пожалуйста, помогите мне."},
      {ru:"Да / Нет", tr:"da / nyet", uz:"Ha / Yo'q", ex:"Да, я согласен."},

        isNew:true,
        title:"Почему осенью нам грустно?",
        subtitle:"Где искать гормон счастья и чем, кроме хандры, опасен его недостаток?",
        author:{name:"Светлана Орлова", role:"доктор медицинских наук, профессор, заведующая кафедрой клинической нутрициологии"},
        blocks:[
          {type:"p", text:"С наступлением осени на многих людей без видимой причины накатывает тоска, и чем реже выглядывает солнце, тем она сильнее. Этому есть научное обоснование."},
          {type:"p", text:"В человеческом организме есть фермент, который переводит аминокислоту триптофан в серотонин — гормон счастья. Катализатором процесса является витамин D, который вырабатывается в коже под действием солнечных, а точнее, ультрафиолетовых лучей. Когда его не хватает, у человека портится настроение, он хандрит и раздражается по пустякам, и даже поводов для радости у него как будто становится меньше."},
          {type:"q", text:"Самый «депрессивный» период — с середины октября по февраль."},
          {type:"p", text:"В это время многие жалуются на подавленное и полусонное состояние. Все потому, что из-за особенностей атмосферы осенью и зимой солнечные лучи с трудом достигают земли. К тому же в это время года человек полностью одет, а значит, кожа не получает достаточно витамина D. Даже поход в солярий не способен решить проблему — витамин D в этом случае хоть и образуется, но в недостаточном количестве. Зато можно получить проблему гораздо опаснее — развитие меланомы."},
          {type:"p", text:"Нехватка витамина D сказывается не только на настроении, но и на иммунитете. Защитные функции организма ослабевают, и человек начинает чаще болеть, что тоже никак не способствует поднятию духа."},
          {type:"p", text:"Больше всего осеннему унынию подвержены люди, чья работа связана с постоянным стрессом. Причем женщины мрачную погоду переносят тяжелее. А для метеозависимых людей, особенно пожилых, низкое давление, которое свойственно осенней погоде, и отсутствие ярких красок вовсе становится испытанием."},
          {type:"p", text:"Помочь организму просто: спать достаточное количество часов, отдыхать, гулять, вести активный образ жизни и, конечно же, правильно питаться. Хоть основной источник витамина D — солнце, он также поступает в организм из продуктов питания. Например, содержится в сливочном масле и рыбе. Доступен и в форме БАДов. Так что нехватку солнечного витамина вполне можно восполнить."}
        ],

          {term:"Катализатор", uz:"katalizator", def:"Вещество, ускоряющее какой-то процесс.", ex:"Витамин D — катализатор выработки серотонина."},

      {
        id:"muzyka-emotsii",
        isNew:true,
        title:"Почему музыка заставляет нас испытывать эмоции",
        subtitle:"Под одну мелодию мы плачем, другая вызывает радость. Так происходит у всех? И что лучше слушать в важные моменты жизни?",
        blocks:[
          {type:"p", text:"Бывает, включишь в машине радио, слышишь знакомую мелодию, и на глазах появляются слезы. Или, наоборот, при первых звуках возникает радость и желание созидать. Это влияние музыки."},
          {type:"p", text:"По сути, музыка представляет собой организованный шум, который имеет три характеристики: частоту, ритм, громкость. От их сочетания зависит выброс гормонов, которые определяют эмоциональное состояние человека."},
          {type:"h", text:"Какая музыка повышает настроение"},
          {type:"p", text:"Наиболее приятной считается музыка, максимально воспроизводящая ритм сердца — 120 ударов в минуту. Он сохранен нами с пренатального периода — как ритм биения сердца матери, ассоциирующийся с безопасностью. Такая музыка активирует отдел мозга под названием «прилежащее ядро». Это стимулирует выработку двух гормонов: дофамина, отвечающего за удовольствие и мотивацию, интерес к жизни, и тироксина, который повышает уровень энергии."},
          {type:"p", text:"Из классики к такой музыке относятся, к примеру, Григ и Моцарт. Кстати, такой же ритм используется в сельском хозяйстве для повышения удоев."},
          {type:"p", text:"Для улучшения настроения отлично подходят афроамериканские ритмы — регги, блюзы. Они стимулируют выработку гормона окситоцина, что пробуждает либидо и настрой на романтику и доверие."},
          {type:"h", text:"Какую музыку слушать в периоды грусти и обиды"},
          {type:"p", text:"Если хочется дать выход переживаниям, можно послушать орган Баха, а в версии лайт — Eric Clapton «Tears in Heaven», R.E.M. «Everybody Hurts», Баста «Сансара». Эта музыка стимулирует выработку окситоцина с опиоидами, что придает душевным переживаниям мистико-философский окрас. Человек страдает, но при этом видит, что жизнь — это не только боль. Норадреналин с адреналином и тестостероном — это история выплеска агрессии. Для этого можно включить громче Nirvana «Negative Creep», The Prodigy «Smack My Bitch Up», Grimes «Kill V. Maim», Linkin Park «Bleed it Out», Muse «Assassin». Выброс агрессии происходит за счет сочетания темпа 140–160 ударов в минуту с повышенной громкостью. За рулем такую музыку лучше не слушать, так как она приводит к агрессивной манере вождения. Но есть в ней и положительный момент: можно поддерживать тяжелый физический труд или тренировки с большими весами."},
          {type:"h", text:"О чем говорят предпочтения в музыке"},
          {type:"p", text:"Предпочтения в музыке показывают интеллект, характер, жизненные стратегии человека. Так, песни ABBA, The Beatles — это позитивная музыка, имеющая темп 120–140 ударов в минуту. Человек, которому нравятся эти исполнители, открыт, излишне сентиментален, плохо переносит глупость, ограниченность суждений и негативизм. Но делать обратные выводы о характере не стоит. Предпочтения у всех разные."},
          {type:"p", text:"При этом музыка вызывает у многих людей одинаковые эмоции, на что влияет в том числе генетическая память. Специальная структура головного мозга — лимбическая система — содержит память нескольких поколений. Она особенно важна для выживания. Когда вы видите в лесу корягу, похожую на змею, отскакиваете, потому что работает лимбическая система: по опыту предков вы знаете, что укус змеи может быть смертелен."},
          {type:"p", text:"Треки, сохраненные в нашей генетической памяти, уже не способствуют выживанию, но они есть. Если человеку нравится, к примеру, скандинавская музыка, скорее всего, генетическая экспертиза покажет, что среди его предков были скандинавы. Видимо, мозг улавливает знакомые ноты, и музыка воспринимается как своя, родная."},
          {type:"p", text:"Наиболее сильное впечатление производит та музыка, которая обманывает наши ожидания, когда тихая мелодия, например, сменяется оглушительно громкой. Человеческий мозг настроен на новизну. Поэтому монотонность вызывает потерю интереса, а небольшой диапазон новизны, чередующейся с чем-то привычным, — его ростом. На новизну вырабатывается дофамин, а на узнавание знакомого — серотонин и эндорфин, которые иногда называют гормонами удовольствия."},
          {type:"h", text:"Как музыка влияет на организм человека"},
          {type:"p", text:"Музыка калибрует сердечный ритм, действует положительно на центральную, вегетативную нервные системы, улучшая работу внутренних органов и систем."},
          {type:"p", text:"Полезно слушать ее и во время занятий спортом. Это доказало исследование, проведенное в 2012 году учеными Университета Шеффилд — Халлам в Великобритании. Велосипедисты, слушающие музыку во время тренировки, при такой же нагрузке потребляют на 7% меньше кислорода, чем те, кто тренируются в тишине."},
          {type:"p", text:"Так что, собираясь в следующий раз на велопрогулку, не забудьте загрузить в плеер специальные треки. Желательно без слов, чтобы мозг активировал подкорковые отделы. Например, подойдут OK Go «Here it Goes Again», Ariana Grande «Be Me Baby», Katy Perry «One Of The Boys» и другие композиции с частотой 145 ударов в минуту."},
          {type:"p", text:"Консультант: Марина Спиранде, психолог-психосоматолог, консультативный член Психологической лиги."}
        ],

          {type:"p", text:"Многие считают, что любая небольшая собака выводилась как комнатная, то есть она по умолчанию доброжелательная и спокойная. Поэтому ярость с ее стороны производит большое впечатление. Хотя далеко не каждый небольшой пес — милый ласковый компаньон. Такса — охотник на зверя в норе, поэтому у представителей этой породы быстрая реакция и вспыльчивый характер."},

        title:"Почему кофе бодрит не всех?",
        subtitle:"В кофе содержится не только кофеин, но и теобромин. Поэтому напиток действует на человека не так однозначно, как многие думают. Особенно, если кофе растворимый.",
        author:{name:"Маргарита Аристархова", role:"врач, кандидат медицинских наук"},
        blocks:[
          {type:"p", text:"Большинство людей начинает утро с чашечки этого ароматного напитка, чтобы взбодриться. Но есть те, кто заканчивает ей вечер, чтобы снять накопившееся за день напряжение и быстрее заснуть. Такой двоякий эффект оказывается потому, что в составе кофе находятся два алкалоида: бодрящий кофеин и теобромин, который обладает успокаивающим и усыпляющим действием. Обычно кофеина больше, но в растворимом кофе эти алкалоиды содержатся примерно в равной пропорции. А чаще всего люди пьют именно его."},
          {type:"p", text:"Отсюда «эффект 30-го километра», который прежде всего касается дальнобойщиков и тех, кто едет на дальнее расстояние. Ученые выявили, что максимальное количество аварий происходит в промежутке от 30 до 50 км от места последней стоянки. И тому есть объяснение. Перед отправлением в рейс водитель выпивает чашку растворимого кофе (а то и несколько) и берет с собой термос с этим напитком. Поначалу чувствует себя бодро, так как на организм влияет кофеин, но уже через 25 минут в действие вступает теобромин, который начинает усыплять. За это время водитель в среднем успевает проехать от 30 до 50 км. В современных фурах кабины удобные, поэтому человека укачивает независимо от того, выспался он или нет. Концентрация внимания снижается, можно даже заснуть за рулем."},

          {type:"p", text:"Многое зависит от самого напитка. Так, взбодриться с помощью латте, капучино или глясе не удастся, потому что кофеин скрепляется с молекулами белка, а это сильно снижает скорость его усвоения. В результате в кровь он поступает медленно, в незначительном объеме и не оказывает на нервную систему возбуждающего воздействия. А теплый жирный напиток, каким является кофе с молоком, еще и усыпляет."},
          {type:"p", text:"В полной мере почувствовать бодрящий эффект кофеина не смогут и те, кто пьет много воды. В их организмах циркулирует большое количество крови, в результате чего концентрация кофеина ниже, чем у тех, кто пьет мало жидкости."},
          {type:"p", text:"Если же употреблять кофе в сочетании со свежевыжатым грейпфрутовым соком, действие кофеина будет сильнее. Вещества, содержащиеся в цитрусовых, блокируют определенные печеночные ферменты. В итоге усвоению кофеина ничто не препятствует и он сильнее воздействует на мозг и нервную систему."},
          {type:"p", text:"Таким образом, на каждого кофе оказывает свой эффект — и каким он будет, можно понять только на практике."}

          {type:"p", text:"В наши дни цветы все чаще оказываются в вазе, поднимая настроение одним своим видом. Исследователи из Колледжа сельскохозяйственных наук Университета Джорджии решили выяснить, почему так происходит и что на самом деле мы получаем от букетов. Команда ученых опросила больше 8500 человек по всей стране и оказалось, что люди все чаще покупают цветы не для праздников, а просто так."},

          {type:"p", text:"В России розы прочно занимают первое место, захватывая 49% всего цветочного рынка. Это почти 2 млрд штук в год. На втором месте с большим отрывом расположились хризантемы (14% рынка), а замыкают тройку гвоздики (11%)."},

          {type:"p", text:"Ученые из Университета Рутгерса в Нью-Джерси провели десятимесячное исследование и доказали, что регулярное присутствие цветов в доме вызывает стойкое чувство благодарности, радости и повышает удовлетворенность жизнью в целом."},

          {type:"p", text:"У большинства людей при слове «верблюд» перед глазами встает картинка из детских книжек — одинокое животное посреди песчаных дюн меланхолично жует сухую колючку. С появлением коротких роликов в социальных сетях это представление только укрепилось, ведь видео, где «корабль пустыни» с хрустом и без видимых страданий заглатывает огромный зеленый кактус целиком, мгновенно становятся вирусными. На самом деле кактусы не входят в привычный рацион верблюдов, а колючая диета — лишь вынужденная мера."},

          {type:"p", text:"В условиях экстремальной засухи кактусы и другие суккуленты превращаются для них в бесценный источник влаги. Эти мясистые растения накапливают в себе чистую воду, помогая животным поддерживать водный баланс. Кроме того, в них много клетчатки и минералов. Однако биологи подчеркивают, что это лишь запасной вариант. В обычное время верблюды предпочтут обычную сухую траву. Но если наступает голод, эти выносливые млекопитающие могут переключиться не только на кактусы, но даже на кости и падаль."},
          {type:"h", text:"Как верблюды едят колючки и не ранят пасть"},

          {type:"p", text:"Эти сосочки направлены строго назад, в сторону пищевода. Они работают как конвейерная лента: захватывают жесткий кактус и продвигают его напрямую в глотку, не позволяя острым иглам вонзаться в мягкие ткани или застревать во рту. Кроме того, внутренние стенки пасти покрыты плотной, грубой кожистой тканью, которую практически невозможно поцарапать или проколоть."},
          {type:"h", text:"Какую роль во время еды играет слюна"},

          {type:"p", text:"За долгие миллионы лет жесткой эволюции в изоляции от сочных пастбищ эти млекопитающие просто научились игнорировать дискомфорт и терпеть покалывание. Желание получить ценные питательные вещества, сахар и, главное, живительную влагу из кактуса полностью перевешивает чувство боли."}

  }catch(e){ /* no saved state yet */ }
  applyStreak();
  renderAll();
  renderVoicePicker();
  if('speechSynthesis' in window) speechSynthesis.getVoices(); // kick off async voice loading in some browsers
}

async function saveState(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(state));
  }catch(e){ console.error("Saqlashda xatolik:", e); }
}

function todayStr(){ return new Date().toISOString().slice(0,10); }

function applyStreak(){
  const today = todayStr();
  if(state.lastActive === today) return;
  const y = new Date(); y.setDate(y.getDate()-1);
  const yesterday = y.toISOString().slice(0,10);
  if(state.lastActive === yesterday){ /* streak continues once activity logged today */ }
  else if(state.lastActive !== today){ /* gap: will reset on next activity */ }
}

function logActivity(points){
  const today = todayStr();
  if(state.lastActive !== today){
    const y = new Date(); y.setDate(y.getDate()-1);
    const yesterday = y.toISOString().slice(0,10);
    state.streak = (state.lastActive === yesterday) ? state.streak + 1 : 1;
    state.lastActive = today;
  }
  state.xp += points;
  saveState();
  updateStatPills();
}

function updateStatPills(){
  document.getElementById("streakVal").textContent = state.streak;
  document.getElementById("xpVal").textContent = state.xp;
}

async function resetProgress(){
  if(!confirm("Barcha progress o'chiriladi. Davom etasizmi?")) return;
  state = {level:"beginner", streak:0, lastActive:null, xp:0, known:[], fcIndex:{beginner:0,intermediate:0,advanced:0}, dictationDone:[], speakingDone:[], writingDone:[], articleLevel:null, articlesRead:[], preferredVoiceName:null, articleFontScale:1};
  openArticleId = null;

  renderAll();
}

/* ===================== helpers ===================== */
function normalize(s){
  return s.toLowerCase().replace(/[.,!?;:"«»()]/g,"").replace(/\s+/g," ").trim();
}

function escapeHtml(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function levenshtein(a,b){
  const m=a.length, n=b.length;
  const d = Array.from({length:m+1}, (_,i)=>[i,...Array(n).fill(0)]);
  for(let j=0;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      d[i][j] = a[i-1]===b[j-1] ? d[i-1][j-1] : 1 + Math.min(d[i-1][j-1], d[i-1][j], d[i][j-1]);
    }
  }
  return d[m][n];
}

function similarityScore(a,b){
  const na = normalize(a), nb = normalize(b);
  if(na.length===0 && nb.length===0) return 100;
  const dist = levenshtein(na, nb);
  const maxLen = Math.max(na.length, nb.length, 1);
  return Math.round((1 - dist/maxLen) * 100);
}

function wordDiff(target, attempt){
  const t = normalize(target).split(" ");
  const a = normalize(attempt).split(" ");
  return t.map((w,i)=> ({word:w, ok: a[i]===w}));
}

let voicesReady = false;
if('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged = () => { voicesReady = true; renderVoicePicker(); };
}

function getRussianVoices(){
  if(!('speechSynthesis' in window)) return [];
  return speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith("ru"));
}

// Browser TTS quality depends entirely on the voices installed on the person's
// system/browser — we can't add a studio-quality voice ourselves, but we can pick
// the most natural-sounding one automatically, favouring network ("online") voices
// (e.g. Chrome's "Google русский") over the often robotic default local ones.
function getBestRussianVoice(){
  const ru = getRussianVoices();
  if(ru.length === 0) return null;
  if(state.preferredVoiceName){
    const chosen = ru.find(v => v.name === state.preferredVoiceName);
    if(chosen) return chosen;
  }
  const preferredHints = ["google", "yandex", "milena", "katya", "natural", "online"];
  for(const hint of preferredHints){
    const match = ru.find(v => v.name.toLowerCase().includes(hint));
    if(match) return match;
  }
  const online = ru.find(v => v.localService === false);
  if(online) return online;
  return ru[0];
}

function speak(text){
  if(!('speechSynthesis' in window)){ alert("Brauzeringiz ovoz chiqarishni (Text-to-Speech) qo'llab-quvvatlamaydi. Google Chrome'dan foydalanib ko'ring."); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ru-RU";
  u.rate = 0.95;
  u.pitch = 1;
  const voice = getBestRussianVoice();
  if(voice) u.voice = voice;
  speechSynthesis.speak(u);
}

  const wrap = document.getElementById("voicePickerWrap");

        const badgeBg = score>=85 ? 'var(--good-bg)' : (score>=55 ? 'var(--surface-soft)' : 'var(--bad-bg)');
        slot.innerHTML = `<span class="score-badge" style="color:${badgeColor}; background:${badgeBg};">${score}% mos</span>
          <div style="margin-top:6px; font-size:13.5px; color:var(--ink-soft);">Siz aytdingiz: <i>"${transcript}"</i></div>`;
        if(score>=60 && !state.speakingDone.includes(id)){ state.speakingDone.push(id); logActivity(8); saveState(); }
      };
      rec.onerror = ()=>{ slot.innerHTML = `<span style="font-size:13px; color:var(--bad);">Mikrofonga ruxsat berilmadi yoki xatolik yuz berdi.</span>`; };
      rec.onend = ()=> micBtn.classList.remove("listening");
      try{ rec.start(); }catch(err){ micBtn.classList.remove("listening"); }
    });
    list.appendChild(block);
  });
}

/* ===================== WRITING ===================== */
async function getAiFeedback(task, userText){
  const prompt = `Siz ruscha tilini o'rgatuvchi mehribon va konstruktiv o'qituvchisiz. Talabaga berilgan topshiriq: "${task}". Talabaning ruscha tilida yozgan matni: """${userText}"""

Iltimos, FAQAT O'ZBEK TILIDA javob bering, quyidagi tuzilishda, jami 120-180 so'z atrofida:
1) Ijobiy tomonlari (2-3 ta jumla)
2) Grammatik/lug'aviy xatolar va tuzatilgan variant (agar xato bo'lmasa, shuni ayting)
3) Umumiy daraja bahosi (past / o'rta / yaxshi / a'lo)

Javobni sodda matn shaklida yozing, sarlavha yoki markdown belgilaridan foydalanmang.`;

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      messages: [{role:"user", content: prompt}]
    })
  });
  if(!response.ok) throw new Error("API xatosi");
  const data = await response.json();
  const text = data.content.filter(b=>b.type==="text").map(b=>b.text).join("\n").trim();
  if(!text) throw new Error("Bo'sh javob");
  return text;
}

function renderWriting(){
  const lvl = state.level;
  const items = DATA.writing[lvl];
  const el = document.getElementById("view-writing");
  el.innerHTML = `
    <div class="section-title"><h2>Yozish mashqi</h2><span>Yozing va sun'iy intellektdan fikr oling</span></div>
    <div id="wrtList"></div>
  `;
  const list = document.getElementById("wrtList");
  items.forEach((item, i)=>{
    const id = lvl+"-"+i;
    const done = state.writingDone.includes(id);
    const block = document.createElement("div");
    block.className = "ex-block";
    block.innerHTML = `
      <div class="ex-head">
        <span class="ex-num">Topshiriq ${i+1} / ${items.length} ${done ? '· ✓ bajarilgan' : ''}</span>
      </div>
      <p style="margin-bottom:10px; font-size:14.5px;">${item.task}</p>
      <div style="margin-bottom:10px;">${item.hint.map(h=>`<span class="hint-chip">${h}</span>`).join("")}</div>
      <textarea rows="6" placeholder="Ruscha yozing..." class="wrtArea"></textarea>
      <div class="word-count"><span class="wc">0</span> so'z (kamida ${item.min})</div>
      <div style="margin-top:10px; display:flex; gap:10px; flex-wrap:wrap;">
        <button class="btn btn-primary btn-sm doneBtn">Tayyor deb belgilash</button>
        <button class="btn btn-warm btn-sm aiBtn">✨ AI'dan fikr olish</button>
      </div>
      <div class="feedback-slot"></div>
    `;
    const area = block.querySelector(".wrtArea");
    const wc = block.querySelector(".wc");
    area.addEventListener("input", ()=>{
      const n = area.value.trim().split(/\s+/).filter(Boolean).length;
      wc.textContent = area.value.trim() ? n : 0;
    });
    block.querySelector(".doneBtn").addEventListener("click", ()=>{
      if(!area.value.trim()){ alert("Iltimos, avval biror narsa yozing."); return; }
      if(!state.writingDone.includes(id)){ state.writingDone.push(id); logActivity(10); saveState(); }
      block.querySelector(".ex-num").textContent = `Topshiriq ${i+1} / ${items.length} · ✓ bajarilgan`;
    });
    block.querySelector(".aiBtn").addEventListener("click", async ()=>{
      const btn = block.querySelector(".aiBtn");
      const slot = block.querySelector(".feedback-slot");
      if(!area.value.trim()){ alert("Iltimos, avval biror narsa yozing."); return; }
      btn.disabled = true;
      slot.innerHTML = `<div class="feedback" style="background:var(--surface-soft); color:var(--ink-soft);">Fikr tayyorlanmoqda...</div>`;
      try{
        const feedback = await getAiFeedback(item.task, area.value.trim());
        slot.innerHTML = `<div class="feedback good" style="white-space:pre-wrap;">${feedback}</div>`;
      }catch(err){
        slot.innerHTML = `<div class="feedback bad">Fikr olishda xatolik yuz berdi. Birozdan keyin qayta urinib ko'ring.</div>`;
      }
      btn.disabled = false;
    });
    list.appendChild(block);
  });
}

/* ===================== ARTICLES (CEFR-based) ===================== */
function articleWordCount(article){
  return article.blocks.filter(b=>b.type==="p"||b.type==="q").reduce((sum,b)=> sum + b.text.trim().split(/\s+/).length, 0);
}

function findArticle(id){
  for(const lvl of CEFR_LEVELS){
    const found = DATA.articles[lvl.id].find(a=>a.id===id);
    if(found) return {article:found, level:lvl.id};
  }
  return null;
}

function renderArticles(){
  // pick a sensible default CEFR level the first time: the first level that actually has content
  if(!state.articleLevel){
    const withContent = CEFR_LEVELS.find(l => DATA.articles[l.id].length>0);
    state.articleLevel = withContent ? withContent.id : "all";
  }

  const el = document.getElementById("view-articles");

  if(openArticleId){
    renderArticleDetail(el, openArticleId);
    return;
  }

  const lvl = state.articleLevel;
  const list = lvl==="all"
    ? CEFR_LEVELS.flatMap(l => DATA.articles[l.id].map(a => ({...a, _level:l.id})))
    : DATA.articles[lvl].map(a => ({...a, _level:lvl}));

  el.innerHTML = `
    <div class="section-title"><h2>Maqolalar</h2><span>${state.articlesRead.length}/${articlesTotal()} o'qilgan</span></div>
    <div class="level-switch" id="cefrSwitch" style="margin-bottom:22px; width:fit-content; flex-wrap:wrap;"></div>
    <div id="artGrid" class="module-grid"></div>
  `;

  const cefrEl = document.getElementById("cefrSwitch");
  const tabs = [{id:"all", label:"Barchasi"}, ...CEFR_LEVELS];
  cefrEl.innerHTML = tabs.map(l => {
    const count = l.id==="all" ? articlesTotal() : DATA.articles[l.id].length;
    return `<button class="${l.id===lvl?'active':''}" data-cefr="${l.id}">${l.label}${l.cefr ? ` <span style="opacity:.6; font-weight:500;">(${l.cefr})</span>`:""}<span class="cefr-pill-count">${count}</span></button>`;
  }).join("");
  cefrEl.querySelectorAll("button").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.articleLevel = btn.dataset.cefr;
      saveState();
      renderArticles();
    });
  });

  const grid = document.getElementById("artGrid");
  if(list.length===0){
    grid.innerHTML = `<div class="panel" style="grid-column:1/-1;"><p style="color:var(--ink-soft);">Bu darajada hozircha maqola yo'q. Tez orada qo'shiladi — boshqa darajani tanlab ko'ring.</p></div>`;
    return;
  }
  grid.innerHTML = list.map(a => {
    const read = state.articlesRead.includes(a.id);
    const mins = readingMinutes(a);
    return `
      <div class="module-card" data-art="${a.id}">
        <div class="badge-row">
          <span class="badge badge-level">${CEFR_LEVELS.find(l=>l.id===a._level).label} (${CEFR_LEVELS.find(l=>l.id===a._level).cefr})</span>
          ${a.isNew ? '<span class="badge badge-new">YANGI</span>' : ""}
          ${read ? '<span class="badge badge-done">✓ o\'qilgan</span>' : ""}
        </div>
        <h3>${a.title}</h3>
        <p>${a.subtitle ? a.subtitle : ""}</p>
        <div class="prog">📖 ~${mins} daqiqa · ${articleWordCount(a)} so'z</div>
      </div>`;
  }).join("");
  grid.querySelectorAll(".module-card").forEach(card=>{
    card.addEventListener("click", ()=>{
      openArticleId = card.dataset.art;
      renderArticles();
    });
  });
}

const LETTERS = ["А","Б","В","Г","Д"];

function renderArticleDetail(el, articleId){
  const found = findArticle(articleId);
  if(!found){ openArticleId = null; renderArticles(); return; }
  const {article, level} = found;
  const read = state.articlesRead.includes(article.id);
  const fullText = article.blocks.filter(b=>b.type==="p"||b.type==="q").map(b=>b.text).join(" ");
  const mins = readingMinutes(article);

  const siblings = DATA.articles[level];
  const idx = siblings.findIndex(a=>a.id===article.id);
  const prevArt = siblings[idx-1];
  const nextArt = siblings[idx+1];

  el.innerHTML = `
    <button class="btn btn-ghost btn-sm" id="artBack" style="margin-bottom:16px;">← Maqolalarga qaytish</button>
    <div class="panel">
      <div class="badge-row">
        <span class="badge badge-level">${CEFR_LEVELS.find(l=>l.id===level).label} (${CEFR_LEVELS.find(l=>l.id===level).cefr})</span>
        <span class="badge badge-time">📖 ~${mins} daqiqa · ${articleWordCount(article)} so'z</span>
      </div>
      <div class="ex-head">
        <h3 style="font-family:var(--font-read); font-size:27px; font-weight:700; line-height:1.25; letter-spacing:-.01em; max-width:640px;">${article.title}</h3>
        <div style="display:flex; gap:8px; align-items:center;">
          <div class="font-ctrl">
            <button id="fontMinus" title="Matnni kichraytirish">A-</button>
            <button id="fontPlus" title="Matnni kattalashtirish">A+</button>
          </div>
          <button class="btn btn-ghost btn-sm" id="artSpeak">🔊 Tinglash</button>
        </div>
      </div>
      ${article.subtitle ? `<p style="font-family:var(--font-read); font-style:italic; color:var(--ink-soft); font-size:16px; line-height:1.5; margin-bottom:20px; max-width:640px;">${article.subtitle}</p>` : ""}
      ${article.author ? `<div class="article-byline"><b>${article.author.name}</b><span>${article.author.role}</span></div>` : ""}
      <div id="artBody" style="--article-fs:${16.5*state.articleFontScale}px;">
        ${article.blocks.map(b => {
          if(b.type==="h") return `<h4 style="font-family:var(--font-read); font-size:19px; font-weight:700; margin:30px 0 12px; color:var(--ink);">${escapeHtml(b.text)}</h4>`;
          if(b.type==="q") return `<div class="article-quote">${escapeHtml(b.text)}</div>`;
          return `<p class="article-text" style="margin-bottom:14px;">${escapeHtml(b.text)}</p>`;
        }).join("")}
      </div>
      <div class="divider-star"></div>
      <h4 style="font-size:14px; margin-bottom:4px;">Задания к тексту</h4>
      <p style="font-size:12.5px; color:var(--ink-soft); margin-bottom:16px;">Matnni o'qib chiqing. Har bir savol uchun matn mazmunini eng to'liq va aniq ifodalovchi javobni tanlang (TRKI namunasi).</p>
      <div id="trkiList">
        ${article.questions.map((q,i)=>`
          <div class="trki-item" data-idx="${i}" data-correct="${q.correct}">
            <div class="trki-stem">${i+1}. ${q.stem}</div>
            <div class="trki-options">
              ${q.options.map((opt,oi)=>`<button class="trki-opt" data-oi="${oi}"><span class="letter">${LETTERS[oi]})</span><span>${opt}</span></button>`).join("")}
            </div>
          </div>`).join("")}
      </div>
      <div class="trki-score" id="trkiScore" style="display:none;"></div>
      <div style="margin-top:16px;">
        <button class="btn ${read?'btn-primary':'btn-warm'}" id="artDone">${read ? "✓ O'qilgan" : "O'qib bo'ldim"}</button>
      </div>
      <div class="read-nav">
        <button class="btn btn-ghost btn-sm" id="prevArt" ${!prevArt?"disabled":""}>${prevArt ? "← "+prevArt.title : "← Oldingi maqola yo'q"}</button>
        <button class="btn btn-ghost btn-sm" id="nextArt" ${!nextArt?"disabled":""}>${nextArt ? nextArt.title+" →" : "Keyingi maqola yo'q →"}</button>
      </div>
    </div>
  `;

  document.getElementById("artBack").addEventListener("click", ()=>{ openArticleId = null; renderArticles(); });
  document.getElementById("artSpeak").addEventListener("click", ()=> speak(fullText));

  // font-size control: mutate the existing DOM in place so quiz progress isn't lost
  document.getElementById("fontMinus").addEventListener("click", ()=>{
    state.articleFontScale = Math.max(0.8, +(state.articleFontScale - 0.1).toFixed(2));
    saveState();
    document.getElementById("artBody").style.setProperty("--article-fs", (16.5*state.articleFontScale)+"px");
  });
  document.getElementById("fontPlus").addEventListener("click", ()=>{
    state.articleFontScale = Math.min(1.4, +(state.articleFontScale + 0.1).toFixed(2));
    saveState();
    document.getElementById("artBody").style.setProperty("--article-fs", (16.5*state.articleFontScale)+"px");
  });

  // TRKI-style reading comprehension: single-answer multiple choice, instant per-question feedback + running score
  function updateTrkiScore(){
    const items = el.querySelectorAll(".trki-item");
    const answered = [...items].filter(it => it.dataset.answered);
    const correct = answered.filter(it => it.querySelector(".picked-correct")).length;
    const box = document.getElementById("trkiScore");
    if(answered.length===0){ box.style.display="none"; return; }
    box.style.display = "flex";
    if(answered.length < items.length){
      box.innerHTML = `<span>Javob berildi: ${answered.length}/${items.length}</span><span>${correct} ta to'g'ri</span>`;
    } else {
      box.innerHTML = `<span>Natija tayyor! 🎉</span><span>${correct}/${items.length} to'g'ri javob</span>`;
    }
  }
  el.querySelectorAll(".trki-item").forEach(item=>{
    item.querySelectorAll(".trki-opt").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        if(item.dataset.answered) return;
        const correctIdx = item.dataset.correct;
        const pickedIdx = btn.dataset.oi;
        item.dataset.answered = "true";
        item.querySelectorAll(".trki-opt").forEach(b=>{
          b.disabled = true;
          if(b.dataset.oi === correctIdx) b.classList.add(pickedIdx===correctIdx ? "picked-correct" : "reveal-correct");
        });
        if(pickedIdx !== correctIdx) btn.classList.add("picked-wrong");
        updateTrkiScore();
      });
    });
  });

  document.getElementById("artDone").addEventListener("click", ()=>{
    if(!state.articlesRead.includes(article.id)){
      state.articlesRead.push(article.id);
      logActivity(6);
      saveState();
      renderArticleDetail(el, articleId);
    }
  });
  if(prevArt) document.getElementById("prevArt").addEventListener("click", ()=>{ openArticleId = prevArt.id; renderArticles(); });
  if(nextArt) document.getElementById("nextArt").addEventListener("click", ()=>{ openArticleId = nextArt.id; renderArticles(); });
}

/* ===================== INIT ===================== */
document.getElementById("resetBtn").addEventListener("click", resetProgress);
loadState();
</script>
